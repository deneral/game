<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fire Red Quest</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; }
  body { font-family:'Courier New',monospace; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0b0b0b; }
  #stage { position:relative; width:100%; height:100%; max-width:600px; background:#000; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  
  /* UI Elements */
  #textbox {
    position:absolute; left:3%; right:3%; bottom:3%; min-height:22%;
    background:#fff; border:4px solid #2b2b2b; border-radius:6px;
    padding:12px 14px; font-size:15px; line-height:1.4; color:#111;
    display:none; box-shadow:0 4px 0 #000; z-index:25;
  }
  #textbox .prompt { position:absolute; right:14px; bottom:8px; font-size:14px; animation:blink 0.8s infinite; }
  @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  #choices { position:absolute; right:3%; bottom:26%; background:#fff; border:4px solid #2b2b2b; border-radius:6px; display:none; box-shadow:0 4px 0 #000; z-index:25; }
  #choices div { padding:8px 20px; font-size:15px; border-bottom:2px solid #ddd; }
  #choices div:last-child{border-bottom:none;}
  #choices div.sel { background:#ffde5a; }
  
  #hud { position:absolute; top:2%; left:2%; right:2%; display:flex; justify-content:space-between; pointer-events:none; font-size:12px; z-index:10; }
  .panel { background:rgba(255,255,255,0.92); border:2px solid #333; border-radius:5px; padding:4px 8px; color:#111; }
  
  #startScreen, #introScreen {
    position:absolute; inset:0; background:#1a3a1a; color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:20px; z-index:40;
  }
  #startScreen { background:linear-gradient(180deg,#7ec850,#3a7d3a 60%,#1f4d1f); }
  #startScreen h1 { font-size:34px; color:#fff; text-shadow:3px 3px 0 #b02020,-1px -1px 0 #7a1414; margin-bottom:6px; letter-spacing:1px;}
  #startScreen h2 { font-size:15px; color:#fff2b0; margin-bottom:40px; font-weight:normal; }
  #startScreen .prompt2 { font-size:16px; background:rgba(0,0,0,0.35); padding:10px 22px; border-radius:20px; animation:blink 1s infinite; }
  #introScreen { display:none; background:#000; }
  #introScreen p { max-width:480px; font-size:15px; line-height:1.8; margin-bottom:30px; }
  #introScreen .prompt2 { font-size:14px; opacity:0.7; animation:blink 1s infinite; }
  
  #battleScreen { position:absolute; inset:0; z-index:15; display:none; background:#cfe8b0; }
  #battleCanvas { width:100%; height:70%; display:block; }
  #battleMenu {
    position:absolute; left:0; right:0; bottom:0; height:30%; background:#fff;
    border-top:4px solid #2b2b2b; display:flex;
  }
  #battleMenu .bm-left { flex:1.4; padding:10px 14px; font-size:14px; line-height:1.5; color:#111; border-right:3px solid #333; }
  #battleMenu .bm-right { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:8px; }
  .bmbtn { background:#f5f5f5; border:2px solid #333; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:14px; color:#111; font-weight:bold; }
  .bmbtn.sel { background:#ffde5a; }
  #moveList { position:absolute; inset:0; background:#fff; display:none; flex-direction:column; padding:10px; z-index:16; }
  .movebtn { border:2px solid #333; border-radius:6px; padding:8px; margin-bottom:6px; font-size:13px; color:#111; }
  .movebtn.sel { background:#ffde5a; }

  /* Bag System UI */
  #bagScreen { position:absolute; inset:0; background:#e8e8e8; z-index:20; display:none; flex-direction:column; padding:10px; color:#111; }
  #bagHeader { font-size:18px; font-weight:bold; border-bottom:3px solid #333; padding-bottom:8px; margin-bottom:12px; display:flex; justify-content:space-between; }
  #bagBody { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #bagTabs { display:flex; gap:5px; margin-bottom:10px; }
  .bagTab { padding:8px 15px; border:2px solid #333; border-radius:5px 5px 0 0; background:#ccc; font-size:14px; font-weight:bold; }
  .bagTab.sel { background:#fff; border-bottom:2px solid #fff; }

  .bagItem { padding:10px 15px; border-bottom:2px solid #eee; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
  .bagItem.sel { background:#ffde5a; }

  #bagBackBtn { margin-top:10px; padding:12px; background:#ffde5a; border:3px solid #333; border-radius:5px; font-weight:bold; text-align:center; font-size:16px; }

  .shopItem { padding:12px 15px; border-bottom:2px solid #eee; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
  .shopItem.sel { background:#ffde5a; }
  #shopDesc { height:50px; background:#fff; border:3px solid #333; border-radius:5px; padding:10px; font-size:13px; line-height:1.4; margin-bottom:10px; }
  #shopBackBtn { padding:12px; background:#ffde5a; border:3px solid #333; border-radius:5px; font-weight:bold; text-align:center; font-size:16px; }
  
  #genderScreen { position:absolute; inset:0; background:#222; z-index:45; display:none; align-items:center; justify-content:center; flex-direction:column; color:#fff; }

  #nameScreen { position:absolute; inset:0; background:#222; z-index:45; display:none; align-items:center; justify-content:center; flex-direction:column; color:#fff; padding:20px;}
  #nameScreen input { font-size:20px; padding:10px; width:80%; max-width:300px; text-align:center; border-radius:6px; border:none; margin-bottom:20px;}

  #fadeOverlay { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:50; transition:opacity 0.5s; }
  
  #menuBtn { position:absolute; top:2%; right:2%; z-index:12; pointer-events:auto; display:none; }
  #menuBtn div { background:rgba(255,255,255,0.92); border:2px solid #333; border-radius:5px; padding:6px 12px; color:#111; font-size:14px; font-weight:bold; }
</style>
</head>

}

function fadeOut(cb, dur){
  const f = document.getElementById('fadeOverlay');
  f.style.transition = 'opacity '+(dur||400)+'ms';
  f.style.opacity = '1';
  setTimeout(cb, (dur||400)+20);
}

function makeMon(key, level){
  const sp = SPECIES[key];
  const m = {
    key, level, xp:0,
    hp:0, maxHp:0, atk:0, def:0, spd:0,
    moves: sp.moves.slice(0,4),
    fainted:false,
    status: null,
  };
  recalcStats(m);
  m.hp = m.maxHp;
  return m;
}
function recalcStats(m){
  const sp = SPECIES[m.key];
  m.maxHp = Math.floor(sp.base.hp * (m.level/8)) + m.level + 10;
  m.atk = Math.floor(sp.base.atk * (m.level/8)) + 5;
  m.def = Math.floor(sp.base.def * (m.level/8)) + 5;
  m.spd = Math.floor(sp.base.spd * (m.level/8)) + 5;
}

function enterOverworld(mapKey, x, y){
  uiMode='overworld';
  state.map = mapKey;
  state.px = x; state.py = y;
  document.getElementById('hudName').textContent = MAPS[mapKey].name;
  document.getElementById('hudMoney').textContent = '$' + state.money;
  document.getElementById('menuBtn').style.display = 'block';
  if (!MAPS[mapKey].isIndoor) {
    state.lastOutdoorMap = mapKey;
  } else {
    state.returnToMap = state.lastOutdoorMap;
    const m = MAPS[mapKey];
    for(let key in m.warps) {
      const w = m.warps[key];
      if (w.to === state.lastOutdoorMap) {
        state.returnToX = w.x;
        state.returnToY = w.y;
        break;
      }
    }
  }
  requestAnimationFrame(loop);
  if (MAPS[mapKey].onEnter) MAPS[mapKey].onEnter();
}

function curMap(){ return MAPS[state.map]; }
function tileAt(mx,my){
  const m = curMap();
  if(mx<0||my<0||mx>=m.w||my>=m.h) return 1;
  return m.tiles[my][mx];
}
function walkable(mx,my){
  const t = tileAt(mx,my);
  if(!(t===0||t===2||t===3||t===5||t===6)) return false;
  if (curMap().npcs.some(n => n.x === mx && n.y === my)) return false;
  return true;
}
function npcAt(mx,my){
  return curMap().npcs.find(n=>n.x===mx&&n.y===my);
}

canvas.addEventListener('click', onTap);
function screenToTile(evX, evY){
  const r = canvas.getBoundingClientRect();
  const sx = (evX - r.left) / r.width * canvas.width;
  const sy = (evY - r.top) / r.height * canvas.height;
  const cam = getCamera();
  const tx = Math.floor((sx + cam.x) / (TILE*SCALE));
  const ty = Math.floor((sy + cam.y) / (TILE*SCALE));
  return {tx,ty};
}
function getCamera(){
  const m = curMap();
  const mapPxW = m.w*TILE*SCALE, mapPxH = m.h*TILE*SCALE;
  let camX = state.px*TILE*SCALE + TILE*SCALE/2 - canvas.width/2;
  let camY = state.py*TILE*SCALE + TILE*SCALE/2 - canvas.height/2;
  camX = Math.max(0, Math.min(camX, Math.max(0,mapPxW-canvas.width)));
  camY = Math.max(0, Math.min(camY, Math.max(0,mapPxH-canvas.height)));
  return {x:camX,y:camY};
}

let path = [];
function onTap(e){
  if(uiMode!=='overworld') { advanceDialog(); return; }
  const {tx,ty} = screenToTile(e.clientX, e.clientY);
  const n = npcAt(tx,ty);
  if(n && manhattan(n.x,n.y,state.px,state.py)<=2){
    let p = computePath(state.px,state.py, adjacentTile(n,state.px,state.py));
    p.talkTarget = n;
    path = p;
    return;
  }
  if(!walkable(tx,ty)) return;
  path = computePath(state.px, state.py, {x:tx,y:ty});
}
function manhattan(x1,y1,x2,y2){ return Math.abs(x1-x2)+Math.abs(y1-y2); }
function adjacentTile(n, fromX, fromY){
  const opts = [{x:n.x,y:n.y-1},{x:n.x,y:n.y+1},{x:n.x-1,y:n.y},{x:n.x+1,y:n.y}].filter(o=>walkable(o.x,o.y));
  opts.sort((a,b)=>manhattan(a.x,a.y,fromX,fromY)-manhattan(b.x,b.y,fromX,fromY));
  return opts[0]||{x:n.x,y:n.y};
}
function computePath(sx,sy,goal){
  if(sx===goal.x&&sy===goal.y) return [];
  const key=(x,y)=>x+','+y;
  const visited = new Set([key(sx,sy)]);
  const q = [{x:sx,y:sy,path:[]}];
  const maxSteps=400;
  let iter=0;
  while(q.length && iter<2000){
    iter++;
    const cur = q.shift();
    const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
    for(const [dx,dy] of dirs){
      const nx=cur.x+dx, ny=cur.y+dy;
      if(visited.has(key(nx,ny))) continue;
      if(!walkable(nx,ny) && !(nx===goal.x&&ny===goal.y)) continue;
      if(!walkable(nx,ny)) continue;
      const np = cur.path.concat([{x:nx,y:ny}]);
      if(nx===goal.x&&ny===goal.y) return np;
      if(np.length<maxSteps){
        visited.add(key(nx,ny));
        q.push({x:nx,y:ny,path:np});
      }
    }
  }
  return [];
}

/* ============================== GAME LOOP / MOVEMENT ============================== */
let animT = 0;
let frameCount = 0;
function loop(ts){
  if(uiMode!=='overworld'){ return; }
  frameCount++;
  if(!state.moving && path.length>0){
    const next = path.shift();
    tryMoveTo(next.x, next.y, ()=>{
      if(path.length===0 && path.talkTarget){
        const n = path.talkTarget;
        faceToward(n.x,n.y);
        talkToNpc(n);
        delete path.talkTarget; 
      }
    });
  }
  render();
  requestAnimationFrame(loop);
}
function faceToward(nx,ny){
  const dx=nx-state.px, dy=ny-state.py;
  if(Math.abs(dx)>Math.abs(dy)) state.facing = dx>0?"right":"left";
  else state.facing = dy>0?"down":"up";
}
let moveAnim = null;
function tryMoveTo(nx, ny, cb){
  const dx=nx-state.px, dy=ny-state.py;
  if(Math.abs(dx)+Math.abs(dy)!==1) { if(cb)cb(); return; }
  state.facing = dx===1?"right":dx===-1?"left":dy===1?"down":"up";
  if(!walkable(nx,ny)) { if(cb)cb(); return; }
  state.moving = true;
  const startX=state.px, startY=state.py;
  const dur = 160;
  const t0 = performance.now();
  function step(now){
    const p = Math.min(1,(now-t0)/dur);
    moveAnim = { x: startX+(nx-startX)*p, y: startY+(ny-startY)*p };
    if(p<1){ requestAnimationFrame(step); }
    else {
      state.px = nx; state.py = ny; moveAnim=null; state.moving=false;
      state.step++;
      if (state.flags.repelSteps > 0) {
        state.flags.repelSteps--;
        if (state.flags.repelSteps === 0) {
          showDialog(["The effect of REPEL wore off."]);
        }
      }
      handleTileEnter(nx,ny);
      if(cb) cb();
    }
  }
  requestAnimationFrame(step);
}
function handleTileEnter(x,y){
  const m = curMap();
  const w = m.warps[x+','+y];
  if(w){
    path = []; 
    fadeOut(()=>{
      enterOverworld(w.to, w.x, w.y);
      fadeIn();
    }, 300);
    return;
  }
  const t = tileAt(x,y);
  if(t===3){
    if (state.flags.repelSteps > 0) return;
    if(Math.random()<0.15){
      path = []; 
      startWildBattle();
    }
  }
}

/* ============================== RENDERING ============================== */
function render(){
  const m = curMap();
  const cam = getCamera();
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = m.bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const t0x = Math.floor(cam.x/(TILE*SCALE))-1;
  const t0y = Math.floor(cam.y/(TILE*SCALE))-1;
  const tCols = Math.ceil(canvas.width/(TILE*SCALE))+2;
  const tRows = Math.ceil(canvas.height/(TILE*SCALE))+2;

  for(let ty=t0y; ty<t0y+tRows; ty++){
    for(let tx=t0x; tx<t0x+tCols; tx++){
      if(tx<0||ty<0||tx>=m.w||ty>=m.h) continue;
      const t = m.tiles[ty][tx];
      const sx = tx*TILE*SCALE - cam.x;
      const sy = ty*TILE*SCALE - cam.y;
      drawTile(t, sx, sy);
    }
  }
  for(const n of m.npcs){
    const sx = n.x*TILE*SCALE - cam.x, sy = n.y*TILE*SCALE - cam.y;
    drawPerson(sx, sy, n.dir||"down", n.sprite, false);
  }
  const px = moveAnim?moveAnim.x:state.px, py = moveAnim?moveAnim.y:state.py;
  const psx = px*TILE*SCALE - cam.x, psy = py*TILE*SCALE - cam.y;
  drawPerson(psx, psy, state.facing, state.gender, state.moving, frameCount);
}

function drawTile(t, x, y){
  const s = TILE*SCALE;
  switch(t){
    case 1:
      ctx.fillStyle="#3a7a3a"; ctx.fillRect(x,y,s,s);
      ctx.fillStyle="#2c5c2c"; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s*0.42,0,7); ctx.fill();
      break;
    case 2:
      ctx.fillStyle="#dfc98a"; ctx.fillRect(x,y,s,s);
      break;
    case 0:
      ctx.fillStyle="#7cc46a"; ctx.fillRect(x,y,s,s);
      break;
    case 3:
      ctx.fillStyle="#4fae4a"; ctx.fillRect(x,y,s,s);
      ctx.strokeStyle="#2f7c2c"; ctx.lineWidth=Math.max(1,s*0.06);
      for(let i=0;i<3;i++){
        const gx = x+s*0.2+i*s*0.28;
        ctx.beginPath(); ctx.moveTo(gx,y+s*0.9); ctx.lineTo(gx-2,y+s*0.35); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(gx+4,y+s*0.9); ctx.lineTo(gx+6,y+s*0.35); ctx.stroke();
      }
      break;
    case 4:
      ctx.fillStyle="#4a9fe0"; ctx.fillRect(x,y,s,s);
      break;
    case 5:
      ctx.fillStyle="#7cc46a"; ctx.fillRect(x,y,s,s);
      ctx.fillStyle="#e85a8a"; ctx.beginPath(); ctx.arc(x+s*0.35,y+s*0.4,s*0.12,0,7); ctx.arc(x+s*0.65,y+s*0.6,s*0.12,0,7); ctx.fill();
      break;
    case 6:
      ctx.fillStyle="#dfc98a"; ctx.fillRect(x,y,s,s);
      ctx.fillStyle="#6b4a2c"; ctx.fillRect(x+s*0.2,y,s*0.6,s*0.9);
      break;
    case 7:
      ctx.fillStyle="#c0392b"; ctx.fillRect(x,y,s,s);
      ctx.fillStyle="#8e2a1f"; ctx.fillRect(x,y+s*0.75,s,s*0.25);
      break;
    case 8:
      ctx.fillStyle="#e8e0c8"; ctx.fillRect(x,y,s,s);
      ctx.strokeStyle="#b8ac86"; ctx.strokeRect(x,y,s,s);
      break;
    default:
      ctx.fillStyle="#7cc46a"; ctx.fillRect(x,y,s,s);
  }
}

const skinTones = { boy:"#f4c48a", girl:"#f4c48a", man:"#e8b070", nurse:"#f4c48a", prof:"#e8b070" };
const outfitColors = { boy:"#d84040", girl:"#e050a0", man:"#4060a0", nurse:"#ff8fa8", prof:"#e8e0c8" };

function drawPerson(x,y,dir,type,moving,fc){
  const s = TILE*SCALE;
  const bob = moving ? Math.sin((fc||0)*0.6)*s*0.04 : 0;
  const cx = x+s/2, cy = y+s*0.55+bob;
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(cx, y+s*0.92, s*0.28, s*0.08, 0,0,7); ctx.fill();
  
  ctx.fillStyle = outfitColors[type]||"#888";
  ctx.fillRect(x+s*0.28, y+s*0.42+bob, s*0.44, s*0.4);
  ctx.fillStyle = skinTones[type]||"#f4c48a";
  ctx.beginPath(); ctx.arc(cx, y+s*0.32+bob, s*0.22, 0, 7); ctx.fill();
  ctx.fillStyle = type==='girl'?"#7a3a1a":type==='nurse'?"#ffffff":"#2a2a2a";
  ctx.beginPath(); ctx.arc(cx, y+s*0.24+bob, s*0.22, Math.PI, 0); ctx.fill();
  
  ctx.fillStyle="#222";
  if(dir==='down') ctx.fillRect(cx-s*0.08,y+s*0.32+bob,s*0.04,s*0.04), ctx.fillRect(cx+s*0.04,y+s*0.32+bob,s*0.04,s*0.04);
  if(dir==='left') ctx.fillRect(cx-s*0.12,y+s*0.32+bob,s*0.04,s*0.04);
  if(dir==='right') ctx.fillRect(cx+s*0.08,y+s*0.32+bob,s*0.04,s*0.04);
  
  ctx.fillStyle="#333";
  ctx.fillRect(x+s*0.3,y+s*0.8+bob,s*0.16,s*0.14);
  ctx.fillRect(x+s*0.54,y+s*0.8+bob,s*0.16,s*0.14);
}

/* ============================== DIALOG SYSTEM ============================== */
let dialogQueue = [];
let dialogCallback = null;
const textbox = document.getElementById('textbox');
const textboxContent = document.getElementById('textboxContent');
function showDialog(lines, cb){
  dialogQueue = Array.isArray(lines)?lines.slice():[lines];
  dialogCallback = cb;
  uiMode='dialog';
  textbox.style.display='block';
  nextDialogLine();
}
function nextDialogLine(){
  if(dialogQueue.length===0){
    textbox.style.display='none';
    uiMode = state.inBattle ? 'battle' : 'overworld';
    const cb = dialogCallback; dialogCallback=null;
    if(cb) cb();
    return;
  }
  const line = dialogQueue.shift().replace(/PLAYER/g, state.playerName);
  textboxContent.textContent = line;
}
function advanceDialog(){
  if(uiMode==='dialog'){ nextDialogLine(); }
}
textbox.addEventListener('click', advanceDialog);

function talkToNpc(n){
  if(n.id==='oak'){ handleOakInteraction(); return; }
  if(n.id==='rival'){ handleRival1Interaction(); return; }
  if(n.id==='rival2'){ handleRival2Interaction(); return; }
  if(n.id==='martClerk'){ handleMartClerkInteraction(); return; }
  if(n.id==='nurse'){ handleNurseInteraction(); return; }
  if(n.id==='bugCatcher1'){ handleBugCatcher1(); return; }
  if(n.id==='bugCatcher2'){ handleBugCatcher2(); return; }
  if(n.id==='brock'){ handleBrockInteraction(); return; }
  showDialog(n.text || ["..."]);
}

function handleOakInteraction() {
  const q = state.flags.questStage;
  if (q === 0) {
    showDialog([
      "OAK: Ah, PLAYER! There you are!",
      "I was just speaking with my grandson, GRANDSON.",
      "He's been quite eager to start his journey.",
      "PLAYER, I have three POKéMON here. Choose the one you like!"
    ], showStarterChoice);
  } else if (q === 1) {
    showDialog([
      "OAK: PLAYER, I have a favor to ask of you.",
      "I ordered a custom POKé BALL from the VIRIDIAN MART.",
      "Could you head up north and pick it up for me?",
      "ROUTE 1 is just north of town. Be careful of wild POKéMON!"
    ], () => { state.flags.questStage = 2; });
  } else if (q === 2) {
    showDialog([
      "OAK: Please, PLAYER! Head north to VIRIDIAN CITY.",
      "The MART CLERK has my custom POKé BALL.",
      "Come back to me once you have it."
    ]);
  } else if (q === 3) {
    showDialog([
      "OAK: PLAYER! You're back.",
      "Did you get the custom POKé BALL from the MART?"
    ], () => {
      state.flags.questStage = 4;
      showDialog([
        "OAK: So this is the custom POKé BALL... Wonderful!",
        "Thank you so much for your help, PLAYER.",
        "As a reward for completing your first errand, please take these!"
      ], () => {
        addItem("Poké Ball", 5);
        addItem("Potion", 3);
        state.party.forEach(m => { m.hp = m.maxHp; m.fainted = false; });
        state.flags.questStage = 5;
        showDialog([
          "You received 5 POKé BALLS and 3 POTIONS!",
          "Your POKéMON have also been fully healed.",
          "Your real adventure begins now. The GYM in PEWTER CITY awaits to the north!"
        ]);
      });
    });
  } else {
    showDialog(["OAK: Take good care of your POKéMON!","The GYM in PEWTER CITY awaits to the north!"]);
  }
}

    {key:'charmander', label:'CHARMANDER (Fire)'},

      ], () => {
        const my = state.party[0].key;

    return;
  }
  if (state.flags.rival1Defeated) {
    showDialog(["GRANDSON: Heh. You got lucky this time, PLAYER.","I'm heading north. Catch you later."]);

/* ============================== BAG SYSTEM ============================== */
const bagScreen = document.getElementById('bagScreen');
const bagListEl = document.getElementById('bagList');
const bagDescEl = document.getElementById('bagDesc');
const bagMoneyEl = document.getElementById('bagMoney');
let bagContext = 'overworld';
let currentTab = 'medicine';
let bagSelIdx = 0;

document.getElementById('menuBtn').addEventListener('click', () => {
  if (uiMode === 'overworld') openBag('overworld');
});

document.querySelectorAll('.bagTab').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.bagTab').forEach(t => t.classList.remove('sel'));
    el.classList.add('sel');
    currentTab = el.dataset.tab;
    bagSelIdx = 0;
    renderBag();
  });
});

document.getElementById('bagBackBtn').addEventListener('click', closeBag);

function openBag(ctx) {
  bagContext = ctx;
  bagScreen.style.display = 'flex';
  uiMode = 'bag';
  bagMoneyEl.textContent = '$' + state.money;
  renderBag();
}
function closeBag() {
  bagScreen.style.display = 'none';
  if (bagContext === 'battle') {
    uiMode = 'battle';
    setBattleMenuState('main');
  } else {
    uiMode = 'overworld';
    requestAnimationFrame(loop);
  }
}
function getFilteredBag() {
  return state.bag.filter(i => ITEMS[i.name].cat === currentTab);
}
function renderBag() {
  const items = getFilteredBag();
  bagListEl.innerHTML = '';
  if (items.length === 0) {
    bagListEl.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">No items.</div>';
    bagDescEl.textContent = 'No items in this pocket.';
    return;
  }
  items.forEach((it, i) => {
    const div = document.createElement('div');
    div.className = 'bagItem' + (i === bagSelIdx ? ' sel' : '');
    div.innerHTML = `${it.name} <span style="color:#333;">x${it.qty}</span>`;
    div.addEventListener('click', () => {
      bagSelIdx = i;
      renderBag();
      useBagItem(it);
    });
    bagListEl.appendChild(div);
  });
  bagDescEl.textContent = ITEMS[items[bagSelIdx].name].desc;
}

function useBagItem(it) {
  const itemData = ITEMS[it.name];
  if (bagContext === 'battle') {
    if (!itemData.battle) {
      bagDescEl.textContent = "Can't use that here!";
      return;
    }
    if (itemData.cat === 'medicine') {
      const mon = battle.playerMon;
      if (it.name === 'Potion') healMon(mon, 20);
      else if (it.name === 'Super Potion') healMon(mon, 50);
      else if (it.name === 'Full Restore') { healMon(mon, mon.maxHp); mon.status = null; }
      
      removeItem(it.name);
      bagDescEl.textContent = `Used ${it.name}!`;
      setTimeout(() => {
        closeBag();
        battle.turnBusy = true;
        setBattleMenuState('main');
        battleLog.textContent = `${state.playerName} used ${it.name}!`;
        drawBattle();
        const enemyMoves = SPECIES[battle.enemyMon.key];
        const enemyMoveName = enemyMoves.moves[Math.floor(Math.random()*enemyMoves.moves.length)];
        setTimeout(() => runSeq([['enemy',enemyMoveName]], 0), 1000);
      }, 800);
    } else if (itemData.cat === 'balls') {
      removeItem(it.name);
      const ballName = it.name;
      closeBag();
      tryCatchWild(ballName);
    }
  } else {
    if (!itemData.overworld) {
      bagDescEl.textContent = "Can't use that here!";
      return;
    }
    if (it.name === 'Repel') {
      state.flags.repelSteps = 50;
      removeItem(it.name);
      bagDescEl.textContent = "Used REPEL! Wild encounters suppressed for 50 steps.";
    } else if (it.name === 'Escape Rope') {
      if (curMap().isIndoor) {
        removeItem(it.name);
        closeBag();
        fadeOut(() => {
          enterOverworld(state.returnToMap, state.returnToX, state.returnToY);
          fadeIn();
        }, 400);
      } else {
        bagDescEl.textContent = "Can't use that outside!";
      }
    } else if (itemData.cat === 'medicine') {
      const target = state.party.find(m => m.fainted) || state.party.find(m => m.hp < m.maxHp);
      if (!target) {
        bagDescEl.textContent = "All POKéMON are already healthy!";
        return;
      }
      if (it.name === 'Revive' && target.fainted) {
        target.fainted = false;
        target.hp = Math.floor(target.maxHp / 2);
        removeItem(it.name);
        bagDescEl.textContent = `Revived ${SPECIES[target.key].name}!`;
      } else if (it.name !== 'Revive' && !target.fainted) {
        if (it.name === 'Potion') healMon(target, 20);
        else if (it.name === 'Super Potion') healMon(target, 50);
        else if (it.name === 'Full Restore') { healMon(target, target.maxHp); target.status = null; }
        removeItem(it.name);
        bagDescEl.textContent = `Healed ${SPECIES[target.key].name}!`;
      } else {
        bagDescEl.textContent = "It won't have any effect.";
      }
    }
  }
}

function healMon(mon, amt) {
  mon.hp = Math.min(mon.maxHp, mon.hp + amt);
}

const shopScreen = document.getElementById('shopScreen');

    div.className = 'shopItem' + (i === shopSelIdx ? ' sel' : '');

/* ============================== BATTLE SYSTEM ============================== */
const battleScreen = document.getElementById('battleScreen');
const battleCanvas = document.getElementById('battleCanvas');
const bctx = battleCanvas.getContext('2d');
const battleLog = document.getElementById('battleLog');
const battleActions = document.getElementById('battleActions');
const moveListEl = document.getElementById('moveList');

let battle = null;

function wildEncounterTable(){
  const m = curMap();
  if(m===MAPS.route1) return ['rattata','pidgey'];
  if(m===MAPS.viridianForest) return ['pidgey','rattata'];
  return ['rattata'];
}
function startWildBattle(){
  const table = wildEncounterTable();
  const key = table[Math.floor(Math.random()*table.length)];
  const lvl = 2+Math.floor(Math.random()*5);
  const enemy = makeMon(key, lvl);
  openBattle({type:'wild', enemyParty:[enemy]});
}

function openBattle(cfg){
  state.inBattle = true;
  uiMode='battle';
  battle = {
    cfg,
    playerMon: state.party.find(m=>!m.fainted) || state.party[0],
    enemyIdx: 0,
    enemyMon: cfg.enemyParty[0],
    turnBusy: false,
    ended: false,
    catching: false,
    stageMods: {atk:0,def:0,spd:0, eAtk:0, eDef:0, eSpd:0},
  };
  battleScreen.style.display='block';
  resizeBattleCanvas();
  setBattleMenuState('main');
  const introMsg = cfg.type==='wild' ? "Wild "+SPECIES[battle.enemyMon.key].name+" appeared!" :
    (cfg.trainerName||"Trainer")+" wants to battle!";
  battleLog.textContent = introMsg;
  drawBattle();
}
function resizeBattleCanvas(){
  const r = battleCanvas.getBoundingClientRect();
  battleCanvas.width = r.width; battleCanvas.height = r.height;
  drawBattle();
}
window.addEventListener('resize', resizeBattleCanvas);

function closeBattle(){
  battleScreen.style.display='none';
  state.inBattle = false;
  uiMode='overworld';
  battle=null;
  document.getElementById('hudMoney').textContent = '$' + state.money;
  requestAnimationFrame(loop); 
}

function drawBattle(){
  if(!battle) return;
  const W=battleCanvas.width, H=battleCanvas.height;
  bctx.imageSmoothingEnabled=false;
  const grad = bctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#bfe89a"); grad.addColorStop(1,"#8fd070");
  bctx.fillStyle=grad; bctx.fillRect(0,0,W,H);
  bctx.fillStyle="#6bb050";
  bctx.beginPath(); bctx.ellipse(W*0.78,H*0.42,W*0.16,H*0.07,0,0,7); bctx.fill();
  bctx.beginPath(); bctx.ellipse(W*0.22,H*0.78,W*0.2,H*0.09,0,0,7); bctx.fill();

  drawMonSprite(battle.enemyMon.key, W*0.78, H*0.42, Math.min(W,H)*0.22, true);
  drawHpBar(battle.enemyMon, W*0.06, H*0.06, W*0.42, false);

  drawMonSprite(battle.playerMon.key, W*0.22, H*0.78, Math.min(W,H)*0.28, false);
  drawHpBar(battle.playerMon, W*0.52, H*0.58, W*0.42, true);
}
function drawMonSprite(key, cx, cy, r, isEnemy){
  const sp = SPECIES[key];
  bctx.save();
  bctx.translate(cx,cy);
  if(isEnemy) bctx.scale(-1,1);
  bctx.fillStyle="rgba(0,0,0,0.2)";
  bctx.beginPath(); bctx.ellipse(0, r*0.85, r*0.7,r*0.18,0,0,7); bctx.fill();
  
  // Modern Icon Sprites logic
  bctx.fillStyle = sp.color2;
  bctx.beginPath(); bctx.arc(0,0,r*0.75,0,7); bctx.fill();
  bctx.fillStyle = sp.color;
  bctx.beginPath(); bctx.arc(0,r*0.05,r*0.58,0,7); bctx.fill();
  bctx.fillStyle="#fff";
  bctx.beginPath(); bctx.arc(-r*0.2,-r*0.05,r*0.14,0,7); bctx.arc(r*0.2,-r*0.05,r*0.14,0,7); bctx.fill();
  bctx.fillStyle="#111";
  bctx.beginPath(); bctx.arc(-r*0.17,-r*0.02,r*0.06,0,7); bctx.arc(r*0.23,-r*0.02,r*0.06,0,7); bctx.fill();
  bctx.restore();
}
function drawHpBar(mon, x, y, w, showNum){
  const sp = SPECIES[mon.key];
  const h = 14;
  bctx.fillStyle="rgba(255,255,255,0.92)";
  bctx.strokeStyle="#333"; bctx.lineWidth=2;
  roundRect(bctx,x,y,w,h*2.6,6); bctx.fill(); bctx.stroke();
  bctx.fillStyle="#111"; bctx.font="bold "+Math.max(10,w*0.055)+"px monospace";
  bctx.fillText(sp.name+" Lv"+mon.level, x+8, y+h*0.9);
  const barW = w-16, barX=x+8, barY=y+h*1.3;
  bctx.fillStyle="#333"; bctx.fillRect(barX,barY,barW,8);
  const pct = Math.max(0,mon.hp/mon.maxHp);
  bctx.fillStyle = pct>0.5?"#4caf50":pct>0.2?"#ff9800":"#f44336";
  bctx.fillRect(barX+1,barY+1,Math.max(0,(barW-2)*pct),6);
  if(showNum){
    bctx.fillStyle="#111"; bctx.font="bold "+Math.max(9,w*0.045)+"px monospace";
    bctx.fillText(mon.hp+"/"+mon.maxHp, barX, barY+22);
  }
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function setBattleMenuState(m){
  if(m==='main'){
    moveListEl.style.display='none';
    battleActions.style.display='grid';
    if(!battle.ended && !battle.turnBusy) battleLog.textContent = "What will "+state.playerName+" do?";
  } else if(m==='moves'){
    battleActions.style.display='none';
    moveListEl.style.display='flex';
    renderMoveList();
  }
}
battleActions.addEventListener('click', (e)=>{
  const b = e.target.closest('.bmbtn');
  if(!b||battle.turnBusy||battle.ended) return;
  const a = b.dataset.a;
  if(a==='fight') setBattleMenuState('moves');
  else if(a==='run') tryRun();
  else if(a==='bag') openBag('battle');
  else if(a==='party') { battleLog.textContent="Your team is ready to fight!"; }
});
function renderMoveList(){
  const mon = battle.playerMon;
  moveListEl.innerHTML = mon.moves.map(mv=>`<div class="movebtn" data-m="${mv}">${mv} <span style="float:right;color:#888;">${MOVES[mv].type}</span></div>`).join('')
    + `<div class="movebtn" data-m="__back" style="text-align:center;color:#888;">BACK</div>`;
  Array.from(moveListEl.children).forEach(el=>{
    el.addEventListener('click', ()=>{
      if(battle.turnBusy) return;
      if(el.dataset.m==='__back'){ setBattleMenuState('main'); return; }
      doTurn(el.dataset.m);
    });
  });
}
function tryRun(){
  if(battle.cfg.type==='trainer'){ battleLog.textContent="You can't run from a trainer battle!"; return; }
  battleLog.textContent="Got away safely!";
  battle.ended=true;
  setTimeout(closeBattle, 900);
}

function typeMultiplier(atkType, defType){
  const chart = {
    Fire:{Grass:2,Water:0.5,Fire:0.5,Bug:2},
    Water:{Fire:2,Grass:0.5,Water:0.5,Rock:2},
    Grass:{Water:2,Fire:0.5,Grass:0.5,Rock:2},
    Normal:{Rock:0.5},
    Flying:{Grass:2,Bug:2},
    Bug:{Grass:2,Fire:0.5},
    Poison:{Grass:2},
  };
  return (chart[atkType]&&chart[atkType][defType]) || 1;
}
function calcDamage(attacker, defender, moveName){
  const mv = MOVES[moveName];
  if(mv.power===0) return {dmg:0, fx:mv.fx};
  const atkSp = SPECIES[attacker.key];
  const lvl = attacker.level;
  const base = (((2*lvl/5+2) * mv.power * (attacker.atk/defender.def)) / 50) + 2;
  const stab = atkSp.type===mv.type ? 1.5 : 1;
  const eff = typeMultiplier(mv.type, SPECIES[defender.key].type);
  const rand = 0.85+Math.random()*0.15;
  const dmg = Math.max(1, Math.floor(base*stab*eff*rand));
  return {dmg, eff, fx:mv.fx};
}

function doTurn(playerMove){
  battle.turnBusy = true;
  setBattleMenuState('main');
  const enemyMoves = SPECIES[battle.enemyMon.key];
  const enemyMoveName = enemyMoves.moves[Math.floor(Math.random()*enemyMoves.moves.length)];
  const playerFirst = battle.playerMon.spd >= battle.enemyMon.spd;
  const seq = playerFirst ? [['player',playerMove],['enemy',enemyMoveName]] : [['enemy',enemyMoveName],['player',playerMove]];
  runSeq(seq, 0);
}
function runSeq(seq, i){
  if(i>=seq.length){ battle.turnBusy=false; checkBattleEnd() || setBattleMenuState('main'); return; }
  const [who, mv] = seq[i];
  const attacker = who==='player'?battle.playerMon:battle.enemyMon;
  const defender = who==='player'?battle.enemyMon:battle.playerMon;
  if(attacker.fainted || defender.fainted){ runSeq(seq,i+1); return; }
  const res = calcDamage(attacker, defender, mv);
  battleLog.textContent = (who==='player'?"":"Foe ")+SPECIES[attacker.key].name+" used "+mv+"!";
  setTimeout(()=>{
    if(res.dmg>0){
      defender.hp = Math.max(0, defender.hp-res.dmg);
      if(res.eff>1) battleLog.textContent += " It's super effective!";
      else if(res.eff<1 && res.eff>0) battleLog.textContent += " It's not very effective...";
    } else if(res.fx){
      battleLog.textContent += " Stats changed!";
    }
    drawBattle();
    if(defender.hp<=0 && !defender.fainted){
      defender.fainted = true;
      setTimeout(()=>{
        battleLog.textContent = (who==='player'?"Foe ":"")+SPECIES[defender.key].name+" fainted!";
        drawBattle();
        if(checkBattleEnd()) return;
        setTimeout(()=>runSeq(seq,i+1), 900);
      }, 500);
      return;
    }
    setTimeout(()=>runSeq(seq,i+1), 700);
  }, 500);
}

function tryCatchWild(ballName) {
  battle.turnBusy = true;
  const mon = battle.enemyMon;
  const hpFactor = (1 - (mon.hp / mon.maxHp)) * 255;
  const ballBonus = ballName === 'Great Ball' ? 1.5 : 1.0;
  const catchChance = Math.min(255, (hpFactor * ballBonus) / 4);
  
  battleLog.textContent = `You used ${ballName}!`;
  let shakes = 0;
  
  function shakeBall() {
    if (shakes < 3) {
      shakes++;
      battleLog.textContent = `You used ${ballName}! ${'.'.repeat(shakes)}`;
      setTimeout(shakeBall, 600);
    } else {
      if (Math.random() * 255 < catchChance) {
        battleLog.textContent = `Gotcha! ${SPECIES[mon.key].name} was caught!`;
        battle.ended = true;
        if (state.party.length < 6) {
          state.party.push(mon);
        }
        setTimeout(closeBattle, 1800);
      } else {
        battleLog.textContent = `Oh no! The POKéMON broke free!`;
        const enemyMoves = SPECIES[battle.enemyMon.key];
        const enemyMoveName = enemyMoves.moves[Math.floor(Math.random()*enemyMoves.moves.length)];
        setTimeout(() => runSeq([['enemy',enemyMoveName]], 0), 1000);
      }
    }
  }
  setTimeout(shakeBall, 800);
}

function checkBattleEnd(){
  if(battle.ended) return true;
  if(battle.enemyMon.fainted){
    battle.ended = true;
    const xpGain = 15 + battle.enemyMon.level*4;
    const moneyGain = battle.cfg.type === 'trainer' ? (10 + battle.enemyMon.level*5) : 0;
    state.money += moneyGain;
    document.getElementById('hudMoney').textContent = '$' + state.money;
    battleLog.textContent = `You won! ${SPECIES[battle.playerMon.key].name} gained ${xpGain} XP!${moneyGain > 0 ? ` You got $${moneyGain}!` : ''}`;
    grantXp(battle.playerMon, xpGain);
    setTimeout(()=>{
      if(battle.cfg.onWin) battle.cfg.onWin();
      closeBattle();
    }, 1600);
    return true;
  }
  if(battle.playerMon.fainted){
    const next = state.party.find(m=>!m.fainted);
    if(next){
      battle.playerMon = next;
      battleLog.textContent = "Go, "+SPECIES[next.key].name+"!";
      drawBattle();
      battle.turnBusy=false;
      setBattleMenuState('main');
      return true;
    } else {
      battle.ended = true;
      battleLog.textContent = "You have no more POKéMON! Rushed to the POKéMON CENTER...";
      setTimeout(()=>{
        state.party.forEach(m=>{ m.hp=m.maxHp; m.fainted=false; });
        closeBattle();
        fadeOut(()=>{ enterOverworld('pokecenter', 4,6); fadeIn(); },300);
      }, 1600);
      return true;
    }
  }
  return false;
}
function grantXp(mon, xp){
  mon.xp += xp;
  const need = xpToNext(mon.level);
  while(mon.xp>=need){
    mon.xp -= need;
    mon.level++;
    const oldMax = mon.maxHp;
    recalcStats(mon);
    mon.hp += (mon.maxHp-oldMax);
    battleLog.textContent += " " + SPECIES[mon.key].name + " grew to Lv"+mon.level+"!";
  }
}

/* ============================== BOOT ============================== */

})();
</script>
