<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MonFire Red">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A0A00">

<title>MonFire Red</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;top:0;left:0;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:#111;display:flex;justify-content:center;align-items:center;flex-direction:column}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;-webkit-image-rendering:pixelated}

/* Tap to Start overlay */
#start-overlay{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at center,#4A1A08 0%,#1A0A00 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#start-overlay .logo{color:#FF4400;font-family:monospace;font-size:28px;font-weight:bold;letter-spacing:2px;text-shadow:0 0 20px rgba(255,68,0,0.5)}
#start-overlay .sub{color:#FFCC00;font-family:monospace;font-size:18px;font-weight:bold;margin-top:2px}
#start-overlay .tap{color:#FFDDAA;font-family:monospace;font-size:14px;margin-top:40px;animation:pulse 1.5s ease-in-out infinite}
#start-overlay .hint{color:#886644;font-family:monospace;font-size:10px;margin-top:16px;max-width:260px;text-align:center;line-height:1.4}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* Touch controls */
#controls{position:fixed;bottom:0;left:0;right:0;pointer-events:none;z-index:20;display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
#dpad{position:absolute;bottom:20px;left:20px;display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;gap:3px;pointer-events:auto;touch-action:none}
#dpad button{background:rgba(60,60,60,0.7);border:2px solid rgba(120,120,120,0.5);color:#ccc;font-size:20px;border-radius:8px;touch-action:manipulation;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;outline:none}
#dpad button:active{background:rgba(100,100,100,0.85);border-color:rgba(180,180,180,0.6)}
.du{grid-column:2;grid-row:1}.dl{grid-column:1;grid-row:2}.dc{grid-column:2;grid-row:2}.dr{grid-column:3;grid-row:2}.dd{grid-column:2;grid-row:3}
#btns{position:absolute;bottom:32px;right:20px;display:flex;gap:14px;pointer-events:auto;touch-action:none}
#btns button{width:60px;height:60px;border-radius:50%;border:2px solid rgba(120,120,120,0.5);color:#eee;font-size:13px;font-weight:bold;touch-action:manipulation;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;outline:none}
#btns button.ba{background:rgba(200,50,50,0.7)}#btns button.bb{background:rgba(50,50,200,0.7)}
#btns button:active{filter:brightness(1.5)}

/* Show controls on touch devices */
@media(hover:none)and (pointer:coarse){#controls{display:block}}
</style>
</head>
<body>

<!-- Tap to Start overlay — required for iOS AudioContext -->
<div id="start-overlay">
  <div class="logo">MONFIRE</div>
  <div class="sub">RED</div>
  <div class="tap">Tap to Start</div>
  <div class="hint">On iPhone, tap the Share button below and choose "Add to Home Screen" for the best experience</div>
</div>

<canvas id="game"></canvas>

<div id="controls">
  <div id="dpad">
    <button class="du" data-k="ArrowUp">▲</button>
    <button class="dl" data-k="ArrowLeft">◄</button>
    <button class="dc" data-k="Enter">OK</button>
    <button class="dr" data-k="ArrowRight">►</button>
    <button class="dd" data-k="ArrowDown">▼</button>
  </div>
  <div id="btns">
    <button class="bb" data-k="Backspace">B</button>
    <button class="ba" data-k="Enter">A</button>
  </div>
</div>

function resize(){
  const isStand=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const hasTouch=window.matchMedia('(hover:none) and (pointer:coarse)').matches;
  let avW=window.innerWidth,avH=window.innerHeight;
  if(hasTouch&&!isStand)avH=Math.max(avH-140,avH*0.65);
  SCALE=Math.max(1,Math.floor(Math.min(avW/GW,avH/GH)));
  C.width=GW;C.height=GH;
  C.style.width=GW*SCALE+'px';C.style.height=GH*SCALE+'px';
}

window.addEventListener('resize',resize);

// ===== Audio (iOS-safe) =====
let audioCtx=null;
function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){audioCtx=null;}
}
function beep(f,d,t,v){
  if(!audioCtx)return;
  try{
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=t||'square';o.frequency.value=f;g.gain.value=v||0.06;
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);
  }catch(e){}
}

// Touch controls — use pointer events for better iOS support
document.querySelectorAll('[data-k]').forEach(function(b){
  const k=b.dataset.k;let touched=false;
  function onDown(e){
    e.preventDefault();e.stopPropagation();
    if(!touched){touched=true;if(!kd[k])kj[k]=1;kd[k]=1;}
  }
  function onUp(e){
    if(e)e.preventDefault();
    touched=false;kd[k]=0;
  }
  b.addEventListener('touchstart',onDown,{passive:false});
  b.addEventListener('touchend',onUp,{passive:false});
  b.addEventListener('touchcancel',onUp,{passive:false});
  b.addEventListener('mousedown',onDown);
  b.addEventListener('mouseup',onUp);
  b.addEventListener('mouseleave',onUp);
});

// ===== Start Overlay =====
const startOverlay=document.getElementById('start-overlay');
function handleStart(e){
  e.preventDefault();e.stopPropagation();
  if(gameStarted)return;
  gameStarted=true;
  initAudio();
  startOverlay.style.transition='opacity 0.4s';startOverlay.style.opacity='0';
  setTimeout(function(){startOverlay.style.display='none';},400);
  // Kick off game
  if(!loopRunning){loopRunning=true;requestAnimationFrame(gameLoop);}
}
startOverlay.addEventListener('touchstart',handleStart,{passive:false});
startOverlay.addEventListener('mousedown',handleStart);
startOverlay.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')handleStart(e);});

function makeMon(sid,lv){
  const sp=SPECIES[sid];const m={sp:sid,level:lv,exp:0,moves:[],hp:0};
  function cs(b){return Math.floor((2*b*lv)/100)+5;}
  m.maxHp=Math.floor((2*sp.base.hp*lv)/100)+lv+10;
  m.atk=cs(sp.base.atk);m.def=cs(sp.base.def);m.spd=cs(sp.base.spd);m.spA=cs(sp.base.spA);m.spD=cs(sp.base.spD);
  m.hp=m.maxHp;sp.moves.forEach(function(mv){m.moves.push({name:mv.name,type:mv.type,pow:mv.pow,acc:mv.acc,pp:mv.pp,maxPp:mv.maxPp})});
  m.expNext=lv*lv*4;return m;
}
function recalcStats(m){
  const sp=SPECIES[m.sp];function cs(b){return Math.floor((2*b*m.level)/100)+5;}
  m.maxHp=Math.floor((2*sp.base.hp*m.level)/100)+m.level+10;
  m.atk=cs(sp.base.atk);m.def=cs(sp.base.def);m.spd=cs(sp.base.spd);m.spA=cs(sp.base.spA);m.spD=cs(sp.base.spD);
}

// ===== Overworld =====
function updateOverworld(){
  if(G.pcHealing){G.pcTimer++;if(G.pcTimer>60){G.pcHealing=false;G.pcTimer=0;}return;}
  if(G.flashTimer>0){G.flashTimer--;return;}if(G.transType){updateTransition();return;}if(G.dlgLines.length){updateDialog();return;}if(G.menuOpen){updateMenu();return;}
  if(!G.pMoving){
    var dx=0,dy=0;
    if(kp('ArrowDown')||kp('KeyS')){dy=1;G.pDir=0;}else if(kp('ArrowUp')||kp('KeyW')){dy=-1;G.pDir=1;}else if(kp('ArrowLeft')||kp('KeyA')){dx=-1;G.pDir=2;}else if(kp('ArrowRight')||kp('KeyD')){dx=1;G.pDir=3;}
    if(dx||dy){var nx=G.px+dx,ny=G.py+dy,npc=isNpc(G.mapId,nx,ny);if(!isBlocked(G.mapId,nx,ny)&&!npc){G.pPGx=G.px;G.pPGy=G.py;G.px=nx;G.py=ny;G.pMoving=true;G.pMT=0;sfxStep();}}
    if(jp('Enter')||jp('KeyZ')){var fx=G.px+[0,0,-1,1][G.pDir],fy=G.py+[1,-1,0,0][G.pDir],npc=isNpc(G.mapId,fx,fy);if(npc){var lines=[];for(var ni=4;ni<npc.length;ni++)lines.push(npc[ni]);showDialog(lines);sfxSelect();}var pt=getTile(G.mapId,fx,fy);if(pt===6){if(G.mapId===2&&fx===4&&fy===8){G.pcHealing=true;G.pcTimer=0;G.party.forEach(function(m){m.hp=m.maxHp;m.moves.forEach(function(mv){mv.pp=mv.maxPp;});});sfxHeal();showDialog(["Welcome to the PokeCenter!","Your Pokemon have been healed.","Come again!"]);}else if(G.mapId===0){showDialog(["The door is locked...","Nobody seems to be home."]);}else{showDialog(["The building is closed.","Come back later!"]);}sfxSelect();}}
    if(jp('Backspace')||jp('KeyX')){G.menuOpen=true;G.menuSel=0;sfxSelect();}
  }
  if(G.pMoving){G.pMT++;var t=G.pMT/G.pMS;G.pVx=G.pPGx+(G.px-G.pPGx)*t;G.pVy=G.pPGy+(G.py-G.pPGy)*t;G.pFrame=Math.floor(G.pMT/(G.pMS/2))%2;if(G.pMT>=G.pMS){G.pMoving=false;G.pVx=G.px;G.pVy=G.py;G.pFrame=0;onTileEnter(G.px,G.py);}}
  checkMapTransition();
}
function onTileEnter(x,y){var t=getTile(G.mapId,x,y);if(t===2){var m=MAPS[G.mapId];if(m.wild.length>0){for(var wi=0;wi<m.wild.length;wi++){var w=m.wild[wi];if(Math.random()<w.ch){var lvl=w.lvl[0]+Math.floor(Math.random()*(w.lvl[1]-w.lvl[0]+1));G.bEnemy=makeMon(w.id,lvl);G.bPlayer=G.party[0];startTransition('battle',function(){G.scene='battle';initBattle();});sfxEncounter();return;}}}}}
function checkMapTransition(){var m=MAPS[G.mapId];if(G.py<=0&&G.mapId===1)warpTo(0,9,13);else if(G.py>=m.h-1&&G.mapId===0)warpTo(1,9,1);else if(G.py>=m.h-1&&G.mapId===1)warpTo(2,9,1);else if(G.py<=0&&G.mapId===2)warpTo(1,1,18);if(G.px<=0&&G.mapId===1){G.px=1;G.pVx=1;}if(G.px>=m.w-1&&G.mapId===1){G.px=m.w-2;G.pVx=m.w-2;}}
function warpTo(mid,x,y){G.mapId=mid;G.px=x;G.py=y;G.pVx=x;G.pVy=y;G.pPGx=x;G.pPGy=y;G.pMoving=false;}
function renderOverworld(){
  var m=MAPS[G.mapId];var camX=G.pVx*T-(GW-T)/2,camY=G.pVy*T-(GH-T)/2;camX=Math.max(0,Math.min(camX,m.w*T-GW));camY=Math.max(0,Math.min(camY,m.h*T-GH));
  var sx=Math.floor(camX/T),sy=Math.floor(camY/T),ox=-(camX%T),oy=-(camY%T);
  for(var dy=-1;dy<=Math.ceil(GH/T)+1;dy++)for(var dx=-1;dx<=Math.ceil(GW/T)+1;dx++){var tx=sx+dx,ty=sy+dy;if(tx>=0&&ty>=0&&tx<m.w&&ty<m.h)drawTile(ox+dx*T,oy+dy*T,m.tiles[ty][tx],G.tick);}
  for(var ni=0;ni<NPCS.length;ni++){var n=NPCS[ni];if(n[0]===G.mapId){var nx=n[1]*T-camX,ny=n[2]*T-camY;if(nx>-T&&nx<GW+T&&ny>-T&&ny<GH+T)drawNpc(nx,ny,ni,n[3]);}}
  drawPlayer(G.pVx*T-camX,G.pVy*T-camY,G.pDir,G.pFrame);
  for(var dy2=-1;dy2<=Math.ceil(GH/T)+1;dy2++)for(var dx2=-1;dx2<=Math.ceil(GW/T)+1;dx2++){var tx2=sx+dx2,ty2=sy+dy2;if(tx2>=0&&ty2>=0&&tx2<m.w&&ty2<m.h&&m.tiles[ty2][tx2]===2){var gx=ox+dx2*T,gy=oy+dy2*T;if(Math.floor(G.pVx)===tx2&&Math.floor(G.pVy)===ty2){X.fillStyle='rgba(74,140,42,0.6)';var sw2=Math.sin(G.tick*0.1+tx2*2+ty2)*1;X.fillRect(gx+1,gy+sw2,6,3);X.fillRect(gx+9,gy-sw2+2,5,3);}}}
  X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(0,0,GW,14);X.fillStyle='#FFF';X.font='7px monospace';X.fillText(m.name,4,10);
  if(G.party.length>0){var pm=G.party[0];X.fillStyle='#FFF';X.font='6px monospace';X.fillText(SPECIES[pm.sp].name+' Lv'+pm.level,90,10);X.fillStyle='#444';X.fillRect(155,4,60,5);X.fillStyle=pm.hp/pm.maxHp>0.5?'#4CAF50':pm.hp/pm.maxHp>0.2?'#FF9800':'#F44336';X.fillRect(155,4,Math.floor(60*pm.hp/pm.maxHp),5);X.fillStyle='#FFF';X.font='5px monospace';X.fillText(pm.hp+'/'+pm.maxHp,155,12);}
  if(G.pcHealing){var p=G.pcTimer/60;if(p<0.5){X.fillStyle='rgba(255,255,255,'+(0.3*Math.sin(p*Math.PI*4))+')';X.fillRect(0,0,GW,GH);}}
  if(G.menuOpen)renderMenu();renderDialog();renderTransition();if(G.flashTimer>0){X.fillStyle='rgba(255,255,255,'+(G.flashTimer/10)+')';X.fillRect(0,0,GW,GH);}
}

// ===== Menu =====
function updateMenu(){if(jp('ArrowUp'))G.menuSel=(G.menuSel+2)%3;if(jp('ArrowDown'))G.menuSel=(G.menuSel+1)%3;if(jp('Backspace')||jp('KeyX')){G.menuOpen=false;sfxSelect();}if(jp('Enter')||jp('KeyZ')){sfxSelect();G.menuOpen=false;}}
function renderMenu(){X.fillStyle='rgba(0,0,0,0.6)';X.fillRect(0,0,GW,GH);X.fillStyle='#F8F8F8';X.fillRect(GW-80,20,76,70);X.strokeStyle='#333';X.lineWidth=1;X.strokeRect(GW-80,20,76,70);var items=['POKeMON','BAG','EXIT'];X.font='8px monospace';for(var i=0;i<3;i++){X.fillStyle=i===G.menuSel?'#E84040':'#333';X.fillText(items[i],GW-70,38+i*20);if(i===G.menuSel&&G.tick%30<20)X.fillRect(GW-76,34+i*20,4,4);}if(G.party.length>0){var pm=G.party[0],sp=SPECIES[pm.sp];X.fillStyle='#333';X.font='6px monospace';X.fillText(sp.name+' Lv'+pm.level,8,30);X.fillText('HP: '+pm.hp+'/'+pm.maxHp,8,42);X.fillText('ATK: '+pm.atk+' DEF: '+pm.def,8,54);X.fillText('Type: '+TYPES[sp.type],8,66);}}

// ===== Battle =====
function initBattle(){G.bMenu=0;G.bMoveSel=0;G.bMsg='';G.bMsgTimer=0;G.bAnim=0;G.bAnimTimer=0;G.bPlayerHpAnim=G.bPlayer.hp;G.bEnemyHpAnim=G.bEnemy.hp;G.bTurnState='menu';G.bTurnTimer=0;G.bExpGain=0;G.bExpAnim=0;G.bLevelUp=false;G.bLevelUpTimer=0;G.bFainted=false;G.bRan=false;G.bCatchAnim=0;G.bMsg='A wild '+SPECIES[G.bEnemy.sp].name+' appeared!';G.bMsgTimer=60;}
function calcDamage(atk,def,move){if(move.pow===0)return 0;var lv=atk.level,a=move.type==='normal'?atk.atk:atk.spA,d=move.type==='normal'?def.def:def.spD;var dmg=Math.floor(((2*lv/5+2)*move.pow*(a/d))/50+2);if(move.type===SPECIES[atk.sp].type)dmg=Math.floor(dmg*1.5);var eff=(TYPE_EFF[move.type]&&TYPE_EFF[move.type][SPECIES[def.sp].type])||1;dmg=Math.floor(dmg*eff);dmg=Math.floor(dmg*(0.85+Math.random()*0.15));return Math.max(1,dmg);}
function execMove(user,target,move,isP){if(Math.random()*100>move.acc)return(isP?SPECIES[user.sp].name:'Wild '+SPECIES[target.sp].name)+"'s attack missed!";var dmg=calcDamage(user,target,move);target.hp=Math.max(0,target.hp-dmg);var eff=(TYPE_EFF[move.type]&&TYPE_EFF[move.type][SPECIES[target.sp].type])||1;var em='';if(eff>=2)em=" It's super effective!";else if(eff<=0.5)em=" It's not very effective...";return(isP?SPECIES[user.sp].name:'Wild '+SPECIES[user.sp].name)+' used '+move.name+'!'+em;}
function enemyAttack(){if(G.bEnemy.hp<=0||G.bPlayer.hp<=0)return;var eMove=G.bEnemy.moves[Math.floor(Math.random()*G.bEnemy.moves.length)];var msg=execMove(G.bEnemy,G.bPlayer,eMove,false);G.bMsg=msg;G.bMsgTimer=50;G.bAnim=2;G.bAnimTimer=0;sfxDamage();setTimeout(function(){G.bTurnState='menu';G.bMsg='';G.bMsgTimer=0;},800);}
function updateBattle(){
  if(G.bMsgTimer>0){G.bMsgTimer--;if(jp('Enter')||jp('KeyZ'))G.bMsgTimer=0;return;}
  if(G.bPlayerHpAnim>G.bPlayer.hp)G.bPlayerHpAnim=Math.max(G.bPlayer.hp,G.bPlayerHpAnim-Math.max(1,Math.ceil(G.bPlayer.maxHp/30)));
  if(G.bEnemyHpAnim>G.bEnemy.hp)G.bEnemyHpAnim=Math.max(G.bEnemy.hp,G.bEnemyHpAnim-Math.max(1,Math.ceil(G.bEnemy.maxHp/30)));
  if(G.bAnim>0){G.bAnimTimer++;if(G.bAnimTimer>15){G.bAnim=0;G.bAnimTimer=0;}return;}
  if(G.bEnemy.hp<=0&&!G.bFainted){G.bFainted=true;sfxFaint();var eg=G.bEnemy.level*3;G.bExpGain=eg;G.bMsg='Wild '+SPECIES[G.bEnemy.sp].name+' fainted! +'+eg+' EXP';G.bMsgTimer=90;G.bPlayer.exp+=eg;if(G.bPlayer.exp>=G.bPlayer.expNext){G.bPlayer.level++;G.bPlayer.exp=0;G.bPlayer.expNext=G.bPlayer.level*G.bPlayer.level*4;recalcStats(G.bPlayer);G.bPlayer.hp=Math.min(G.bPlayer.hp+5,G.bPlayer.maxHp);G.bLevelUp=true;G.bLevelUpTimer=0;sfxLevelUp();}return;}
  if(G.bFainted&&G.bMsgTimer<=0){if(jp('Enter')||jp('KeyZ')){G.scene='overworld';G.flashTimer=5;}return;}
  if(G.bPlayer.hp<=0){if(G.bMsgTimer<=-30&&(jp('Enter')||jp('KeyZ'))){G.bPlayer.hp=G.bPlayer.maxHp;G.bPlayer.moves.forEach(function(mv){mv.pp=mv.maxPp;});G.scene='overworld';G.mapId=0;G.px=9;G.py=6;G.pVx=9;G.pVy=6;return;}if(G.bMsgTimer>0){G.bMsgTimer--;if(jp('Enter')||jp('KeyZ'))G.bMsgTimer=0;return;}if(G.bMsgTimer===0){G.bMsg=SPECIES[G.bPlayer.sp].name+' fainted...';G.bMsgTimer=90;sfxFaint();}G.bMsgTimer--;return;}
  if(G.bRan){if(jp('Enter')||jp('KeyZ')){G.scene='overworld';G.flashTimer=5;}return;}
  if(G.bTurnState==='menu'){
    if(jp('ArrowUp'))G.bMenu=(G.bMenu+2)%4;if(jp('ArrowDown'))G.bMenu=(G.bMenu+1)%4;if(jp('ArrowLeft'))G.bMenu=G.bMenu<2?G.bMenu:G.bMenu-2;if(jp('ArrowRight'))G.bMenu=G.bMenu<2?G.bMenu+2:G.bMenu;
    if(jp('Enter')||jp('KeyZ')){sfxSelect();if(G.bMenu===0){G.bTurnState='moveSelect';G.bMoveSel=0;}else if(G.bMenu===3){if(Math.random()<0.7){G.bMsg='Got away safely!';G.bMsgTimer=50;G.bRan=true;}else{G.bMsg="Can't escape!";G.bMsgTimer=40;setTimeout(function(){enemyAttack();},500);}}}
  }else if(G.bTurnState==='moveSelect'){
    if(jp('ArrowUp'))G.bMoveSel=(G.bMoveSel+2)%4;if(jp('ArrowDown'))G.bMoveSel=(G.bMoveSel+1)%4;if(jp('Backspace')||jp('KeyX')){G.bTurnState='menu';sfxSelect();}
    if(jp('Enter')||jp('KeyZ')){var move=G.bPlayer.moves[G.bMoveSel];if(move.pp>0){move.pp--;sfxHit();var pFirst=G.bPlayer.spd>=G.bEnemy.spd;if(pFirst){var m1=execMove(G.bPlayer,G.bEnemy,move,true);G.bMsg=m1;G.bMsgTimer=50;G.bAnim=1;G.bAnimTimer=0;sfxDamage();if(G.bEnemy.hp>0){setTimeout(function(){enemyAttack();},700);}else{setTimeout(function(){G.bTurnState='menu';},500);}}else{var em=G.bEnemy.moves[Math.floor(Math.random()*G.bEnemy.moves.length)];var m2=execMove(G.bEnemy,G.bPlayer,em,false);G.bMsg=m2;G.bMsgTimer=50;G.bAnim=2;G.bAnimTimer=0;sfxDamage();if(G.bPlayer.hp>0){setTimeout(function(){var m3=execMove(G.bPlayer,G.bEnemy,move,true);G.bMsg=m3;G.bMsgTimer=50;G.bAnim=1;G.bAnimTimer=0;sfxDamage();setTimeout(function(){G.bTurnState='menu';G.bMsg='';G.bMsgTimer=0;},800);},700);}else{setTimeout(function(){G.bTurnState='menu';},500);}}G.bTurnState='animating';}else{G.bMsg='No PP left for this move!';G.bMsgTimer=30;}}
  }
function renderBattle(){
  var grd=X.createLinearGradient(0,0,0,GH);grd.addColorStop(0,'#E8F0E8');grd.addColorStop(1,'#B8C8A8');X.fillStyle=grd;X.fillRect(0,0,GW,GH);
  X.fillStyle='#90A880';X.fillRect(0,90,GW,2);X.fillRect(0,92,GW,1);X.fillStyle='#A8C098';X.fillRect(0,50,130,2);X.fillRect(0,52,130,1);
  if(G.bEnemy.hp>0||G.bFainted){var esp=SP[SPECIES[G.bEnemy.sp].sprF],eSh=G.bAnim===1&&G.bAnimTimer%4<2?2:0;drawSp(X,150+eSh,18,esp.d,esp.p,3);}
  var psp=SP[SPECIES[G.bPlayer.sp].sprB],pSh=G.bAnim===2&&G.bAnimTimer%4<2?2:0;drawSp(X,20+pSh,68,psp.d,psp.p,3);
  X.fillStyle='rgba(255,255,255,0.9)';X.fillRect(4,4,120,30);X.strokeStyle='#444';X.lineWidth=1;X.strokeRect(4,4,120,30);X.fillStyle='#222';X.font='7px monospace';X.fillText(SPECIES[G.bEnemy.sp].name,8,14);X.fillText('Lv'+G.bEnemy.level,90,14);X.fillStyle='#444';X.fillRect(8,18,100,5);var eHp=G.bEnemyHpAnim/G.bEnemy.maxHp;X.fillStyle=eHp>0.5?'#4CAF50':eHp>0.2?'#FF9800':'#F44336';X.fillRect(8,18,Math.floor(100*eHp),5);X.fillStyle=TYPE_CLR[SPECIES[G.bEnemy.sp].type];X.font='5px monospace';X.fillText(TYPES[SPECIES[G.bEnemy.sp].type],8,30);
  X.fillStyle='rgba(255,255,255,0.9)';X.fillRect(116,56,120,36);X.strokeStyle='#444';X.strokeRect(116,56,120,36);X.fillStyle='#222';X.font='7px monospace';X.fillText(SPECIES[G.bPlayer.sp].name,120,66);X.fillText('Lv'+G.bPlayer.level,204,66);X.fillStyle='#444';X.fillRect(120,70,100,5);var pHp=G.bPlayerHpAnim/G.bPlayer.maxHp;X.fillStyle=pHp>0.5?'#4CAF50':pHp>0.2?'#FF9800':'#F44336';X.fillRect(120,70,Math.floor(100*pHp),5);X.fillStyle='#222';X.font='6px monospace';X.fillText(G.bPlayerHpAnim+'/'+G.bPlayer.maxHp,120,86);X.fillStyle=TYPE_CLR[SPECIES[G.bPlayer.sp].type];X.font='5px monospace';X.fillText(TYPES[SPECIES[G.bPlayer.sp].type],170,86);
  X.fillStyle='#F8F0E0';X.fillRect(0,110,GW,50);X.strokeStyle='#444';X.lineWidth=1;X.strokeRect(0,110,GW,50);
  if(G.bTurnState==='menu'){var mi=['FIGHT','BAG','POKeMON','RUN'];X.font='8px monospace';for(var i=0;i<4;i++){var mx=8+(i%2)*70,my=124+Math.floor(i/2)*16;X.fillStyle=i===G.bMenu?'#E84040':'#333';X.fillText(mi[i],mx,my);if(i===G.bMenu&&G.tick%20<14)X.fillRect(mx-5,my-5,3,3);}}else if(G.bTurnState==='moveSelect'){X.font='7px monospace';for(var j=0;j<4;j++){var mv=G.bPlayer.moves[j],mx2=8+(j%2)*112,my2=124+Math.floor(j/2)*14;X.fillStyle=j===G.bMoveSel?'#E84040':'#333';X.fillText(mv.name,mx2,my2);X.fillStyle='#888';X.font='5px monospace';X.fillText('PP:'+mv.pp+'/'+mv.maxPp,mx2+60,my2);X.font='7px monospace';if(j===G.bMoveSel&&G.tick%20<14)X.fillRect(mx2-5,my2-5,3,3);}var sm=G.bPlayer.moves[G.bMoveSel];X.fillStyle=TYPE_CLR[sm.type]||'#888';X.font='6px monospace';X.fillText(TYPES[sm.type]||sm.type,180,150);}
  if(G.bMsg&&G.bMsgTimer>0){X.fillStyle='rgba(248,240,224,0.95)';X.fillRect(0,110,GW,50);X.strokeStyle='#444';X.strokeRect(0,110,GW,50);X.fillStyle='#222';X.font='7px monospace';var words=G.bMsg.split(' '),l1='',l2='';for(var wi=0;wi<words.length;wi++){if(X.measureText(l1+words[wi]).width<GW-16)l1+=words[wi]+' ';else l2+=words[wi]+' ';}X.fillText(l1.trim(),8,128);if(l2)X.fillText(l2.trim(),8,140);if(G.bMsgTimer<30&&G.tick%20<14){X.fillStyle='#333';X.fillRect(GW-12,148,6,4);}}
  if(G.bLevelUp){G.bLevelUpTimer++;if(G.bLevelUpTimer<120){X.fillStyle='rgba(255,255,100,0.3)';X.fillRect(0,0,GW,GH);X.fillStyle='#FFD700';X.font='bold 10px monospace';X.fillText('LEVEL UP!',GW/2-30,50);X.font='8px monospace';X.fillText(SPECIES[G.bPlayer.sp].name+' grew to Lv'+G.bPlayer.level+'!',GW/2-60,65);}}
  if(G.bAnim>0){var pa=G.bAnimTimer/15;if(G.bAnim===1&&pa<0.3){X.fillStyle='rgba(255,255,255,'+(0.6-pa*2)+')';X.fillRect(150,18,48,48);}if(G.bAnim===2&&pa<0.3){X.fillStyle='rgba(255,255,255,'+(0.6-pa*2)+')';X.fillRect(20,68,48,48);}}
}

// ===== Main Game Loop =====
var loopRunning=false;
function gameLoop(){
  if(!gameStarted){requestAnimationFrame(gameLoop);return;}
  G.tick++;
  switch(G.scene){case 'title':updateTitle();break;case 'intro':updateDialog();break;case 'starter':updateStarter();break;case 'overworld':updateOverworld();break;case 'battle':updateBattle();break;}
  X.clearRect(0,0,GW,GH);
  switch(G.scene){case 'title':renderTitle();break;case 'intro':X.fillStyle='#1A1A2E';X.fillRect(0,0,GW,GH);X.fillStyle='#FFCC88';X.font='8px monospace';X.fillText('PROF. OAK',GW/2-28,30);drawNpc(GW/2-8,50,1,0);renderDialog();break;case 'starter':renderStarter();break;case 'overworld':renderOverworld();break;case 'battle':renderBattle();break;}
  clrIn();requestAnimationFrame(gameLoop);
}
// Start the loop immediately — it will wait for gameStarted
loopRunning=true;
requestAnimationFrame(gameLoop);
</script>
