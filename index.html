<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:#111;display:flex;justify-content:center;align-items:center;flex-direction:column;touch-action:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;-webkit-image-rendering:pixelated}
#controls{position:fixed;bottom:0;left:0;right:0;height:140px;pointer-events:none;z-index:20;display:none}
#dpad{position:absolute;bottom:16px;left:16px;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:3px;pointer-events:auto}
#dpad button{background:rgba(60,60,60,0.75);border:2px solid rgba(120,120,120,0.6);color:#ccc;font-size:20px;border-radius:8px;touch-action:manipulation;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#dpad button:active{background:rgba(100,100,100,0.85);border-color:rgba(180,180,180,0.7)}
.du{grid-column:2;grid-row:1}.dl{grid-column:1;grid-row:2}.dc{grid-column:2;grid-row:2}.dr{grid-column:3;grid-row:2}.dd{grid-column:2;grid-row:3}
#btns{position:absolute;bottom:28px;right:16px;display:flex;gap:14px;pointer-events:auto}
#btns button{width:58px;height:58px;border-radius:50%;border:2px solid rgba(120,120,120,0.6);color:#eee;font-size:13px;font-weight:bold;touch-action:manipulation;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#btns button.ba{background:rgba(200,50,50,0.75)}#btns button.bb{background:rgba(50,50,200,0.75)}
#btns button:active{filter:brightness(1.5)}
#install-hint{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#FFCC88;font-family:monospace;font-size:11px;padding:6px 14px;border-radius:8px;z-index:30;pointer-events:none;opacity:0;transition:opacity 0.5s;white-space:nowrap;border:1px solid rgba(255,180,80,0.3)}
#install-hint.show{opacity:1}
@media(hover:none)and (pointer:coarse){#controls{display:block}}
</style>

// ===== PWA: Generate Icon & Manifest =====
(function(){
  // Generate a 180x180 app icon on canvas
  const ic=document.createElement('canvas');ic.width=180;ic.height=180;
  const ix=ic.getContext('2d');
  // Background gradient
  const g=ix.createRadialGradient(90,90,10,90,90,90);
  g.addColorStop(0,'#FF6600');g.addColorStop(0.6,'#CC2200');g.addColorStop(1,'#660000');
  ix.fillStyle=g;ix.fillRect(0,0,180,180);
  // Pixel art fire sprite in center
  ix.fillStyle='#FFAA33';
  ix.fillRect(66,40,48,60);
  ix.fillStyle='#FF7722';
  ix.fillRect(72,36,36,50);
  ix.fillStyle='#FF4400';
  ix.fillRect(78,32,24,40);
  ix.fillStyle='#FFDD55';
  ix.fillRect(84,38,12,20);
  // Eyes
  ix.fillStyle='#FFF';ix.fillRect(80,52,8,8);ix.fillRect(96,52,8,8);
  ix.fillStyle='#000';ix.fillRect(82,54,5,5);ix.fillRect(98,54,5,5);
  // Mouth
  ix.fillStyle='#CC3300';ix.fillRect(84,64,12,4);
  // Tail flame
  ix.fillStyle='#FFCC00';ix.fillRect(54,56,14,14);
  ix.fillStyle='#FF6600';ix.fillRect(48,50,10,10);
  ix.fillStyle='#FFDD55';ix.fillRect(50,52,6,6);
  // Border ring
  ix.strokeStyle='rgba(255,255,255,0.3)';ix.lineWidth=6;
  ix.beginPath();ix.arc(90,90,80,0,Math.PI*2);ix.stroke();
  // Convert to data URI and set as apple-touch-icon
  const iconUri=ic.toDataURL('image/png');
  const link=document.createElement('link');link.rel='apple-touch-icon';link.href=iconUri;
  document.head.appendChild(link);
  // Also set favicon
  const fav=document.createElement('link');fav.rel='icon';fav.type='image/png';fav.href=iconUri;
  document.head.appendChild(fav);
  // Create manifest as blob URL
  const manifest={
    name:'MonFire Red',short_name:'MonFire',description:'A Pokemon Fire Red inspired game',
    start_url:location.href,display:'standalone',orientation:'portrait',
    background_color:'#1A0A00',theme_color:'#1A0A00',
    icons:[{src:iconUri,sizes:'180x180',type:'image/png',purpose:'any maskable'}]
  };
  const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const mLink=document.createElement('link');mLink.rel='manifest';mLink.href=URL.createObjectURL(mBlob);
  document.head.appendChild(mLink);
})();

// ===== iOS Install Hint =====
(function(){
  const hint=document.getElementById('install-hint');
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  if(isIOS&&!isStandalone){
    hint.textContent='Tap Share → Add to Home Screen';
    hint.classList.add('show');
    setTimeout(()=>hint.classList.remove('show'),6000);
  }
})();

// ===== Canvas Setup =====
const C=document.getElementById('game'),X=C.getContext('2d');
const GW=240,GH=160,T=16;
let SCALE=1;
function resize(){
  const isStand=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  // In standalone mode, use full window; in browser, leave room for controls on touch
  const hasTouch=window.matchMedia('(hover:none) and (pointer:coarse)').matches;
  let avW=innerWidth,avH=innerHeight;
  if(hasTouch&&!isStand)avH-=140; // reserve space for controls
  SCALE=Math.max(1,Math.floor(Math.min(avW/GW,avH/GH)));
  C.width=GW;C.height=GH;
  C.style.width=GW*SCALE+'px';C.style.height=GH*SCALE+'px';
}
resize();
addEventListener('resize',resize);
// Also resize on display mode change
window.matchMedia('(display-mode: standalone)').addEventListener('change',resize);

// ===== Input =====
const kd={},kj={};
function kdFn(e,v){
  const c=e.code||e.key;
  if(v&&!kd[c])kj[c]=1;
  kd[c]=v;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Backspace','Space'].includes(c))e.preventDefault();
}
onkeydown=e=>kdFn(e,1);onkeyup=e=>kdFn(e,0);

// Touch/pointer controls
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const onDown=e=>{e.preventDefault();e.stopPropagation();if(!kd[k])kj[k]=1;kd[k]=1;};
  const onUp=e=>{e.preventDefault();e.stopPropagation();kd[k]=0;};
  b.addEventListener('touchstart',onDown,{passive:false});
  b.addEventListener('touchend',onUp,{passive:false});
  b.addEventListener('touchcancel',onUp,{passive:false});
  b.addEventListener('mousedown!','ignore');
  b.addEventListener('mousedown',onDown);
  b.addEventListener('mouseup',onUp);
  b.addEventListener('mouseleave',onUp);
});
// Prevent canvas touches from doing anything except via controls
C.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
C.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

function jp(c){return kj[c]}function kp(c){return kd[c]}
function clrIn(){for(let k in kj)kj[k]=0}

// ===== Audio =====
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function beep(f,d,t='square',v=0.08){
  if(!audioCtx)return;try{
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=t;o.frequency.value=f;g.gain.value=v;
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
  o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function sfxStep(){beep(200,0.05,'square',0.03)}
function sfxSelect(){beep(600,0.08);setTimeout(()=>beep(900,0.08),60)}
function sfxHit(){beep(150,0.15,'sawtooth',0.1)}
function sfxDamage(){beep(100,0.2,'sawtooth',0.08);setTimeout(()=>beep(80,0.15,'sawtooth',0.06),80)}
function sfxHeal(){beep(523,0.1,'sine',0.08);setTimeout(()=>beep(659,0.1,'sine',0.08),100);setTimeout(()=>beep(784,0.15,'sine',0.08),200)}
function sfxFaint(){beep(400,0.1);setTimeout(()=>beep(300,0.1),80);setTimeout(()=>beep(200,0.15),160);setTimeout(()=>beep(100,0.2),240)}
function sfxEncounter(){beep(200,0.05);setTimeout(()=>beep(400,0.05),50);setTimeout(()=>beep(800,0.1),100)}
function sfxLevelUp(){[523,587,659,698,784,880].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'sine',0.07),i*70))}

function drawSp(c,x,y,d,pal,s){
  for(let r=0;r<d.length;r++)for(let cl=0;cl<d[r].length;cl++){
    const ch=d[r][cl];if(ch!=='.'&&pal[ch]){c.fillStyle=pal[ch];c.fillRect(Math.floor(x+cl*s),Math.floor(y+r*s),Math.ceil(s),Math.ceil(s));}
  }
}

// ===== Create Pokemon Instance =====
function makeMon(speciesId,level){
  const sp=SPECIES[speciesId];
  const m={sp:sp.id,level:level,exp:0,moves:[],hp:0};
  function calcStat(base){return Math.floor((2*base*level)/100)+5;}
  m.maxHp=Math.floor((2*sp.base.hp*level)/100)+level+10;
  m.atk=calcStat(sp.base.atk);m.def=calcStat(sp.base.def);
  m.spd=calcStat(sp.base.spd);m.spA=calcStat(sp.base.spA);m.spD=calcStat(sp.base.spD);
  m.hp=m.maxHp;
  sp.moves.forEach(mv=>{m.moves.push({...mv})});
  m.expNext=level*level*4;
  return m;
}
function recalcStats(m){
  const sp=SPECIES[m.sp];
  function cs(b){return Math.floor((2*b*m.level)/100)+5;}
  m.maxHp=Math.floor((2*sp.base.hp*m.level)/100)+m.level+10;
  m.atk=cs(sp.base.atk);m.def=cs(sp.base.def);
  m.spd=cs(sp.base.spd);m.spA=cs(sp.base.spA);m.spD=cs(sp.base.spD);
}

// ===== Collision =====
function getTile(mapId,x,y){
  const m=MAPS[mapId];
  if(x<0||y<0||x>=m.w||y>=m.h)return 3;
  return m.tiles[y][x];
}
function isBlocked(mapId,x,y){
  const t=getTile(mapId,x,y);
  return t===3||t===7||t===10||t===13;
}
function isNpc(mapId,x,y){
  for(let n of NPCS)if(n[0]===mapId&&n[1]===x&&n[2]===y)return n;
  return null;
}

// ===== Dialog =====
function showDialog(lines,cb){G.dlgLines=lines;G.dlgIdx=0;G.dlgChar=0;G.dlgTimer=0;G.dlgDone=false;G.dlgCb=cb||null;}
function updateDialog(){
  if(!G.dlgLines.length)return;
  const line=G.dlgLines[G.dlgIdx];
  if(!G.dlgDone){
    G.dlgTimer++;
    if(G.dlgTimer%2===0&&G.dlgChar<line.length)G.dlgChar++;
    if(G.dlgChar>=line.length)G.dlgDone=true;
    if(jp('Enter')||jp('KeyZ')){
      if(G.dlgDone){advanceDialog();}else{G.dlgChar=line.length;G.dlgDone=true;}
    }
  }else{
    if(jp('Enter')||jp('KeyZ'))advanceDialog();
  }
}
function advanceDialog(){
  G.dlgIdx++;
  if(G.dlgIdx>=G.dlgLines.length){
    G.dlgLines=[];G.dlgIdx=0;
    if(G.dlgCb)G.dlgCb();
  }else{G.dlgChar=0;G.dlgDone=false;G.dlgTimer=0;}
}
function renderDialog(){
  if(!G.dlgLines.length)return;
  const line=G.dlgLines[G.dlgIdx];
  const txt=line.substring(0,G.dlgChar);
  X.fillStyle='rgba(255,255,255,0.92)';X.fillRect(4,GH-40,GW-8,36);
  X.strokeStyle='#333';X.lineWidth=1;X.strokeRect(4,GH-40,GW-8,36);
  X.fillStyle='#222';X.font='8px monospace';
  const maxW=GW-20;let display='';let cur='';
  for(let ch of txt){cur+=ch;if(X.measureText(cur).width>maxW){display+='\n';cur=ch;}display+=ch;}
  const lines=display.split('\n');
  lines.forEach((l,i)=>X.fillText(l,12,GH-28+i*10));
  if(G.dlgDone&&G.tick%30<15){X.fillStyle='#333';X.fillRect(GW-16,GH-18,6,4);}
}

// ===== Transition =====
function startTransition(type,cb){G.transType=type;G.transTimer=0;G.transCb=cb;}
function updateTransition(){
  if(!G.transType)return;G.transTimer++;
  const dur=G.transType==='battle'?30:20;
  if(G.transTimer>=dur){if(G.transCb)G.transCb();G.transType='';G.transTimer=0;}
}
function renderTransition(){
  if(!G.transType)return;
  const dur=G.transType==='battle'?30:20;
  const p=G.transTimer/dur;X.fillStyle='#000';
  if(G.transType==='battle'){
    const strips=8;
    for(let i=0;i<strips;i++){
      const sp=Math.max(0,Math.min(1,p*1.5-i*0.08));
      const w=GW/strips*sp;
      X.fillRect(0,i*(GH/strips),w,GH/strips);
      X.fillRect(GW-w,i*(GH/strips),w,GH/strips);
    }
  }else{X.globalAlpha=p;X.fillRect(0,0,GW,GH);X.globalAlpha=1;}
}

// ===== Overworld Scene =====
function updateOverworld(){
  if(G.pcHealing){G.pcTimer++;if(G.pcTimer>60){G.pcHealing=false;G.pcTimer=0;}return;}
  if(G.flashTimer>0){G.flashTimer--;return;}
  if(G.transType){updateTransition();return;}
  if(G.dlgLines.length){updateDialog();return;}
  if(G.menuOpen){updateMenu();return;}

  if(!G.pMoving){
    let dx=0,dy=0;
    if(kp('ArrowDown')||kp('KeyS')){dy=1;G.pDir=0;}
    else if(kp('ArrowUp')||kp('KeyW')){dy=-1;G.pDir=1;}
    else if(kp('ArrowLeft')||kp('KeyA')){dx=-1;G.pDir=2;}
    else if(kp('ArrowRight')||kp('KeyD')){dx=1;G.pDir=3;}
    if(dx||dy){
      const nx=G.px+dx,ny=G.py+dy;
      const npc=isNpc(G.mapId,nx,ny);
      if(!isBlocked(G.mapId,nx,ny)&&!npc){
        G.pPGx=G.px;G.pPGy=G.py;G.px=nx;G.py=ny;
        G.pMoving=true;G.pMT=0;sfxStep();
      }
    }
    if(jp('Enter')||jp('KeyZ')){
      const fx=G.px+[0,0,-1,1][G.pDir],fy=G.py+[1,-1,0,0][G.pDir];
      const npc=isNpc(G.mapId,fx,fy);
      if(npc){const lines=[];for(let i=4;i<npc.length;i++)lines.push(npc[i]);showDialog(lines);sfxSelect();}
      const pt=getTile(G.mapId,fx,fy);
      if(pt===6){
        if(G.mapId===2&&fx===4&&fy===8){
          G.pcHealing=true;G.pcTimer=0;
          G.party.forEach(m=>{m.hp=m.maxHp;m.moves.forEach(mv=>mv.pp=mv.maxPp);});
          sfxHeal();showDialog(["Welcome to the PokeCenter!","Your Pokemon have been healed.","Come again!"]);
        }else if(G.mapId===0){showDialog(["The door is locked...","Nobody seems to be home."]);}
        else{showDialog(["The building is closed.","Come back later!"]);}
        sfxSelect();
      }
    }
    if(jp('Backspace')||jp('KeyX')){G.menuOpen=true;G.menuSel=0;sfxSelect();}
  }

  if(G.pMoving){
    G.pMT++;
    const t=G.pMT/G.pMS;
    G.pVx=G.pPGx+(G.px-G.pPGx)*t;G.pVy=G.pPGy+(G.py-G.pPGy)*t;
    G.pFrame=Math.floor(G.pMT/(G.pMS/2))%2;
    if(G.pMT>=G.pMS){G.pMoving=false;G.pVx=G.px;G.pVy=G.py;G.pFrame=0;onTileEnter(G.px,G.py);}
  }
  checkMapTransition();
}
function onTileEnter(x,y){
  const t=getTile(G.mapId,x,y);
  if(t===2){
    const m=MAPS[G.mapId];
    if(m.wild.length>0){
      for(let w of m.wild){
        if(Math.random()<w.ch){
          const lvl=w.lvl[0]+Math.floor(Math.random()*(w.lvl[1]-w.lvl[0]+1));
          G.bEnemy=makeMon(w.id,lvl);G.bPlayer=G.party[0];
          startTransition('battle',()=>{G.scene='battle';initBattle();});
          sfxEncounter();return;
        }
      }
    }
  }
}
function checkMapTransition(){
  const m=MAPS[G.mapId];
  if(G.py<=0&&G.mapId===1)warpTo(0,9,13);
  else if(G.py>=m.h-1&&G.mapId===0)warpTo(1,9,1);
  else if(G.py>=m.h-1&&G.mapId===1)warpTo(2,9,1);
  else if(G.py<=0&&G.mapId===2)warpTo(1,1,18);
  if(G.px<=0&&G.mapId===1){G.px=1;G.pVx=1;}
  if(G.px>=m.w-1&&G.mapId===1){G.px=m.w-2;G.pVx=m.w-2;}
}
function warpTo(mapId,x,y){G.mapId=mapId;G.px=x;G.py=y;G.pVx=x;G.pVy=y;G.pPGx=x;G.pPGy=y;G.pMoving=false;}

function renderOverworld(){
  const m=MAPS[G.mapId];
  let camX=G.pVx*T-(GW-T)/2,camY=G.pVy*T-(GH-T)/2;
  camX=Math.max(0,Math.min(camX,m.w*T-GW));camY=Math.max(0,Math.min(camY,m.h*T-GH));
  const sx=Math.floor(camX/T),sy=Math.floor(camY/T);
  const ox=-(camX%T),oy=-(camY%T);
  for(let dy=-1;dy<=Math.ceil(GH/T)+1;dy++)for(let dx=-1;dx<=Math.ceil(GW/T)+1;dx++){
    const tx=sx+dx,ty=sy+dy;
    if(tx>=0&&ty>=0&&tx<m.w&&ty<m.h)drawTile(ox+dx*T,oy+dy*T,m.tiles[ty][tx],G.tick);
  }
  for(let n of NPCS){if(n[0]===G.mapId){const nx=n[1]*T-camX,ny=n[2]*T-camY;if(nx>-T&&nx<GW+T&&ny>-T&&ny<GH+T)drawNpc(nx,ny,NPCS.indexOf(n),n[3]);}}
  drawPlayer(G.pVx*T-camX,G.pVy*T-camY,G.pDir,G.pFrame);
  // Tall grass overlay on player
  for(let dy=-1;dy<=Math.ceil(GH/T)+1;dy++)for(let dx=-1;dx<=Math.ceil(GW/T)+1;dx++){
    const tx=sx+dx,ty=sy+dy;
    if(tx>=0&&ty>=0&&tx<m.w&&ty<m.h&&m.tiles[ty][tx]===2){
      const gx=ox+dx*T,gy=oy+dy*T;
      if(Math.floor(G.pVx)===tx&&Math.floor(G.pVy)===ty){
        X.fillStyle='rgba(74,140,42,0.6)';const sw=Math.sin(G.tick*0.1+tx*2+ty)*1;
        X.fillRect(gx+1,gy+sw,6,3);X.fillRect(gx+9,gy-sw+2,5,3);
      }
    }
  }
  // HUD
  X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(0,0,GW,14);
  X.fillStyle='#FFF';X.font='7px monospace';X.fillText(m.name,4,10);
  if(G.party.length>0){
    const pm=G.party[0];X.fillStyle='#FFF';X.font='6px monospace';
    X.fillText(SPECIES[pm.sp].name+' Lv'+pm.level,90,10);
    X.fillStyle='#444';X.fillRect(155,4,60,5);
    X.fillStyle=pm.hp/pm.maxHp>0.5?'#4CAF50':pm.hp/pm.maxHp>0.2?'#FF9800':'#F44336';
    X.fillRect(155,4,Math.floor(60*pm.hp/pm.maxHp),5);
    X.fillStyle='#FFF';X.font='5px monospace';X.fillText(pm.hp+'/'+pm.maxHp,155,12);
  }
  if(G.pcHealing){const p=G.pcTimer/60;if(p<0.5){X.fillStyle=`rgba(255,255,255,${0.3*Math.sin(p*Math.PI*4)})`;X.fillRect(0,0,GW,GH);}}
  if(G.menuOpen)renderMenu();
  renderDialog();renderTransition();
  if(G.flashTimer>0){X.fillStyle=`rgba(255,255,255,${G.flashTimer/10})`;X.fillRect(0,0,GW,GH);}
}

// ===== Menu =====
function updateMenu(){
  if(jp('ArrowUp'))G.menuSel=(G.menuSel+2)%3;
  if(jp('ArrowDown'))G.menuSel=(G.menuSel+1)%3;
  if(jp('Backspace')||jp('KeyX')){G.menuOpen=false;sfxSelect();}
  if(jp('Enter')||jp('KeyZ')){sfxSelect();G.menuOpen=false;}
}
function renderMenu(){
  X.fillStyle='rgba(0,0,0,0.6)';X.fillRect(0,0,GW,GH);
  X.fillStyle='#F8F8F8';X.fillRect(GW-80,20,76,70);
  X.strokeStyle='#333';X.lineWidth=1;X.strokeRect(GW-80,20,76,70);
  const items=['POKeMON','BAG','EXIT'];
  X.font='8px monospace';
  items.forEach((it,i)=>{X.fillStyle=i===G.menuSel?'#E84040':'#333';X.fillText(it,GW-70,38+i*20);if(i===G.menuSel&&G.tick%30<20)X.fillRect(GW-76,34+i*20,4,4);});
  if(G.party.length>0){const pm=G.party[0],sp=SPECIES[pm.sp];X.fillStyle='#333';X.font='6px monospace';X.fillText(sp.name+' Lv'+pm.level,8,30);X.fillText('HP: '+pm.hp+'/'+pm.maxHp,8,42);X.fillText('ATK: '+pm.atk+' DEF: '+pm.def,8,54);X.fillText('Type: '+TYPES[sp.type],8,66);}
}

// ===== Battle System =====
function initBattle(){
  G.bMenu=0;G.bMoveSel=0;G.bMsg='';G.bMsgTimer=0;G.bAnim=0;G.bAnimTimer=0;
  G.bPlayerHpAnim=G.bPlayer.hp;G.bEnemyHpAnim=G.bEnemy.hp;
  G.bTurnState='menu';G.bTurnTimer=0;
  G.bExpGain=0;G.bExpAnim=0;G.bLevelUp=false;G.bLevelUpTimer=0;
  G.bFainted=false;G.bRan=false;G.bCatchAnim=0;
  G.bMsg='A wild '+SPECIES[G.bEnemy.sp].name+' appeared!';G.bMsgTimer=60;
}
function calcDamage(atk,def,move){
  if(move.pow===0)return 0;
  const lv=atk.level;const a=move.type==='normal'?atk.atk:atk.spA;const d=move.type==='normal'?def.def:def.spD;
  let dmg=Math.floor(((2*lv/5+2)*move.pow*(a/d))/50+2);
  if(move.type===SPECIES[atk.sp].type)dmg=Math.floor(dmg*1.5);
  const eff=(TYPE_EFF[move.type]&&TYPE_EFF[move.type][SPECIES[def.sp].type])||1;
  dmg=Math.floor(dmg*eff);dmg=Math.floor(dmg*(0.85+Math.random()*0.15));
  return Math.max(1,dmg);
}
function execMove(user,target,move,isP){
  if(Math.random()*100>move.acc)return (isP?SPECIES[user.sp].name:'Wild '+SPECIES[target.sp].name)+"'s attack missed!";
  const dmg=calcDamage(user,target,move);target.hp=Math.max(0,target.hp-dmg);
  const eff=(TYPE_EFF[move.type]&&TYPE_EFF[move.type][SPECIES[target.sp].type])||1;
  let em='';if(eff>=2)em=" It's super effective!";else if(eff<=0.5)em=" It's not very effective...";
  return (isP?SPECIES[user.sp].name:'Wild '+SPECIES[user.sp].name)+' used '+move.name+'!'+em;
}
function enemyAttack(){
  if(G.bEnemy.hp<=0||G.bPlayer.hp<=0)return;
  const eMove=G.bEnemy.moves[Math.floor(Math.random()*G.bEnemy.moves.length)];
  const msg=execMove(G.bEnemy,G.bPlayer,eMove,false);
  G.bMsg=msg;G.bMsgTimer=50;G.bAnim=2;G.bAnimTimer=0;sfxDamage();
  setTimeout(()=>{G.bTurnState='menu';G.bMsg='';G.bMsgTimer=0;},800);
}
function updateBattle(){
  if(G.bMsgTimer>0){G.bMsgTimer--;if(jp('Enter')||jp('KeyZ'))G.bMsgTimer=0;return;}
  if(G.bPlayerHpAnim>G.bPlayer.hp)G.bPlayerHpAnim=Math.max(G.bPlayer.hp,G.bPlayerHpAnim-Math.max(1,Math.ceil(G.bPlayer.maxHp/30)));
  if(G.bEnemyHpAnim>G.bEnemy.hp)G.bEnemyHpAnim=Math.max(G.bEnemy.hp,G.bEnemyHpAnim-Math.max(1,Math.ceil(G.bEnemy.maxHp/30)));
  if(G.bAnim>0){G.bAnimTimer++;if(G.bAnimTimer>15){G.bAnim=0;G.bAnimTimer=0;}return;}
  if(G.bEnemy.hp<=0&&!G.bFainted){
    G.bFainted=true;sfxFaint();
    const eg=G.bEnemy.level*3;G.bExpGain=eg;G.bExpAnim=0;
    G.bMsg='Wild '+SPECIES[G.bEnemy.sp].name+' fainted! +'+eg+' EXP';G.bMsgTimer=90;
    G.bPlayer.exp+=eg;
    if(G.bPlayer.exp>=G.bPlayer.expNext){
      G.bPlayer.level++;G.bPlayer.exp=0;G.bPlayer.expNext=G.bPlayer.level*G.bPlayer.level*4;
      recalcStats(G.bPlayer);G.bPlayer.hp=Math.min(G.bPlayer.hp+5,G.bPlayer.maxHp);
      G.bLevelUp=true;G.bLevelUpTimer=0;sfxLevelUp();
    }
    return;
  }
  if(G.bFainted&&G.bMsgTimer<=0){if(jp('Enter')||jp('KeyZ')){G.scene='overworld';G.flashTimer=5;}return;}
  if(G.bPlayer.hp<=0){
    if(G.bMsgTimer<=-30&&(jp('Enter')||jp('KeyZ'))){G.bPlayer.hp=G.bPlayer.maxHp;G.bPlayer.moves.forEach(mv=>mv.pp=mv.maxPp);G.scene='overworld';G.mapId=0;G.px=9;G.py=6;G.pVx=9;G.pVy=6;return;}
    if(G.bMsgTimer>0){G.bMsgTimer--;if(jp('Enter')||jp('KeyZ'))G.bMsgTimer=0;return;}
    if(G.bMsgTimer===0){G.bMsg=SPECIES[G.bPlayer.sp].name+' fainted...';G.bMsgTimer=90;sfxFaint();}
    G.bMsgTimer--;return;
  }
  if(G.bRan){if(jp('Enter')||jp('KeyZ')){G.scene='overworld';G.flashTimer=5;}return;}

  if(G.bTurnState==='menu'){
    if(jp('ArrowUp'))G.bMenu=(G.bMenu+2)%4;
    if(jp('ArrowDown'))G.bMenu=(G.bMenu+1)%4;
    if(jp('ArrowLeft'))G.bMenu=G.bMenu<2?G.bMenu:G.bMenu-2;
    if(jp('ArrowRight'))G.bMenu=G.bMenu<2?G.bMenu+2:G.bMenu;
    if(jp('Enter')||jp('KeyZ')){
      sfxSelect();
      if(G.bMenu===0){G.bTurnState='moveSelect';G.bMoveSel=0;}
      else if(G.bMenu===3){
        if(Math.random()<0.7){G.bMsg='Got away safely!';G.bMsgTimer=50;G.bRan=true;}
        else{G.bMsg="Can't escape!";G.bMsgTimer=40;setTimeout(()=>enemyAttack(),500);}
      }
    }
  }
  else if(G.bTurnState==='moveSelect'){
    if(jp('ArrowUp'))G.bMoveSel=(G.bMoveSel+2)%4;
    if(jp('ArrowDown'))G.bMoveSel=(G.bMoveSel+1)%4;
    if(jp('Backspace')||jp('KeyX')){G.bTurnState='menu';sfxSelect();}
    if(jp('Enter')||jp('KeyZ')){
      const move=G.bPlayer.moves[G.bMoveSel];
      if(move.pp>0){
        move.pp--;sfxHit();
        const pFirst=G.bPlayer.spd>=G.bEnemy.spd;
        if(pFirst){
          const m1=execMove(G.bPlayer,G.bEnemy,move,true);G.bMsg=m1;G.bMsgTimer=50;G.bAnim=1;G.bAnimTimer=0;sfxDamage();
          if(G.bEnemy.hp>0){setTimeout(()=>enemyAttack(),700);}
          else{setTimeout(()=>{G.bTurnState='menu';},500);}
        }else{
          const em=G.bEnemy.moves[Math.floor(Math.random()*G.bEnemy.moves.length)];
          const m1=execMove(G.bEnemy,G.bPlayer,em,false);G.bMsg=m1;G.bMsgTimer=50;G.bAnim=2;G.bAnimTimer=0;sfxDamage();
          if(G.bPlayer.hp>0){setTimeout(()=>{const m2=execMove(G.bPlayer,G.bEnemy,move,true);G.bMsg=m2;G.bMsgTimer=50;G.bAnim=1;G.bAnimTimer=0;sfxDamage();setTimeout(()=>{G.bTurnState='menu';G.bMsg='';G.bMsgTimer=0;},800);},700);}
          else{setTimeout(()=>{G.bTurnState='menu';},500);}
        }
        G.bTurnState='animating';
      }else{G.bMsg='No PP left for this move!';G.bMsgTimer=30;}
    }
  }
}

function renderBattle(){
  const grd=X.createLinearGradient(0,0,0,GH);grd.addColorStop(0,'#E8F0E8');grd.addColorStop(1,'#B8C8A8');
  X.fillStyle=grd;X.fillRect(0,0,GW,GH);
  X.fillStyle='#90A880';X.fillRect(0,90,GW,2);X.fillRect(0,92,GW,1);
  X.fillStyle='#A8C098';X.fillRect(0,50,130,2);X.fillRect(0,52,130,1);

  if(G.bEnemy.hp>0||G.bFainted){
    const esp=SP[SPECIES[G.bEnemy.sp].sprF];
    const eShake=G.bAnim===1&&G.bAnimTimer%4<2?2:0;
    drawSp(X,150+eShake,18,esp.d,esp.p,3);
  }
  const psp=SP[SPECIES[G.bPlayer.sp].sprB];
  const pShake=G.bAnim===2&&G.bAnimTimer%4<2?2:0;
  drawSp(X,20+pShake,68,psp.d,psp.p,3);

  // Enemy info
  X.fillStyle='rgba(255,255,255,0.9)';X.fillRect(4,4,120,30);X.strokeStyle='#444';X.lineWidth=1;X.strokeRect(4,4,120,30);
  X.fillStyle='#222';X.font='7px monospace';X.fillText(SPECIES[G.bEnemy.sp].name,8,14);X.fillText('Lv'+G.bEnemy.level,90,14);
  X.fillStyle='#444';X.fillRect(8,18,100,5);
  const eHp=G.bEnemyHpAnim/G.bEnemy.maxHp;
  X.fillStyle=eHp>0.5?'#4CAF50':eHp>0.2?'#FF9800':'#F44336';X.fillRect(8,18,Math.floor(100*eHp),5);
  X.fillStyle=TYPE_CLR[SPECIES[G.bEnemy.sp].type];X.font='5px monospace';X.fillText(TYPES[SPECIES[G.bEnemy.sp].type],8,30);

  // Player info
  X.fillStyle='rgba(255,255,255,0.9)';X.fillRect(116,56,120,36);X.strokeStyle='#444';X.strokeRect(116,56,120,36);
  X.fillStyle='#222';X.font='7px monospace';X.fillText(SPECIES[G.bPlayer.sp].name,120,66);X.fillText('Lv'+G.bPlayer.level,204,66);
  X.fillStyle='#444';X.fillRect(120,70,100,5);
  const pHp=G.bPlayerHpAnim/G.bPlayer.maxHp;
  X.fillStyle=pHp>0.5?'#4CAF50':pHp>0.2?'#FF9800':'#F44336';X.fillRect(120,70,Math.floor(100*pHp),5);
  X.fillStyle='#222';X.font='6px monospace';X.fillText(G.bPlayerHpAnim+'/'+G.bPlayer.maxHp,120,86);
  X.fillStyle=TYPE_CLR[SPECIES[G.bPlayer.sp].type];X.font='5px monospace';X.fillText(TYPES[SPECIES[G.bPlayer.sp].type],170,86);

  // Bottom panel
  X.fillStyle='#F8F0E0';X.fillRect(0,110,GW,50);X.strokeStyle='#444';X.lineWidth=1;X.strokeRect(0,110,GW,50);

  if(G.bTurnState==='menu'){
    const mi=['FIGHT','BAG','POKeMON','RUN'];X.font='8px monospace';
    for(let i=0;i<4;i++){const mx=8+(i%2)*70,my=124+Math.floor(i/2)*16;X.fillStyle=i===G.bMenu?'#E84040':'#333';X.fillText(mi[i],mx,my);if(i===G.bMenu&&G.tick%20<14)X.fillRect(mx-5,my-5,3,3);}
  }else if(G.bTurnState==='moveSelect'){
    X.font='7px monospace';
    for(let i=0;i<4;i++){const mv=G.bPlayer.moves[i];const mx=8+(i%2)*112,my=124+Math.floor(i/2)*14;X.fillStyle=i===G.bMoveSel?'#E84040':'#333';X.fillText(mv.name,mx,my);X.fillStyle='#888';X.font='5px monospace';X.fillText('PP:'+mv.pp+'/'+mv.maxPp,mx+60,my);X.font='7px monospace';if(i===G.bMoveSel&&G.tick%20<14)X.fillRect(mx-5,my-5,3,3);}
    const sm=G.bPlayer.moves[G.bMoveSel];X.fillStyle=TYPE_CLR[sm.type]||'#888';X.font='6px monospace';X.fillText(TYPES[sm.type]||sm.type,180,150);
  }

  if(G.bMsg&&G.bMsgTimer>0){
    X.fillStyle='rgba(248,240,224,0.95)';X.fillRect(0,110,GW,50);X.strokeStyle='#444';X.strokeRect(0,110,GW,50);
    X.fillStyle='#222';X.font='7px monospace';
    const words=G.bMsg.split(' ');let l1='',l2='';
    for(let w of words){if(X.measureText(l1+w).width<GW-16)l1+=w+' ';else l2+=w+' ';}
    X.fillText(l1.trim(),8,128);if(l2)X.fillText(l2.trim(),8,140);
    if(G.bMsgTimer<30&&G.tick%20<14){X.fillStyle='#333';X.fillRect(GW-12,148,6,4);}
  }
  if(G.bLevelUp){
    G.bLevelUpTimer++;
    if(G.bLevelUpTimer<120){X.fillStyle='rgba(255,255,100,0.3)';X.fillRect(0,0,GW,GH);X.fillStyle='#FFD700';X.font='bold 10px monospace';X.fillText('LEVEL UP!',GW/2-30,50);X.font='8px monospace';X.fillText(SPECIES[G.bPlayer.sp].name+' grew to Lv'+G.bPlayer.level+'!',GW/2-60,65);}
  }
  if(G.bAnim>0){const p=G.bAnimTimer/15;if(G.bAnim===1&&p<0.3){X.fillStyle=`rgba(255,255,255,${0.6-p*2})`;X.fillRect(150,18,48,48);}if(G.bAnim===2&&p<0.3){X.fillStyle=`rgba(255,255,255,${0.6-p*2})`;X.fillRect(20,68,48,48);}}
}

// ===== Main Loop =====
function gameLoop(){
  G.tick++;
  switch(G.scene){
    case 'title':updateTitle();break;
    case 'intro':updateDialog();break;
    case 'starter':updateStarter();break;
    case 'overworld':updateOverworld();break;
    case 'battle':updateBattle();break;
  }
  X.clearRect(0,0,GW,GH);
  switch(G.scene){
    case 'title':renderTitle();break;
    case 'intro':X.fillStyle='#1A1A2E';X.fillRect(0,0,GW,GH);X.fillStyle='#FFCC88';X.font='8px monospace';X.fillText('PROF. OAK',GW/2-28,30);drawNpc(GW/2-8,50,1,0);renderDialog();break;
    case 'starter':renderStarter();break;
    case 'overworld':renderOverworld();break;
    case 'battle':renderBattle();break;
  }
  clrIn();requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
