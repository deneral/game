  b.addEventListener('mousedown',e=>{if(!kd[k])kj[k]=1;kd[k]=1;});
  b.addEventListener('mouseup',e=>{kd[k]=0;});
});

// ===== AUDIO =====
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function beep(f,d,t='square',v=0.08){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=t;o.frequency.value=f;g.gain.value=v;
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
  o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);
}
function sfxStep(){beep(200,0.05,'square',0.03)}
function sfxSelect(){beep(600,0.08);setTimeout(()=>beep(900,0.08),60)}
function sfxHit(){beep(150,0.15,'sawtooth',0.1)}

// ===== CREATE POKEMON INSTANCE =====
function makeMon(speciesId,level){
  const sp=SPECIES[speciesId];
  const m={sp:sp.id,level:level,exp:0,moves:[],hp:0};
  // Calculate stats
  function calcStat(base){return Math.floor((2*base*level)/100)+5;}
  m.maxHp=Math.floor((2*sp.base.hp*level)/100)+level+10;
  m.atk=calcStat(sp.base.atk);m.def=calcStat(sp.base.def);
  m.spd=calcStat(sp.base.spd);m.spA=calcStat(sp.base.spA);m.spD=calcStat(sp.base.spD);
  m.hp=m.maxHp;
  // Copy moves
  sp.moves.forEach(mv=>{m.moves.push({...mv})});
  // Exp to next level
  m.expNext=level*level*4;
  return m;
}
function recalcStats(m){
  const sp=SPECIES[m.sp];
  function cs(b){return Math.floor((2*b*m.level)/100)+5;}
  m.maxHp=Math.floor((2*sp.base.hp*m.level)/100)+m.level+10;
  m.atk=cs(sp.base.atk);m.def=cs(sp.base.def);
  m.spd=cs(sp.base.spd);m.spA=cs(sp.base.spA);m.spD=cs(sp.base.spD);
}

// ===== COLLISION =====
function getTile(mapId,x,y){
  const m=MAPS[mapId];
  if(x<0||y<0||x>=m.w||y>=m.h)return 3; // out of bounds = tree
  return m.tiles[y][x];
}
function isBlocked(mapId,x,y){
  const t=getTile(mapId,x,y);
  return t===3||t===7||t===10||t===13; // tree, water, fence, ledge
}
function isNpc(mapId,x,y){
  for(let n of NPCS)if(n[0]===mapId&&n[1]===x&&n[2]===y)return n;
  return null;
}

// ===== DIALOG SYSTEM =====
function showDialog(lines,cb){G.dlgLines=lines;G.dlgIdx=0;G.dlgChar=0;G.dlgTimer=0;G.dlgDone=false;G.dlgCb=cb||null;}
function updateDialog(){
  if(!G.dlgLines.length)return;
  const line=G.dlgLines[G.dlgIdx];
  if(!G.dlgDone){
    G.dlgTimer++;
    if(G.dlgTimer%2===0&&G.dlgChar<line.length)G.dlgChar++;
    if(G.dlgChar>=line.length)G.dlgDone=true;
    if(jp('Enter')||jp('KeyZ')){
      if(G.dlgDone){advanceDialog();}
      else{G.dlgChar=line.length;G.dlgDone=true;}
    }
  }else{
    if(jp('Enter')||jp('KeyZ'))advanceDialog();
  }
}
function advanceDialog(){
  G.dlgIdx++;
  if(G.dlgIdx>=G.dlgLines.length){
    G.dlgLines=[];G.dlgIdx=0;
    if(G.dlgCb)G.dlgCb();
  }else{
    G.dlgChar=0;G.dlgDone=false;G.dlgTimer=0;
  }
}
function renderDialog(){
  if(!G.dlgLines.length)return;
  const line=G.dlgLines[G.dlgIdx];
  const txt=line.substring(0,G.dlgChar);
  // Dialog box
  X.fillStyle='rgba(255,255,255,0.92)';X.fillRect(4,GH-40,GW-8,36);
  X.strokeStyle='#333';X.lineWidth=1;X.strokeRect(4,GH-40,GW-8,36);
  X.fillStyle='#222';X.font='8px monospace';
  // Word wrap
  const maxW=GW-20;let display='';let cur='';
  for(let ch of txt){
    cur+=ch;
    if(X.measureText(cur).width>maxW){display+='\n';cur=ch;}
    display+=ch;
  }
  const lines=display.split('\n');
  lines.forEach((l,i)=>X.fillText(l,12,GH-28+i*10));
  // Cursor blink
  if(G.dlgDone&&G.tick%30<15){
    X.fillStyle='#333';X.fillRect(GW-16,GH-18,6,4);
  }
}

// ===== TRANSITION =====
function startTransition(type,cb){G.transType=type;G.transTimer=0;G.transCb=cb;}
function updateTransition(){
  if(!G.transType)return;
  G.transTimer++;
  const dur=G.transType==='battle'?30:20;
  if(G.transTimer>=dur){
    if(G.transCb)G.transCb();
    G.transType='';G.transTimer=0;
  }
}
function renderTransition(){
  if(!G.transType)return;
  const dur=G.transType==='battle'?30:20;
  const p=G.transTimer/dur;
  X.fillStyle='#000';
  if(G.transType==='battle'){
    // Horizontal blinds effect
    const strips=8;
    for(let i=0;i<strips;i++){
      const sp=Math.max(0,Math.min(1,p*1.5-i*0.08));
      const w=GW/strips*sp;
      X.fillRect(0,i*(GH/strips),w,GH/strips);
      X.fillRect(GW-w,i*(GH/strips),w,GH/strips);
    }
  }else{
    // Fade
    X.globalAlpha=p;X.fillRect(0,0,GW,GH);X.globalAlpha=1;
  }
}

// ===== TILE RENDERING =====
const TILE_COLORS={
  grass1:'#6DB33F',grass2:'#5EA832',grass3:'#7CC347',
  path1:'#D4B896',path2:'#C4A886',path3:'#E4C8A6',
  tallGrass1:'#4A8C2A',tallGrass2:'#3D7A20',tallGrass3:'#5EA832',
  tree1:'#2D5A1E',tree2:'#1E4A0F',tree3:'#3D6A2E',trunk:'#6B4226',
  wall1:'#E8D8B8',wall2:'#D4C4A4',wall3:'#C0B090',
  roof1:'#C83030',roof2:'#A82020',roof3:'#E84040',
  water1:'#4488CC',water2:'#3366AA',water3:'#5599DD',
  pcFloor1:'#F8E8E8',pcFloor2:'#E8D8D8',
  flower1:'#FF4466',flower2:'#FFAA22',flower3:'#FF66AA',
  fence1:'#8B6914',fence2:'#6B4910',
  martRoof1:'#30A0C8',martRoof2:'#2080A8',
};

function drawTile(tx,ty,tile,tick){
  const x=tx*T,y=ty*T;
  const tc=TILE_COLORS;
  const iv=Math.floor(tick/30)%4;
  switch(tile){
    case 0: // Grass
      X.fillStyle=tc.grass1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.grass2;
      X.fillRect(x+3,y+2,2,2);X.fillRect(x+9,y+6,2,2);X.fillRect(x+5,y+11,2,2);X.fillRect(x+12,y+3,2,2);
      X.fillStyle=tc.grass3;
      X.fillRect(x+7,y+1,1,1);X.fillRect(x+1,y+8,1,1);X.fillRect(x+13,y+13,1,1);
      break;
    case 1: // Path
      X.fillStyle=tc.path1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.path2;
      X.fillRect(x+2,y+3,2,2);X.fillRect(x+10,y+8,3,2);X.fillRect(x+6,y+13,2,2);
      X.fillStyle=tc.path3;
      X.fillRect(x+5,y+1,2,1);X.fillRect(x+1,y+10,1,2);
      break;
    case 2: // Tall grass
      X.fillStyle=tc.grass1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.tallGrass1;
      const sw=Math.sin(tick*0.1+tx*2+ty)*1;
      X.fillRect(x+1,y+2+sw,2,6);X.fillRect(x+6,y+1-sw,2,7);X.fillRect(x+11,y+3+sw,2,5);
      X.fillStyle=tc.tallGrass2;
      X.fillRect(x+3,y+4-sw,2,5);X.fillRect(x+9,y+2+sw,2,6);X.fillRect(x+13,y+5-sw,2,4);
      X.fillStyle=tc.tallGrass3;
      X.fillRect(x+2,y+1,1,3);X.fillRect(x+7,y,1,3);X.fillRect(x+12,y+2,1,3);
      break;
    case 3: // Tree
      X.fillStyle=tc.grass1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.trunk;X.fillRect(x+6,y+10,4,6);
      X.fillStyle=tc.tree1;X.fillRect(x+2,y+1,12,10);
      X.fillStyle=tc.tree2;X.fillRect(x+4,y+2,8,7);
      X.fillStyle=tc.tree3;X.fillRect(x+5,y+3,4,3);
      break;
    case 4: // Wall
      X.fillStyle=tc.wall1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.wall2;X.fillRect(x,y+7,T,1);
      X.fillStyle=tc.wall3;X.fillRect(x+7,y,1,7);
      // Window
      X.fillStyle='#88BBDD';X.fillRect(x+4,y+2,3,3);X.fillRect(x+9,y+2,3,3);
      X.fillStyle='#6699BB';X.fillRect(x+5,y+3,1,1);X.fillRect(x+10,y+3,1,1);
      break;
    case 5: // Roof
      X.fillStyle=tc.roof1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.roof2;X.fillRect(x,y+2,T,2);X.fillRect(x,y+6,T,2);
      X.fillStyle=tc.roof3;X.fillRect(x+2,y,2,2);X.fillRect(x+8,y+4,2,2);
      break;
    case 6: // Door
      X.fillStyle=tc.wall1;X.fillRect(x,y,T,T);
      X.fillStyle='#8B6914';X.fillRect(x+4,y+2,8,12);
      X.fillStyle='#6B4910';X.fillRect(x+5,y+3,6,10);

      break;
    case 7: // Water
      const wv=Math.sin(tick*0.08+tx+ty*0.5)*2;
      X.fillStyle=tc.water1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.water2;X.fillRect(x+2+wv,y+4,4,2);X.fillRect(x+9-wv,y+10,4,2);

    case 8: // PC floor
      X.fillStyle=tc.pcFloor1;X.fillRect(x,y,T,T);

    case 9: // Flower
      X.fillStyle=tc.grass1;X.fillRect(x,y,T,T);

      X.fillStyle=tc.flower3;X.fillRect(x+6,y+8,3,3);
      break;
    case 10: // Fence
      X.fillStyle=tc.grass1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.fence1;X.fillRect(x,y+4,T,4);X.fillRect(x+2,y+2,3,2);X.fillRect(x+11,y+2,3,2);
      X.fillStyle=tc.fence2;X.fillRect(x+1,y+5,2,2);X.fillRect(x+7,y+5,2,2);X.fillRect(x+13,y+5,2,2);

    case 11: // Sign
      X.fillStyle=tc.grass1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.fence1;X.fillRect(x+5,y+8,6,8);
      X.fillStyle='#DEB887';X.fillRect(x+3,y+2,10,7);
      X.fillStyle='#000';X.fillRect(x+5,y+4,2,1);X.fillRect(x+9,y+4,2,1);X.fillRect(x+6,y+6,4,1);
      break;
    case 12: // Mart roof
      X.fillStyle=tc.martRoof1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.martRoof2;X.fillRect(x,y+3,T,2);X.fillRect(x,y+7,T,2);
      X.fillStyle='#40C0E8';X.fillRect(x+2,y+1,4,2);X.fillRect(x+10,y+5,4,2);
      break;
    case 13: // Ledge
      X.fillStyle=tc.grass1;X.fillRect(x,y,T,T);
      X.fillStyle=tc.path2;X.fillRect(x,y+8,T,8);
      X.fillStyle=tc.path1;X.fillRect(x,y+8,T,2);
      X.fillStyle='#9A8060';X.fillRect(x,y+10,T,1);
      break;
  }
}

// ===== SCENE: OVERWORLD =====
function updateOverworld(){
  if(G.pcHealing){
    G.pcTimer++;
    if(G.pcTimer>60){G.pcHealing=false;G.pcTimer=0;}
    return;
  }
  if(G.flashTimer>0){G.flashTimer--;return;}
  if(G.transType){updateTransition();return;}
  if(G.dlgLines.length){updateDialog();return;}
  if(G.menuOpen){updateMenu();return;}

  // Player movement
  if(!G.pMoving){
    let dx=0,dy=0;
    if(kp('ArrowDown')||kp('KeyS')){dy=1;G.pDir=0;}
    else if(kp('ArrowUp')||kp('KeyW')){dy=-1;G.pDir=1;}
    else if(kp('ArrowLeft')||kp('KeyA')){dx=-1;G.pDir=2;}
    else if(kp('ArrowRight')||kp('KeyD')){dx=1;G.pDir=3;}

    if(dx||dy){
      const nx=G.px+dx,ny=G.py+dy;
      const npc=isNpc(G.mapId,nx,ny);
      if(!isBlocked(G.mapId,nx,ny)&&!npc){
        G.pPGx=G.px;G.pPGy=G.py;
        G.px=nx;G.py=ny;
        G.pMoving=true;G.pMT=0;
        sfxStep();
      }
    }

    // Talk to NPC
    if(jp('Enter')||jp('KeyZ')){
      const fx=G.px+[0,0,-1,1][G.pDir],fy=G.py+[1,-1,0,0][G.pDir];
      const npc=isNpc(G.mapId,fx,fy);
      if(npc){
        const lines=[];
        for(let i=4;i<npc.length;i++)lines.push(npc[i]);
        showDialog(lines);
        sfxSelect();
      }
      // Check for PokeCenter
      const pt=getTile(G.mapId,fx,fy);
      if(pt===6){
        // Check if near PC in Viridian
        if(G.mapId===2&&fx===4&&fy===8){
          G.pcHealing=true;G.pcTimer=0;
          G.party.forEach(m=>{m.hp=m.maxHp;m.moves.forEach(mv=>mv.pp=mv.maxPp);});
          sfxHeal();
          showDialog(["Welcome to the PokeCenter!","Your Pokemon have been healed.","Come again!"]);
        }else if(G.mapId===0){
          showDialog(["The door is locked...","Nobody seems to be home."]);
        }else{
          showDialog(["The building is closed.","Come back later!"]);
        }
        sfxSelect();
      }
    }

    // Open menu
    if(jp('Backspace')||jp('KeyX')){
      G.menuOpen=true;G.menuSel=0;sfxSelect();
    }
  }

  if(G.pMoving){
    G.pMT++;
    const t=G.pMT/G.pMS;
    G.pVx=G.pPGx+(G.px-G.pPGx)*t;
    G.pVy=G.pPGy+(G.py-G.pPGy)*t;
    G.pFrame=Math.floor(G.pMT/(G.pMS/2))%2;
    if(G.pMT>=G.pMS){
      G.pMoving=false;G.pVx=G.px;G.pVy=G.py;G.pFrame=0;
      onTileEnter(G.px,G.py);
    }
  }

  // Map edge transitions
  checkMapTransition();
}

function onTileEnter(x,y){
  const t=getTile(G.mapId,x,y);
  // Tall grass encounter
  if(t===2){
    const m=MAPS[G.mapId];
    if(m.wild.length>0){
      for(let w of m.wild){
        if(Math.random()<w.ch){
          const lvl=w.lvl[0]+Math.floor(Math.random()*(w.lvl[1]-w.lvl[0]+1));
          G.bEnemy=makeMon(w.id,lvl);
          G.bPlayer=G.party[0];
          startTransition('battle',()=>{
            G.scene='battle';initBattle();
          });
          sfxEncounter();
          return;
        }
      }
    }
  }
}

function checkMapTransition(){
  const m=MAPS[G.mapId];
  // Check edge transitions
  if(G.py<=0&&G.mapId===1){warpTo(0,9,13);}
  else if(G.py>=m.h-1&&G.mapId===0){warpTo(1,9,1);}
  else if(G.py>=m.h-1&&G.mapId===1){warpTo(2,9,1);}
  else if(G.py<=0&&G.mapId===2){warpTo(1,1,18);}
  // Route 1 side exits
  if(G.px<=0&&G.mapId===1){G.px=1;G.pVx=1;}
  if(G.px>=m.w-1&&G.mapId===1){G.px=m.w-2;G.pVx=m.w-2;}
}

function warpTo(mapId,x,y){
  G.mapId=mapId;G.px=x;G.py=y;G.pVx=x;G.pVy=y;G.pPGx=x;G.pPGy=y;G.pMoving=false;
}

function renderOverworld(){
  const m=MAPS[G.mapId];

  // Camera
  let camX=G.pVx*T-(GW-T)/2;
  let camY=G.pVy*T-(GH-T)/2;
  camX=Math.max(0,Math.min(camX,m.w*T-GW));
  camY=Math.max(0,Math.min(camY,m.h*T-GH));

  // Draw tiles
  const sx=Math.floor(camX/T),sy=Math.floor(camY/T);
  const ox=-(camX%T),oy=-(camY%T);
  for(let dy=-1;dy<=Math.ceil(GH/T)+1;dy++){
    for(let dx=-1;dx<=Math.ceil(GW/T)+1;dx++){
      const tx=sx+dx,ty=sy+dy;
      if(tx>=0&&ty>=0&&tx<m.w&&ty<m.h){
        drawTile(ox+dx*T,oy+dy*T,m.tiles[ty][tx],G.tick);
      }
    }
  }

  // Draw NPCs
  for(let n of NPCS){
    if(n[0]===G.mapId){
      const nx=n[1]*T-camX,ny=n[2]*T-camY;
      if(nx>-T&&nx<GW+T&&ny>-T&&ny<GH+T){
        drawNpc(nx,ny,NPCS.indexOf(n),n[3]);
      }
    }
  }

  // Draw player
  const plx=G.pVx*T-camX,ply=G.pVy*T-camY;
  drawPlayer(plx,ply,G.pDir,G.pFrame);

  // Draw tall grass overlay (on top of player for depth)
  for(let dy=-1;dy<=Math.ceil(GH/T)+1;dy++){
    for(let dx=-1;dx<=Math.ceil(GW/T)+1;dx++){
      const tx=sx+dx,ty=sy+dy;
      if(tx>=0&&ty>=0&&tx<m.w&&ty<m.h&&m.tiles[ty][tx]===2){
        const gx=ox+dx*T,gy=oy+dy*T;
        // Only draw grass top if player is in this tile
        if(Math.floor(G.pVx)===tx&&Math.floor(G.pVy)===ty){
          X.fillStyle='rgba(74,140,42,0.6)';
          const sw=Math.sin(G.tick*0.1+tx*2+ty)*1;
          X.fillRect(gx+1,gy+sw,6,3);X.fillRect(gx+9,gy-sw+2,5,3);
        }
      }
    }
  }

  // HUD
  X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(0,0,GW,14);
  X.fillStyle='#FFF';X.font='7px monospace';
  X.fillText(m.name,4,10);
  // Party HP
  if(G.party.length>0){
    const pm=G.party[0];
    X.fillStyle='#FFF';X.font='6px monospace';
    X.fillText(SPECIES[pm.sp].name+' Lv'+pm.level,90,10);
    // Mini HP bar
    X.fillStyle='#444';X.fillRect(155,4,60,5);
    X.fillStyle=pm.hp/pm.maxHp>0.5?'#4CAF50':pm.hp/pm.maxHp>0.2?'#FF9800':'#F44336';
    X.fillRect(155,4,Math.floor(60*pm.hp/pm.maxHp),5);
    X.fillStyle='#FFF';X.font='5px monospace';
    X.fillText(pm.hp+'/'+pm.maxHp,155,12);
  }

  // PC healing effect
  if(G.pcHealing){
    const p=G.pcTimer/60;
    if(p<0.5){
      X.fillStyle=`rgba(255,255,255,${0.3*Math.sin(p*Math.PI*4)})`;
      X.fillRect(0,0,GW,GH);
    }
  }

  // Menu overlay
  if(G.menuOpen)renderMenu();
  // Dialog
  renderDialog();
  // Transition
  renderTransition();
  // Flash
  if(G.flashTimer>0){
    X.fillStyle=`rgba(255,255,255,${G.flashTimer/10})`;
    X.fillRect(0,0,GW,GH);
  }
}

// ===== MENU =====
function updateMenu(){
  if(jp('ArrowUp'))G.menuSel=(G.menuSel+2)%3;
  if(jp('ArrowDown'))G.menuSel=(G.menuSel+1)%3;
  if(jp('Backspace')||jp('KeyX')){G.menuOpen=false;sfxSelect();}
  if(jp('Enter')||jp('KeyZ')){
    sfxSelect();
    if(G.menuSel===0){G.menuOpen=false;} // POKeMON
    else if(G.menuSel===1){G.menuOpen=false;} // BAG
    else if(G.menuSel===2){G.menuOpen=false;} // EXIT
  }
}
function renderMenu(){
  X.fillStyle='rgba(0,0,0,0.6)';X.fillRect(0,0,GW,GH);
  X.fillStyle='#F8F8F8';X.fillRect(GW-80,20,76,70);
  X.strokeStyle='#333';X.lineWidth=1;X.strokeRect(GW-80,20,76,70);
  const items=['POKeMON','BAG','EXIT'];
  X.font='8px monospace';
  items.forEach((it,i)=>{
    X.fillStyle=i===G.menuSel?'#E84040':'#333';
    X.fillText(it,GW-70,38+i*20);
    if(i===G.menuSel&&G.tick%30<20){X.fillRect(GW-76,34+i*20,4,4);}
  });
  // Show party Pokemon
  if(G.party.length>0){
    const pm=G.party[0];const sp=SPECIES[pm.sp];
    X.fillStyle='#333';X.font='6px monospace';
    X.fillText(sp.name+' Lv'+pm.level,8,30);
    X.fillText('HP: '+pm.hp+'/'+pm.maxHp,8,42);
    X.fillText('ATK: '+pm.atk+' DEF: '+pm.def,8,54);
    X.fillText('Type: '+TYPES[sp.type],8,66);
  }
}

// ===== BATTLE SYSTEM =====
function initBattle(){
  G.bMenu=0;G.bMoveSel=0;G.bMsg='';G.bMsgTimer=0;
  G.bAnim=0;G.bAnimTimer=0;
  G.bPlayerHpAnim=G.bPlayer.hp;G.bEnemyHpAnim=G.bEnemy.hp;
  G.bTurnState='menu';G.bTurnTimer=0;
  G.bExpGain=0;G.bExpAnim=0;G.bLevelUp=false;G.bLevelUpTimer=0;
  G.bFainted=false;G.bRan=false;G.bCatchAnim=0;
  G.bMsg='A wild '+SPECIES[G.bEnemy.sp].name+' appeared!';
  G.bMsgTimer=60;
}

function calcDamage(attacker,defender,move){
  if(move.pow===0)return 0;
  const level=attacker.level;
  const a=move.type==='normal'?attacker.atk:attacker.spA;
  const d=move.type==='normal'?defender.def:defender.spD;
  let dmg=Math.floor(((2*level/5+2)*move.pow*(a/d))/50+2);
  // STAB
  if(move.type===SPECIES[attacker.sp].type)dmg=Math.floor(dmg*1.5);
  // Type effectiveness
  const eff=(TYPE_EFF[move.type]&&TYPE_EFF[move.type][SPECIES[defender.sp].type])||1;
  dmg=Math.floor(dmg*eff);
  // Random
  dmg=Math.floor(dmg*(0.85+Math.random()*0.15));
  return Math.max(1,dmg);
}

function execMove(user,target,move,isPlayer){
  // Check accuracy
  if(Math.random()*100>move.acc){
    return (isPlayer?SPECIES[user.sp].name:'Wild '+SPECIES[target.sp].name)+"'s attack missed!";
  }
  const dmg=calcDamage(user,target,move);
  target.hp=Math.max(0,target.hp-dmg);
  // Type effectiveness message
  const eff=(TYPE_EFF[move.type]&&TYPE_EFF[move.type][SPECIES[target.sp].type])||1;
  let effMsg='';
  if(eff>=2)effMsg=" It's super effective!";
  else if(eff<=0.5)effMsg=" It's not very effective...";
  const userName=isPlayer?SPECIES[user.sp].name:'Wild '+SPECIES[user.sp].name;
  return userName+' used '+move.name+'!'+effMsg;
}

function updateBattle(){
  if(G.bMsgTimer>0){G.bMsgTimer--;if(jp('Enter')||jp('KeyZ'))G.bMsgTimer=0;return;}

  // Animate HP bars
  if(G.bPlayerHpAnim>G.bPlayer.hp){G.bPlayerHpAnim=Math.max(G.bPlayer.hp,G.bPlayerHpAnim-Math.max(1,Math.ceil(G.bPlayer.maxHp/30)));}
  if(G.bEnemyHpAnim>G.bEnemy.hp){G.bEnemyHpAnim=Math.max(G.bEnemy.hp,G.bEnemyHpAnim-Math.max(1,Math.ceil(G.bEnemy.maxHp/30)));}

  if(G.bAnim>0){
    G.bAnimTimer++;
    if(G.bAnimTimer>15){G.bAnim=0;G.bAnimTimer=0;}
    return;
  }

  // Check faint
  if(G.bEnemy.hp<=0&&!G.bFainted){
    G.bFainted=true;
    sfxFaint();
    const expGain=G.bEnemy.level*3;
    G.bExpGain=expGain;G.bExpAnim=0;
    G.bMsg='Wild '+SPECIES[G.bEnemy.sp].name+' fainted! +'+expGain+' EXP';
    G.bMsgTimer=90;
    // Give EXP
    G.bPlayer.exp+=expGain;
    if(G.bPlayer.exp>=G.bPlayer.expNext){
      G.bPlayer.level++;G.bPlayer.exp=0;
      G.bPlayer.expNext=G.bPlayer.level*G.bPlayer.level*4;
      recalcStats(G.bPlayer);
      G.bPlayer.hp=Math.min(G.bPlayer.hp+5,G.bPlayer.maxHp);
      G.bLevelUp=true;G.bLevelUpTimer=0;
      sfxLevelUp();
    }
    return;
  }
  if(G.bFainted&&G.bMsgTimer<=0){
    if(jp('Enter')||jp('KeyZ')){
      G.scene='overworld';G.flashTimer=5;
    }
    return;
  }
  if(G.bPlayer.hp<=0){
    G.bMsg=SPECIES[G.bPlayer.sp].name+' fainted...';
    G.bMsgTimer=90;
    sfxFaint();
    // After message, heal and return
    if(G.bMsgTimer<=0&&(jp('Enter')||jp('KeyZ'))){
      G.bPlayer.hp=G.bPlayer.maxHp;
      G.bPlayer.moves.forEach(mv=>mv.pp=mv.maxPp);
      G.scene='overworld';G.mapId=0;G.px=9;G.py=6;G.pVx=9;G.pVy=6;
    }
    return;
  }

  if(G.bRan){
    if(jp('Enter')||jp('KeyZ')){G.scene='overworld';G.flashTimer=5;}
    return;
  }

  // Menu
  if(G.bTurnState==='menu'){
    if(jp('ArrowUp'))G.bMenu=(G.bMenu+2)%4;
    if(jp('ArrowDown'))G.bMenu=(G.bMenu+1)%4;
    if(jp('ArrowLeft'))G.bMenu=G.bMenu<2?G.bMenu:G.bMenu-2;
    if(jp('ArrowRight'))G.bMenu=G.bMenu<2?G.bMenu+2:G.bMenu;
    if(jp('Enter')||jp('KeyZ')){
      sfxSelect();
      if(G.bMenu===0){G.bTurnState='moveSelect';G.bMoveSel=0;} // FIGHT
      else if(G.bMenu===1){/* BAG - nothing */} // BAG
      else if(G.bMenu===2){/* POKEMON - nothing */} // POKEMON
      else if(G.bMenu===3){ // RUN
        if(Math.random()<0.7){
          G.bMsg='Got away safely!';G.bMsgTimer=50;G.bRan=true;
        }else{
          G.bMsg="Can't escape!";
          G.bMsgTimer=40;
          // Enemy attacks
          setTimeout(()=>enemyAttack(),500);
        }
      }
    }
    if(jp('Backspace')||jp('KeyX')){/* nothing */}
  }
  else if(G.bTurnState==='moveSelect'){
    if(jp('ArrowUp'))G.bMoveSel=(G.bMoveSel+2)%4;
    if(jp('ArrowDown'))G.bMoveSel=(G.bMoveSel+1)%4;
    if(jp('Backspace')||jp('KeyX')){G.bTurnState='menu';sfxSelect();}
    if(jp('Enter')||jp('KeyZ')){
      const move=G.bPlayer.moves[G.bMoveSel];
      if(move.pp>0){
        move.pp--;
        sfxHit();
        // Determine turn order
        const playerFirst=G.bPlayer.spd>=G.bEnemy.spd;
        if(playerFirst){
          // Player attacks first
          const msg1=execMove(G.bPlayer,G.bEnemy,move,true);
          G.bMsg=msg1;G.bMsgTimer=50;G.bAnim=1;G.bAnimTimer=0;
          sfxDamage();
          // Then enemy attacks
          if(G.bEnemy.hp>0){
            setTimeout(()=>{
              const eMove=G.bEnemy.moves[Math.floor(Math.random()*G.bEnemy.moves.length)];
              const msg2=execMove(G.bEnemy,G.bPlayer,eMove,false);
              G.bMsg=msg2;G.bMsgTimer=50;G.bAnim=2;G.bAnimTimer=0;
              sfxDamage();
              setTimeout(()=>{G.bTurnState='menu';G.bMsg='';G.bMsgTimer=0;},800);
            },700);
          }else{
            setTimeout(()=>{G.bTurnState='menu';},500);
          }
        }else{
          // Enemy attacks first
          const eMove=G.bEnemy.moves[Math.floor(Math.random()*G.bEnemy.moves.length)];
          const msg1=execMove(G.bEnemy,G.bPlayer,eMove,false);
          G.bMsg=msg1;G.bMsgTimer=50;G.bAnim=2;G.bAnimTimer=0;
          sfxDamage();
          if(G.bPlayer.hp>0){
            setTimeout(()=>{
              const msg2=execMove(G.bPlayer,G.bEnemy,move,true);
              G.bMsg=msg2;G.bMsgTimer=50;G.bAnim=1;G.bAnimTimer=0;
              sfxDamage();
              setTimeout(()=>{G.bTurnState='menu';G.bMsg='';G.bMsgTimer=0;},800);
            },700);
          }else{
            setTimeout(()=>{G.bTurnState='menu';},500);
          }
        }
        G.bTurnState='animating';
      }else{
        G.bMsg='No PP left for this move!';G.bMsgTimer=30;
      }
    }
  }
}

function enemyAttack(){
  if(G.bEnemy.hp<=0||G.bPlayer.hp<=0)return;
  const eMove=G.bEnemy.moves[Math.floor(Math.random()*G.bEnemy.moves.length)];
  const msg=execMove(G.bEnemy,G.bPlayer,eMove,false);
  G.bMsg=msg;G.bMsgTimer=50;G.bAnim=2;G.bAnimTimer=0;
  sfxDamage();
  setTimeout(()=>{G.bTurnState='menu';G.bMsg='';G.bMsgTimer=0;},800);
}

function renderBattle(){
  // Background
  const grd=X.createLinearGradient(0,0,0,GH);
  grd.addColorStop(0,'#E8F0E8');grd.addColorStop(1,'#B8C8A8');
  X.fillStyle=grd;X.fillRect(0,0,GW,GH);

  // Platform lines
  X.fillStyle='#90A880';
  X.fillRect(0,90,GW,2);X.fillRect(0,92,GW,1);
  X.fillStyle='#A8C098';
  X.fillRect(0,50,130,2);X.fillRect(0,52,130,1);

  // Enemy Pokemon (top-right)
  if(G.bEnemy.hp>0||G.bFainted){
    const esp=SP[SPECIES[G.bEnemy.sp].sprF];
    const eShake=G.bAnim===1&&G.bAnimTimer%4<2?2:0;
    drawSp(X,150+eShake,18,esp.d,esp.p,3);
  }

  // Player Pokemon (bottom-left)
  const psp=SP[SPECIES[G.bPlayer.sp].sprB];
  const pShake=G.bAnim===2&&G.bAnimTimer%4<2?2:0;
  drawSp(X,20+pShake,68,psp.d,psp.p,3);

  // Enemy info box
  X.fillStyle='rgba(255,255,255,0.9)';X.fillRect(4,4,120,30);
  X.strokeStyle='#444';X.lineWidth=1;X.strokeRect(4,4,120,30);
  X.fillStyle='#222';X.font='7px monospace';
  X.fillText(SPECIES[G.bEnemy.sp].name,8,14);
  X.fillText('Lv'+G.bEnemy.level,90,14);
  // Enemy HP bar
  X.fillStyle='#444';X.fillRect(8,18,100,5);
  const eHpPct=G.bEnemyHpAnim/G.bEnemy.maxHp;
  X.fillStyle=eHpPct>0.5?'#4CAF50':eHpPct>0.2?'#FF9800':'#F44336';
  X.fillRect(8,18,Math.floor(100*eHpPct),5);
  // Type badge
  X.fillStyle=TYPE_CLR[SPECIES[G.bEnemy.sp].type];X.font='5px monospace';
  X.fillText(TYPES[SPECIES[G.bEnemy.sp].type],8,30);

  // Player info box
  X.fillStyle='rgba(255,255,255,0.9)';X.fillRect(116,56,120,36);
  X.strokeStyle='#444';X.strokeRect(116,56,120,36);
  X.fillStyle='#222';X.font='7px monospace';
  X.fillText(SPECIES[G.bPlayer.sp].name,120,66);
  X.fillText('Lv'+G.bPlayer.level,204,66);
  // Player HP bar
  X.fillStyle='#444';X.fillRect(120,70,100,5);
  const pHpPct=G.bPlayerHpAnim/G.bPlayer.maxHp;
  X.fillStyle=pHpPct>0.5?'#4CAF50':pHpPct>0.2?'#FF9800':'#F44336';
  X.fillRect(120,70,Math.floor(100*pHpPct),5);
  X.fillStyle='#222';X.font='6px monospace';
  X.fillText(G.bPlayerHpAnim+'/'+G.bPlayer.maxHp,120,86);
  // Type badge
  X.fillStyle=TYPE_CLR[SPECIES[G.bPlayer.sp].type];X.font='5px monospace';
  X.fillText(TYPES[SPECIES[G.bPlayer.sp].type],170,86);

  // Bottom panel
  X.fillStyle='#F8F0E0';X.fillRect(0,110,GW,50);
  X.strokeStyle='#444';X.lineWidth=1;X.strokeRect(0,110,GW,50);

  if(G.bTurnState==='menu'){
    // Battle menu
    const menuItems=['FIGHT','BAG','POKeMON','RUN'];
    X.font='8px monospace';
    for(let i=0;i<4;i++){
      const mx=8+(i%2)*70,my=124+Math.floor(i/2)*16;
      X.fillStyle=i===G.bMenu?'#E84040':'#333';
      X.fillText(menuItems[i],mx,my);
      if(i===G.bMenu&&G.tick%20<14){X.fillRect(mx-5,my-5,3,3);}
    }
  }
  else if(G.bTurnState==='moveSelect'){
    // Move selection
    X.font='7px monospace';
    for(let i=0;i<4;i++){
      const mv=G.bPlayer.moves[i];
      const mx=8+(i%2)*112,my=124+Math.floor(i/2)*14;
      X.fillStyle=i===G.bMoveSel?'#E84040':'#333';
      X.fillText(mv.name,mx,my);
      // PP display
      X.fillStyle='#888';X.font='5px monospace';
      X.fillText('PP:'+mv.pp+'/'+mv.maxPp,mx+60,my);
      X.font='7px monospace';
      if(i===G.bMoveSel&&G.tick%20<14){X.fillRect(mx-5,my-5,3,3);}
    }
    // Type colors for selected move
    const selMove=G.bPlayer.moves[G.bMoveSel];
    X.fillStyle=TYPE_CLR[selMove.type]||'#888';X.font='6px monospace';
    X.fillText(TYPES[selMove.type]||selMove.type,180,150);
  }

  // Message
  if(G.bMsg&&G.bMsgTimer>0){
    X.fillStyle='rgba(248,240,224,0.95)';X.fillRect(0,110,GW,50);
    X.strokeStyle='#444';X.strokeRect(0,110,GW,50);
    X.fillStyle='#222';X.font='7px monospace';
    // Word wrap message
    const words=G.bMsg.split(' ');let line1='',line2='';
    for(let w of words){
      if(X.measureText(line1+w).width<GW-16)line1+=w+' ';
      else line2+=w+' ';
    }
    X.fillText(line1.trim(),8,128);
    if(line2)X.fillText(line2.trim(),8,140);
    // Continue indicator
    if(G.bMsgTimer<30&&G.tick%20<14){X.fillStyle='#333';X.fillRect(GW-12,148,6,4);}
  }

  // Level up notification
  if(G.bLevelUp){
    G.bLevelUpTimer++;
    if(G.bLevelUpTimer<120){
      X.fillStyle='rgba(255,255,100,0.3)';X.fillRect(0,0,GW,GH);
      X.fillStyle='#FFD700';X.font='bold 10px monospace';
      X.fillText('LEVEL UP!',GW/2-30,50);
      X.font='8px monospace';
      X.fillText(SPECIES[G.bPlayer.sp].name+' grew to Lv'+G.bPlayer.level+'!',GW/2-60,65);
    }
  }

  // Attack animation
  if(G.bAnim>0){
    const p=G.bAnimTimer/15;
    if(G.bAnim===1){
      // Player attacking - flash on enemy
      if(p<0.3){X.fillStyle=`rgba(255,255,255,${0.6-p*2})`;X.fillRect(150,18,48,48);}
    }else{
      // Enemy attacking - flash on player
      if(p<0.3){X.fillStyle=`rgba(255,255,255,${0.6-p*2})`;X.fillRect(20,68,48,48);}
    }
  }
}

// ===== MAIN GAME LOOP =====
function gameLoop(){
  G.tick++;

  switch(G.scene){
    case 'title':updateTitle();break;
    case 'intro':updateDialog();break;
    case 'starter':updateStarter();break;
    case 'overworld':updateOverworld();break;
    case 'battle':updateBattle();break;
  }

  // Render
  X.clearRect(0,0,GW,GH);

  switch(G.scene){
    case 'title':renderTitle();break;
    case 'intro':
      // Show intro background
      X.fillStyle='#1A1A2E';X.fillRect(0,0,GW,GH);
      X.fillStyle='#FFCC88';X.font='8px monospace';
      X.fillText('PROF. OAK',GW/2-28,30);
      // Draw a simple Oak sprite
      drawNpc(GW/2-8,50,1,0);
      renderDialog();
      break;
    case 'starter':renderStarter();break;
    case 'overworld':renderOverworld();break;
    case 'battle':renderBattle();break;
  }

  clrIn();
  requestAnimationFrame(gameLoop);
}

gameLoop();
