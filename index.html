<style>
*{margin:0;padding:0;box-sizing:border-box}

let ac;
function initAudio(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function bip(f,d,t='square',v=.05){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function sfxStep(){bip(180,.04,'square',.02)}function sfxSel(){bip(600,.06);setTimeout(()=>bip(900,.06),50)}
function sfxHit(){bip(120,.12,'sawtooth',.07)}function sfxDmg(){bip(90,.15,'sawtooth',.05);setTimeout(()=>bip(70,.1,'sawtooth',.03),70)}
function sfxHeal(){bip(523,.08,'sine',.05);setTimeout(()=>bip(659,.08,'sine',.05),80);setTimeout(()=>bip(784,.12,'sine',.05),160)}
function sfxFaint(){bip(350,.08);setTimeout(()=>bip(250,.08),70);setTimeout(()=>bip(150,.12),140);setTimeout(()=>bip(80,.15),210)}
function sfxEnc(){bip(180,.04);setTimeout(()=>bip(360,.04),40);setTimeout(()=>bip(720,.08),80)}
function sfxLvl(){[523,587,659,698,784,880].forEach((f,i)=>setTimeout(()=>bip(f,.1,'sine',.04),i*60))}
function sfxBall(){bip(800,.06,'sine',.04);setTimeout(()=>bip(600,.08,'sine',.04),60);setTimeout(()=>bip(400,.1,'sine',.04),120)}

function pxCircTop(cx,cy,r,c){X.fillStyle=c;for(let dy=-r;dy<=0;dy++){const w=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy)));X.fillRect(cx-w,cy+dy,w*2+1,1)}}

function mkMon(sid,lv){const s=SP[sid],m={sp:sid,lv,exp:0,mv:[],hp:0,maxHp:0,atk:0,def:0,spd:0,spA:0,spD:0};function cs(b){return Math.floor((2*b*lv)/100)+5}m.maxHp=Math.floor((2*s.bs.hp*lv)/100)+lv+10;m.hp=m.maxHp;m.atk=cs(s.bs.a);m.def=cs(s.bs.d);m.spd=cs(s.bs.s);m.spA=cs(s.bs.sa);m.spD=cs(s.bs.sd);s.mv.forEach(v=>m.mv.push({n:v.n,t:v.t,p:v.p,a:v.a,pp:v.pp,mpp:v.pp}));m.expN=lv*lv*4;return m}
function recalc(m){const s=SP[m.sp];function cs(b){return Math.floor((2*b*m.lv)/100)+5}const om=m.maxHp;m.maxHp=Math.floor((2*s.bs.hp*m.lv)/100)+m.lv+10;m.atk=cs(s.bs.a);m.def=cs(s.bs.d);m.spd=cs(s.bs.s);m.spA=cs(s.bs.sa);m.spD=cs(s.bs.sd);m.hp=Math.min(m.hp+(m.maxHp-om),m.maxHp)}

function resetPos(){G.pvx=G.px;G.pvy=G.py;G.ppx=G.px;G.ppy=G.py;G.pmv=false}

function gT(mid,x,y){const m=MAPS[mid];if(x<0||y<0||x>=m.w||y>=m.h)return 3;return m.t[y][x]}
function blk(mid,x,y){const t=gT(mid,x,y);return t===3||t===4||t===5||t===7||t===9||t===10||t===11||t===12||t===13||t===14||t===15||t===18}
function npcAt(mid,x,y){return NPCS.find(n=>n.m===mid&&n.x===x&&n.y===y)||null}

// =============== DIALOG ===============
function showDlg(lines,cb){G.dlg=lines;G.di=0;G.dc=0;G.dt=0;G.dd=false;G.dcb=cb||null}
function updDlg(){if(!G.dlg.length)return;const ln=G.dlg[G.di];if(!ln)return;if(!G.dd){G.dt++;if(G.dt%2===0&&G.dc<ln.length)G.dc++;if(G.dc>=ln.length)G.dd=true;if(jp('Enter')||jp('KeyZ')){if(G.dd)advDlg();else{G.dc=ln.length;G.dd=true}}}else{if(jp('Enter')||jp('KeyZ'))advDlg()}}
function advDlg(){G.di++;if(G.di>=G.dlg.length){G.dlg=[];G.di=0;if(G.dcb){const cb=G.dcb;G.dcb=null;cb()}}else{G.dc=0;G.dd=false;G.dt=0}}
function renDlg(){if(!G.dlg.length)return;const ln=G.dlg[G.di]||'';const txt=ln.substring(0,G.dc);X.fillStyle='rgba(248,248,248,0.94)';X.fillRect(4,GH-36,GW-8,32);X.strokeStyle='#555';X.lineWidth=1;X.strokeRect(4,GH-36,GW-8,32);X.fillStyle='#222';X.font='7px monospace';const mw=GW-20;let disp='',cur='';for(const ch of txt){cur+=ch;if(X.measureText(cur).width>mw){disp+='\n';cur=ch}disp+=ch}disp.split('\n').forEach((l,i)=>X.fillText(l,10,GH-24+i*10));if(G.dd&&G.tk%24<12){X.fillStyle='#555';X.fillRect(GW-14,GH-14,5,3)}}

function startTr(t,cb){G.trt=t;G.trm=0;G.trcb=cb;G.trDone=false}
function updTr(){if(!G.trt)return;G.trm++;const dur=G.trt==='battle'?24:G.trt==='door'?18:16;if(G.trm>=dur&&!G.trDone){G.trDone=true;if(G.trcb)G.trcb()}if(G.trm>=dur*2){G.trt='';G.trm=0}}
function renTr(){if(!G.trt)return;const dur=G.trt==='battle'?24:G.trt==='door'?18:16;const p=Math.min(1,G.trm/dur);if(G.trt==='battle'){X.fillStyle='#000';for(let i=0;i<8;i++){const s=Math.max(0,Math.min(1,p*1.8-i*.07));const w=GW/2*s;X.fillRect(0,i*(GH/8),w,GH/8);X.fillRect(GW-w,i*(GH/8),w,GH/8)}}else if(G.trt==='door'){X.fillStyle='#000';if(p<1){X.globalAlpha=p;X.fillRect(0,0,GW,GH);X.globalAlpha=1}else{X.globalAlpha=1;X.fillRect(0,0,GW,GH)}}else{X.fillStyle='#000';X.globalAlpha=p;X.fillRect(0,0,GW,GH);X.globalAlpha=1}}

function drawChibi(cx,cy,dir,fr,hatC,hairC,shirtC,pantsC,skinC){

  pxCircTop(cx+8,cy+4,6,hatC);

  X.fillStyle='rgba(255,255,255,0.2)';X.fillRect(cx+5,cy+2,5,2);
  X.fillStyle=hairC;X.fillRect(cx+2,cy+6,2,2);X.fillRect(cx+12,cy+6,2,2);
  if(dir===1){X.fillRect(cx+4,cy+5,8,2)}
  if(dir===0){X.fillStyle='#FFF';X.fillRect(cx+5,cy+6,2,2);X.fillRect(cx+9,cy+6,2,2);X.fillStyle='#222';X.fillRect(cx+6,cy+7,1,1);X.fillRect(cx+10,cy+7,1,1);X.fillStyle='#E88888';X.fillRect(cx+7,cy+9,2,1)}
  else if(dir===1){}
  else if(dir===2){X.fillStyle='#FFF';X.fillRect(cx+4,cy+6,2,2);X.fillStyle='#222';X.fillRect(cx+4,cy+7,1,1);X.fillStyle='#E88888';X.fillRect(cx+5,cy+9,1,1)}
  else{X.fillStyle='#FFF';X.fillRect(cx+10,cy+6,2,2);X.fillStyle='#222';X.fillRect(cx+11,cy+7,1,1);X.fillStyle='#E88888';X.fillRect(cx+10,cy+9,1,1)}
  X.fillStyle=shirtC;X.fillRect(cx+5,cy+11,6,3);X.fillRect(cx+4,cy+12,8,1);
  X.fillStyle=skinC;
  if(dir===2){X.fillRect(cx+3,cy+12,2,1)}else if(dir===3){X.fillRect(cx+11,cy+12,2,1)}else{X.fillRect(cx+3,cy+12,2,1);X.fillRect(cx+11,cy+12,2,1)}
  X.fillStyle=pantsC;const lo=fr?1:0;X.fillRect(cx+5+lo,cy+14,2,2);X.fillRect(cx+9-lo,cy+14,2,2);
}

// =============== BATTLE ===============
function calcDmg(atk,def,mv){if(mv.p===0)return 0;const lv=atk.lv;const a=mv.t==='normal'?atk.atk:atk.spA;const d=mv.t==='normal'?atk.def:def.spD;let dm=Math.floor(((2*lv/5+2)*mv.p*(a/d))/50+2);if(mv.t===SP[atk.sp].tp)dm=Math.floor(dm*1.5);const eff=(TE[mv.t]&&TE[mv.t][SP[def.sp].tp])||1;dm=Math.floor(dm*eff);dm=Math.floor(dm*(.85+Math.random()*.15));return Math.max(1,dm)}
function execMv(user,target,mv,isP){if(Math.random()*100>mv.a)return{msg:(isP?SP[user.sp].nm:'Wild '+SP[user.sp].nm)+"'s attack missed!",dmg:0,eff:1};const dmg=calcDmg(user,target,mv);const eff=(TE[mv.t]&&TE[mv.t][SP[target.sp].tp])||1;let em='';if(eff>=2)em=' Super effective!';else if(eff<=.5)em=' Not very effective...';return{msg:(isP?SP[user.sp].nm:'Wild '+SP[user.sp].nm)+' used '+mv.n+'!'+em,dmg,eff}}
function initBattle(){G.bst='menu';G.bmen=0;G.bms=0;G.bq=[];G.bqi=0;G.bat=0;G.bpha=G.bp.hp;G.beha=G.be.hp;G.blvup=false;G.blvt=0;G.bcatch=false;G.bcaught=false;G.bmsg='Wild '+SP[G.be.sp].nm+' appeared!';G.bmt=0}
function buildTurn(pMv){const pFirst=G.bp.spd>=G.be.spd;const eMv=G.be.mv[Math.floor(Math.random()*G.be.mv.length)];const first={atk:pFirst?G.bp:G.be,target:pFirst?G.be:G.bp,mv:pFirst?pMv:eMv,isP:pFirst};const second={atk:pFirst?G.be:G.bp,target:pFirst?G.bp:G.be,mv:pFirst?eMv:pMv,isP:!pFirst};G.bq=[];const r1=execMv(first.atk,first.target,first.mv,first.isP);G.bq.push({type:'msg',text:r1.msg,time:45});G.bq.push({type:'anim',who:first.isP?'p':'e',time:16});if(r1.dmg>0)G.bq.push({type:'dmg',target:first.isP?'e':'p',amt:r1.dmg});G.bq.push({type:'wait',time:6});G.bq.push({type:'fc'});const r2=execMv(second.atk,second.target,second.mv,second.isP);G.bq.push({type:'msg',text:r2.msg,time:45});G.bq.push({type:'anim',who:second.isP?'p':'e',time:16});if(r2.dmg>0)G.bq.push({type:'dmg',target:second.isP?'e':'p',amt:r2.dmg});G.bq.push({type:'wait',time:6});G.bq.push({type:'fc'});G.bq.push({type:'tm'});G.bqi=0;G.bat=0;G.bst='queue'}
function enemyAttacks(){const eMv=G.be.mv[Math.floor(Math.random()*G.be.mv.length)];const r=execMv(G.be,G.bp,eMv,false);G.bq=[{type:'msg',text:r.msg,time:45},{type:'anim',who:'e',time:16}];if(r.dmg>0)G.bq.push({type:'dmg',target:'p',amt:r.dmg});G.bq.push({type:'wait',time:6});G.bq.push({type:'fc'});G.bq.push({type:'tm'});G.bqi=0;G.bat=0;G.bst='queue'}

function updBattle(){
  if(G.bpha>G.bp.hp)G.bpha=Math.max(G.bp.hp,G.bpha-Math.max(1,Math.ceil(G.bp.maxHp/25)));
  if(G.beha>G.be.hp)G.beha=Math.max(G.be.hp,G.beha-Math.max(1,Math.ceil(G.be.maxHp/25)));
  if(G.blvup){G.blvt++;if(G.blvt>100)G.blvup=false}
  if(G.bcatch){G.bcatchT++;if(G.bcatchT>60){G.bcatch=false;if(G.bcaught){G.bst='caughtMsg';G.bmsg=SP[G.be.sp].nm+' was caught!';G.bmt=0;if(G.party.length<6)G.party.push({...G.be,mv:G.be.mv.map(m=>({...m}))})}else{G.bmsg='Oh no! It broke free!';G.bmt=40;G.bst='queue';G.bq=[{type:'tm'}];G.bqi=0;G.bat=0}}return}
  if(G.bmt>0){G.bmt--;if(jp('Enter')||jp('KeyZ'))G.bmt=0;return}
  if(G.bst==='menu'){if(jp('ArrowUp'))G.bmen=(G.bmen+2)%4;if(jp('ArrowDown'))G.bmen=(G.bmen+1)%4;if(jp('ArrowLeft')&&G.bmen>=2)G.bmen-=2;if(jp('ArrowRight')&&G.bmen<2)G.bmen+=2;if(jp('Enter')||jp('KeyZ')){sfxSel();if(G.bmen===0){G.bst='moveSel';G.bms=0}else if(G.bmen===1){G.bst='bagSel';G.bms=0}else if(G.bmen===2){G.bst='monSel';G.bms=0}else if(G.bmen===3){if(Math.random()<.7){G.bmsg='Got away safely!';G.bmt=45;G.bst='run'}else{G.bmsg="Can't escape!";G.bmt=30;setTimeout(()=>enemyAttacks(),400)}}}}
  else if(G.bst==='moveSel'){if(jp('ArrowUp'))G.bms=(G.bms+2)%4;if(jp('ArrowDown'))G.bms=(G.bms+1)%4;if(jp('Backspace')||jp('KeyX')){G.bst='menu';sfxSel()}if(jp('Enter')||jp('KeyZ')){const mv=G.bp.mv[G.bms];if(mv.pp>0){mv.pp--;sfxHit();buildTurn(mv)}else{G.bmsg='No PP left!';G.bmt=25}}}
  else if(G.bst==='bagSel'){const items=[];if(G.bag.potion>0)items.push('potion');if(G.bag.ball>0)items.push('ball');items.push('back');if(jp('ArrowUp'))G.bms=Math.max(0,G.bms-1);if(jp('ArrowDown'))G.bms=Math.min(items.length-1,G.bms+1);if(jp('Backspace')||jp('KeyX')){G.bst='menu';sfxSel()}if(jp('Enter')||jp('KeyZ')){sfxSel();const it=items[G.bms];if(it==='back'){G.bst='menu'}else if(it==='potion'){G.bag.potion--;const heal=Math.min(20,G.bp.maxHp-G.bp.hp);G.bp.hp+=heal;G.bmsg=SP[G.bp.sp].nm+' recovered '+heal+' HP!';G.bmt=40;sfxHeal();setTimeout(()=>enemyAttacks(),500)}else if(it==='ball'){G.bag.ball--;sfxBall();G.bcatch=true;G.bcatchT=0;const rate=(1-G.be.hp/G.be.maxHp)*.65+.1;G.bcaught=Math.random()<rate}}}
  else if(G.bst==='monSel'){if(jp('ArrowUp'))G.bms=Math.max(0,G.bms-1);if(jp('ArrowDown'))G.bms=Math.min(G.party.length-1,G.bms+1);if(jp('Backspace')||jp('KeyX')){G.bst='menu';sfxSel()}if(jp('Enter')||jp('KeyZ')){sfxSel();if(G.bms===0){G.bmsg=SP[G.bp.sp].nm+' is already out!';G.bmt=30}else{const m=G.party[G.bms];if(m.hp<=0){G.bmsg='No energy left!';G.bmt=30}else{G.party[0]=G.party[G.bms];G.party[G.bms]=G.bp;G.bp=G.party[0];G.bpha=G.bp.hp;G.bmsg='Go! '+SP[G.bp.sp].nm+'!';G.bmt=40;setTimeout(()=>enemyAttacks(),500)}}}}
  else if(G.bst==='queue'){if(G.bqi>=G.bq.length){G.bst='menu';return}const act=G.bq[G.bqi];switch(act.type){case'msg':G.bmsg=act.text;G.bat++;if(G.bat>=act.time||(jp('Enter')&&G.bat>8)){G.bqi++;G.bat=0}break;case'anim':G.bat++;if(G.bat>=act.time){G.bqi++;G.bat=0}break;case'dmg':if(!act.done){if(act.target==='e'){G.be.hp=Math.max(0,G.be.hp-act.amt);sfxDmg()}else{G.bp.hp=Math.max(0,G.bp.hp-act.amt);sfxDmg()}act.done=true}const tg=act.target==='e'?G.be:G.bp;const an=act.target==='e'?G.beha:G.bpha;if(an<=tg.hp){G.bqi++;G.bat=0}break;case'wait':G.bat++;if(G.bat>=act.time){G.bqi++;G.bat=0}break;case'fc':if(G.be.hp<=0){sfxFaint();const xp=G.be.lv*3;G.bmsg='Wild '+SP[G.be.sp].nm+' fainted! +'+xp+' EXP';G.bmt=60;G.bp.exp+=xp;if(G.bp.exp>=G.bp.expN){G.bp.lv++;G.bp.exp=0;G.bp.expN=G.bp.lv*G.bp.lv*4;recalc(G.bp);G.blvup=true;G.blvt=0;sfxLvl()}G.bst='victory'}else if(G.bp.hp<=0){sfxFaint();G.bmsg=SP[G.bp.sp].nm+' fainted...';G.bmt=60;G.bst='defeat'}else{G.bqi++;G.bat=0}break;case'tm':G.bst='menu';G.bmsg='';G.bq=[];G.bqi=0;break}}
  else if(G.bst==='victory'){if(G.bmt<=0&&(jp('Enter')||jp('KeyZ'))){G.sc='overworld';G.fl=6}}

function updOverworld(){
  if(G.pch){G.pct++;if(G.pct>50){G.pch=false;G.pct=0}return}
  if(G.fl>0){G.fl--;return}
  if(G.trt){updTr();return}
  if(G.dlg.length){updDlg();return}
  if(G.muo){updMenu();return}
  if(G.shop){updShop();return}
  if(!G.pmv){
    let dx=0,dy=0;
    if(kp('ArrowDown')||kp('KeyS')){dy=1;G.pdir=0}else if(kp('ArrowUp')||kp('KeyW')){dy=-1;G.pdir=1}else if(kp('ArrowLeft')||kp('KeyA')){dx=-1;G.pdir=2}else if(kp('ArrowRight')||kp('KeyD')){dx=1;G.pdir=3}
    if(dx||dy){const nx=G.px+dx,ny=G.py+dy;const npc=npcAt(G.mid,nx,ny);if(!blk(G.mid,nx,ny)&&!npc){G.ppx=G.px;G.ppy=G.py;G.px=nx;G.py=ny;G.pmv=true;G.pmt=0;sfxStep()}}
    if(jp('Enter')||jp('KeyZ')){
      const fx=G.px+[0,0,-1,1][G.pdir],fy=G.py+[1,-1,0,0][G.pdir];
      const npc=npcAt(G.mid,fx,fy);
      if(npc){
        if(npc.act==='heal'){G.party.forEach(m=>{m.hp=m.maxHp;m.mv.forEach(v=>v.pp=v.mpp)});sfxHeal();G.pch=true;G.pct=0;showDlg(npc.txt)}
        else if(npc.act==='shop'){G.shop=true;G.shopSel=0;G.shopMsg='';sfxSel()}
        else{showDlg(npc.txt);sfxSel()}
      }
    }
    if(jp('Backspace')||jp('KeyX')){G.muo=true;G.mus=0;G.msub='';G.msubSel=0;sfxSel()}
  }
  if(G.pmv){G.pmt++;const t=G.pmt/G.pms;G.pvx=G.ppx+(G.px-G.ppx)*t;G.pvy=G.ppy+(G.py-G.ppy)*t;G.pfr=Math.floor(G.pmt/(G.pms/2))%2;if(G.pmt>=G.pms){G.pmv=false;G.pvx=G.px;G.pvy=G.py;G.pfr=0;onTileEnter()}}
  checkEdge();
}
function onTileEnter(){
  const t=gT(G.mid,G.px,G.py);
  // Door warp
  if(t===6){const w=WARPS.find(w=>w.fm===G.mid&&w.fx===G.px&&w.fy===G.py);if(w){startTr('door',()=>{G.mid=w.tm;G.px=w.tx;G.py=w.ty;G.pdir=w.td!==undefined?w.td:G.pdir;resetPos()});return}}
  // Tall grass
  if(t===2){const m=MAPS[G.mid];for(const w of m.wild){if(Math.random()<w.ch){const lv=w.lv[0]+Math.floor(Math.random()*(w.lv[1]-w.lv[0]+1));G.be=mkMon(w.id,lv);G.bp=G.party[0];startTr('battle',()=>{G.sc='battle';initBattle()});sfxEnc();return}}}
}
function checkEdge(){
  const m=MAPS[G.mid];
  if(G.mid===0&&G.py>=m.h-1&&G.px>=9&&G.px<=10){G.mid=1;G.px=9;G.py=1;resetPos();return}
  if(G.mid===1&&G.py<=0&&G.px>=9&&G.px<=10){G.mid=0;G.px=9;G.py=14;resetPos();return}
  if(G.mid===1&&G.py>=m.h-1&&G.px>=9&&G.px<=10){G.mid=2;G.px=9;G.py=1;resetPos();return}
  if(G.mid===2&&G.py<=0&&G.px>=9&&G.px<=10){G.mid=1;G.px=9;G.py=16;resetPos();return}
  if(G.mid<=2){
    if(G.px<=1){G.px=1;G.pvx=1}if(G.px>=m.w-2){G.px=m.w-2;G.pvx=m.w-2}
    if(G.mid===0&&G.py<=0){G.py=1;G.pvy=1}if(G.mid===0&&G.py>=m.h-1&&!(G.px>=9&&G.px<=10)){G.py=m.h-2;G.pvy=m.h-2}
    if(G.mid===2&&G.py>=m.h-1){G.py=m.h-2;G.pvy=m.h-2}
  }
}

  else{X.fillStyle='#F8F8F0';X.fillRect(GW-84,12,80,80);X.strokeStyle='#555';X.strokeRect(GW-84,12,80,80);const it=['POKeMON','BAG','SAVE','EXIT'];X.font='8px monospace';it.forEach((t,i)=>{X.fillStyle=i===G.mus?'#D83030':'#333';X.fillText(t,GW-74,32+i*18);if(i===G.mus&&G.tk%20<12){X.fillRect(GW-78,28+i*18,3,3)}});if(G.party.length>0){const pm=G.party[0],sp=SP[pm.sp];X.fillStyle='#333';X.font='6px monospace';X.fillText(sp.nm+' Lv'+pm.lv,6,24);X.fillText('HP: '+pm.hp+'/'+pm.maxHp,6,34);X.fillText('Money: $'+G.money,6,44);X.fillText('Potions:'+G.bag.potion+' Balls:'+G.bag.ball,6,54)}}
  renDlg();
}

// =============== SCENES ===============
function updTitle(){G.tt++;if(jp('Enter')||jp('KeyZ')){initAudio();sfxSel();G.sc='intro';showDlg(["Hello there! Welcome to the","world of MONFIRE!","My name is PROF. OAK.","People call me the Pokemon Prof.","This world is inhabited by","creatures called Pokemon!","Your very own Pokemon legend","is about to unfold!","Walk into any door to enter","a building. Choose your partner!"],()=>{G.sc='starter';G.ss=0})}}
function renTitle(){
  const grd=X.createLinearGradient(0,0,0,GH);grd.addColorStop(0,'#1A0800');grd.addColorStop(0.5,'#4A1A08');grd.addColorStop(1,'#2A0A04');X.fillStyle=grd;X.fillRect(0,0,GW,GH);
  for(let i=0;i<25;i++){const t=G.tt*.018+i*1.7;const px=GW/2+Math.sin(t*1.3+i)*70;const py=75-Math.abs(Math.sin(t*.7+i*.5))*65;const s=2+Math.sin(t+i)*1.5;const a=.3+Math.sin(t*2+i)*.2;X.fillStyle=`rgba(255,${Math.floor(80+Math.sin(t+i)*70)},0,${Math.max(0,a)})`;X.fillRect(Math.floor(px),Math.floor(py),Math.ceil(s),Math.ceil(s))}
  X.fillStyle='#000';X.font='bold 20px monospace';X.fillText('MONFIRE',GW/2-50+1,47);X.font='bold 14px monospace';X.fillText('RED',GW/2-18+1,67);
  X.fillStyle='#FF4400';X.font='bold 20px monospace';X.fillText('MONFIRE',GW/2-50,46);X.fillStyle='#FFCC00';X.font='bold 14px monospace';X.fillText('RED',GW/2-18,66);
  X.fillStyle='#FF8844';X.font='7px monospace';X.fillText('A Pokemon Adventure',GW/2-52,84);
  for(let i=0;i<3;i++)drawMon(40+i*56,92,i,1.5,false);
  if(G.tt%60<40){X.fillStyle='#FFDDAA';X.font='8px monospace';X.fillText('PRESS ENTER',GW/2-36,140)}
  X.fillStyle='#553300';X.font='5px monospace';X.fillText('Single-File Edition',4,GH-4);
  try{if(localStorage.getItem('monfire')){X.fillStyle='#AA8855';X.fillText('SAVE FOUND - Press S to load',4,GH-12)}}catch(e){}
  if(jp('KeyS')){try{const d=JSON.parse(localStorage.getItem('monfire'));if(d){G.px=d.px;G.py=d.py;G.pdir=d.pdir||0;G.mid=d.mid;G.party=d.party;G.bag=d.bag||{potion:5,ball:5};G.money=d.money||3000;resetPos();G.sc='overworld';sfxSel()}}catch(e){}}
}
function updStarter(){if(jp('ArrowLeft')||jp('ArrowUp')){G.ss=(G.ss+2)%3;sfxSel()}if(jp('ArrowRight')||jp('ArrowDown')){G.ss=(G.ss+1)%3;sfxSel()}if(jp('Enter')||jp('KeyZ')){sfxSel();G.party=[mkMon(G.ss,5)];G.bag={potion:5,ball:5};G.money=3000;G.sc='overworld';G.px=10;G.py=7;G.pdir=0;G.mid=0;resetPos()}}
function renStarter(){X.fillStyle='#1A1A2E';X.fillRect(0,0,GW,GH);X.fillStyle='#FFDDAA';X.font='9px monospace';X.fillText('Choose your partner!',GW/2-54,16);const nms=['Emburn','Aquapup','Leafkit'],tps=['fire','water','grass'];for(let i=0;i<3;i++){const cx=12+i*74;const sel=G.ss===i;X.fillStyle=sel?'#2A2A4E':'#161628';X.fillRect(cx-4,24,72,100);if(sel){X.strokeStyle='#FFCC00';X.lineWidth=2;X.strokeRect(cx-4,24,72,100)}drawMon(cx+8,30,i,2,false);X.fillStyle=sel?'#FFCC00':'#8888AA';X.font='7px monospace';X.fillText(nms[i],cx+8,82);X.fillStyle=TC[tps[i]];X.font='6px monospace';X.fillText(TN[tps[i]],cx+14,94);const sp=SP[i];X.fillStyle='#666688';X.font='5px monospace';X.fillText('HP:'+sp.bs.hp+' ATK:'+sp.bs.a,cx,104);X.fillText('DEF:'+sp.bs.d+' SPD:'+sp.bs.s,cx,112)}if(G.tk%24<16){X.fillStyle='#FFCC00';X.fillRect(12+G.ss*74+28,20,6,3)}X.fillStyle='#666688';X.font='6px monospace';X.fillText('Arrows: select  Enter: confirm',8,GH-6)}

function loop(){
  G.tk++;
  switch(G.sc){case'title':updTitle();break;case'intro':updDlg();break;case'starter':updStarter();break;case'overworld':updOverworld();break;case'battle':updBattle();break}
  X.clearRect(0,0,GW,GH);
  switch(G.sc){case'title':renTitle();break;case'intro':X.fillStyle='#1A1A2E';X.fillRect(0,0,GW,GH);drawChibi(GW/2-8,40,0,0,'#707070','#404040','#7070C0','#282860','#FFCC99');X.fillStyle='#FFCC88';X.font='8px monospace';X.fillText('PROF. OAK',GW/2-28,28);renDlg();break;case'starter':renStarter();break;case'overworld':renOverworld();break;case'battle':renBattle();break}
  clrIn();requestAnimationFrame(loop);
}
loop();
</script>
