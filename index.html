function buildVerdantTiles() {
    const W=30, H=91; let t=Array.from({length:H},()=>Array(W).fill('1'));
    const rect=(x,y,w,h,c)=>{for(let i=y;i<y+h;i++)for(let j=x;j<x+w;j++)if(i>=0&&i<H&&j>=0&&j<W)t[i][j]=c;};
    // 1-tile wide paths to ensure NPCs can block them
    const pathY=(x,y1,y2,c)=>{for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)if(y>=0&&y<H)t[y][x]=c;};
    const pathX=(y,x1,x2,c)=>{for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)if(x>=0&&x<W)t[y][x]=c;};
    const building=(x,y)=>{rect(x,y,5,1,'6');rect(x,y+1,5,3,'5');t[y+3][x+2]='7';t[y+4][x+2]='4';};
    
    // Cindermere City (0..14)
    rect(0,0,W,15,'2'); rect(0,0,W,2,'8'); building(4,2); building(20,2);
    pathY(15,0,15,'4'); pathX(6,6,15,'4'); pathX(6,16,22,'4');
    // Whisper Woods (15..40)
    rect(0,15,W,26,'2'); pathY(14,15,40,'4');
    for(let y=15;y<41;y++)for(let x=0;x<W;x++){if(x!==14){if(Math.random()<0.55&&t[y][x]==='2')t[y][x]='1';}}
    rect(8,22,4,3,'3'); rect(20,30,4,3,'3'); rect(18,24,3,3,'3');
    // Brookhaven Town (41..55)
    rect(0,41,W,15,'2'); pathY(15,41,55,'4'); building(4,43); building(20,43);
    pathX(47,6,15,'4'); pathX(47,16,22,'4');
    // Mossy Path (56..75)
    rect(0,56,W,20,'2'); pathY(15,56,75,'4');
    rect(5,60,4,3,'3'); rect(20,65,4,3,'3'); rect(8,70,4,3,'3');
    // Willowdale Town (76..90)
    rect(0,76,W,15,'2'); rect(0,89,W,2,'0'); building(4,78); building(20,78);
    pathY(15,76,88,'4'); pathX(82,6,15,'4'); pathX(82,16,22,'4');
    return t.map(r=>r.join(''));
}

function buildInterior(name, exitX, exitY, npc=null) {
    const W=15,H=12; let t=Array.from({length:H},()=>Array(W).fill('2'));
    for(let x=0;x<W;x++){t[0][x]='5';t[H-1][x]='5';} for(let y=0;y<H;y++){t[y][0]='5';t[y][W-1]='5';} t[H-2][7]='9';
    return { name, width:W, height:H, tiles:t.map(r=>r.join('')), warps:[{x:7,y:H-2,target:"overworld",tx:exitX,ty:exitY}], npcs:npc?[npc]:[] };
}

class EventScript {
    constructor(engine) { this.engine = engine; this.queue = []; this.active = false; }
    
    run(script) {
        this.queue = [...script];
        this.active = true;
        gameState.scriptRunning = true;
        this.next();
    }
    
    next() {
        if (this.queue.length === 0) {
            this.active = false;
            gameState.scriptRunning = false;
            return;
        }
        const cmd = this.queue.shift();
        this.execute(cmd);
    }
    
    execute(cmd) {
        switch(cmd.type) {
            case 'moveNPC': this.moveNPC(cmd); break;
            case 'movePlayer': this.movePlayer(cmd); break;
            case 'dialog': this.dialog(cmd); break;
            case 'wait': setTimeout(() => this.next(), cmd.ms); break;
            case 'spawnNPC': this.spawnNPC(cmd); break;
            case 'despawnNPC': this.despawnNPC(cmd); break;
            case 'setFlag': gameState.flags[cmd.flag] = cmd.value; this.next(); break;
            case 'startBattle': this.startBattle(cmd); break;
            case 'giveItem': this.engine.addItem(cmd.id, cmd.count, cmd.pocket); this.next(); break;
            case 'completeQuest': if(gameState.quests[cmd.quest]) gameState.quests[cmd.quest].done = true; this.next(); break;
            case 'faceDir': this.faceDir(cmd); break;
            case 'fade': this.fade(cmd); break;
            case 'healParty': gameState.party.forEach(p => p.currentHp = p.stats.hp); this.next(); break;
            default: this.next(); break;
        }
    }
    
    moveNPC(cmd) {
        const npc = this.findNPC(cmd.id);
        if (!npc) { this.next(); return; }
        const path = this.engine.findPath(npc.x, npc.y, cmd.x, cmd.y);
        if (path && path.length > 0) {
            npc.path = path;
            npc.onPathComplete = () => this.next();
        } else { this.next(); }
    }
    
    movePlayer(cmd) {
        const p = gameState.player;
        const path = this.engine.findPath(p.x, p.y, cmd.x, cmd.y);
        if (path && path.length > 0) {
            p.path = path;
            p.onPathComplete = () => this.next();
        } else { this.next(); }
    }
    
    dialog(cmd) {
        if (cmd.options) {
            const options = cmd.options.map(o => ({
                text: o.text,
                callback: () => { if(o.callback) o.callback.call(this.engine); this.next(); }
            }));
            gameState.dialogQueue.push({ text: cmd.text, options });
        } else {
            gameState.dialogQueue.push({ text: cmd.text, options: null });
            gameState.onDialogComplete = () => {
                gameState.onDialogComplete = null;
                this.next();
            };
        }
        this.engine.processDialogQueue();
    }
    
    spawnNPC(cmd) {
        if (!this.engine.currentMap.npcs) this.engine.currentMap.npcs = [];
        const npc = {...cmd.npc, moving:false, moveProgress:0, path:[], visible:true, onPathComplete:null};
        this.engine.currentMap.npcs.push(npc);
        this.next();
    }
    
    despawnNPC(cmd) {
        if (this.engine.currentMap.npcs) {
            this.engine.currentMap.npcs = this.engine.currentMap.npcs.filter(n => n.sprite !== cmd.id);
        }
        this.next();
    }
    
    startBattle(cmd) {
        this.engine.startBattle(cmd.species, cmd.level, cmd.type, cmd.trainer);
        gameState.onBattleEnd = () => {
            gameState.onBattleEnd = null;
            this.next();
        };
    }
    
    faceDir(cmd) {
        if (cmd.id === 'player') { gameState.player.dir = cmd.dir; }
        else {
            const npc = this.findNPC(cmd.id);
            if (npc) npc.dir = cmd.dir;
        }
        this.next();
    }
    
    fade(cmd) {
        const overlay = document.getElementById('fade-overlay');
        overlay.style.opacity = cmd.opacity;
        setTimeout(() => this.next(), cmd.duration || 300);
    }
    
    findNPC(id) {
        if (!this.engine.currentMap.npcs) return null;
        return this.engine.currentMap.npcs.find(n => n.sprite === id);
    }
}

class GameEngine {
    constructor() {
        this.canvas=document.getElementById('game-canvas');
        this.ctx=this.canvas.getContext('2d');
        this.tileSize=32; this.camera={x:0,y:0}; this.moveSpeed=0.005;
        this.script = new EventScript(this);
        this.resizeCanvas();
        window.addEventListener('resize',()=>this.resizeCanvas());
        this.setupInput();
        this.loadMap('overworld');
        this.showSign("WILLOWDALE TOWN");
        this.startGameLoop();
        document.getElementById('loading').style.display='none';
        setTimeout(() => this.runIntroScript(), 500);
    }

    runIntroScript() {
        this.script.run([
            { type:'dialog', text:"MOM: Oh, sweetie, you're finally awake! I was worried sick." },
            { type:'dialog', text:"MOM: Professor Hazel came by earlier. She said she has something important for you." },
            { type:'dialog', text:"MOM: Her lab is just northeast of here. Go see what she wants, dear." },
            { type:'setFlag', flag:'introDone', value:true },
            { type:'completeQuest', quest:'visitHazel' }
        ]);
    }

    resizeCanvas(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight;this.updateCamera();}

    setupInput() {
        const tl=document.getElementById('touch-layer');
        
        const handleWorldTouch = (cx, cy) => {
            if(gameState.inBattle || gameState.transitioning) return;
            
            if(gameState.currentDialog || gameState.dialogQueue.length > 0) {
                const optDisplay = document.getElementById('dialog-options').style.display;
                if (optDisplay !== 'grid') { this.advanceDialog(); }
                return;
            }
            
            if(this.isUIActive() || gameState.scriptRunning) return;

            const rect=this.canvas.getBoundingClientRect();
            const tx=Math.floor((cx-rect.left+this.camera.x)/this.tileSize);
            const ty=Math.floor((cy-rect.top+this.camera.y)/this.tileSize);
            if(tx<0||ty<0||tx>=this.currentMap.width||ty>=this.currentMap.height)return;
            
            const p=gameState.player;
            let targetNpc=this.currentMap.npcs?this.currentMap.npcs.find(n=>n.x===tx&&n.y===ty&&n.visible):null;
            
            if(targetNpc){
                const adj=[{x:tx,y:ty-1,dir:'down'},{x:tx,y:ty+1,dir:'up'},{x:tx-1,y:ty,dir:'right'},{x:tx+1,y:ty,dir:'left'}];
                let best=null,bd=null;
                for(let a of adj){
                    if(this.isWalkable(a.x,a.y)||(a.x===p.x&&a.y===p.y)){
                        let path=this.findPath(p.x,p.y,a.x,a.y);
                        if(path&&(!best||path.length<best.length)){best=path;bd=a.dir;}
                    }
                }
                if(best){p.path=best;p.interactTarget={npc:targetNpc,dir:bd};if(best.length===0){p.dir=bd;this.handleNPC(targetNpc);}}
            } else {
                if(this.isWalkable(tx,ty)||(tx===p.x&&ty===p.y)){
                    let path=this.findPath(p.x,p.y,tx,ty);
                    if(path){p.path=path;p.interactTarget=null;}
                }
            }
        };

        // Pointer Events (Universal for Mouse and Touch)
        tl.addEventListener('pointerdown', e => { e.preventDefault(); handleWorldTouch(e.clientX, e.clientY); });
        tl.addEventListener('pointermove', e => { if(e.buttons === 1) { e.preventDefault(); handleWorldTouch(e.clientX, e.clientY); } });
        
        document.getElementById('menu-btn').addEventListener('click',()=>this.toggleMenu());
        document.querySelectorAll('.menu-item').forEach(item=>item.addEventListener('click',()=>{
            document.getElementById('menu-screen').classList.remove('active');
            const action = item.dataset.action;
            if(action==='bag'){this.renderBag('items');document.getElementById('bag-screen').classList.add('active');}
            else if(action==='pokemon'){this.renderPokemon();document.getElementById('pokemon-screen').classList.add('active');}
            else if(action==='quest'){this.renderQuests();document.getElementById('quest-screen').classList.add('active');}
            else if(action==='save'){this.queueDialog("Game saved!");this.processDialogQueue();}
        }));
        document.querySelectorAll('.close-btn').forEach(btn => {
            btn.addEventListener('click', () => { document.getElementById(btn.dataset.target).classList.remove('active'); });
        });
        document.querySelectorAll('.pocket-tab').forEach(tab=>tab.addEventListener('click',()=>{
            document.querySelectorAll('.pocket-tab').forEach(t=>t.classList.remove('active'));
            tab.classList.add('active');this.renderBag(tab.dataset.pocket);
        }));
    }

    queueDialog(text, options=null) { gameState.dialogQueue.push({text, options}); }
    processDialogQueue() {
        if(gameState.currentDialog) return;
        if(gameState.dialogQueue.length > 0) {
            gameState.currentDialog = gameState.dialogQueue.shift();
            this.showDialog(gameState.currentDialog.text, gameState.currentDialog.options);
        } else {
            document.getElementById('dialog-box').classList.remove('active');
            if(gameState.onDialogComplete) { const cb = gameState.onDialogComplete; gameState.onDialogComplete = null; cb(); }
        }
    }
    advanceDialog() {
        if(gameState.currentDialog && gameState.currentDialog.options) return;
        gameState.currentDialog = null;
        this.processDialogQueue();
    }

    findPath(sx,sy,tx,ty){
        if(sx===tx&&sy===ty)return[];
        const q=[[sx,sy]],vis=new Set([`${sx},${sy}`]),par={},dirs=[[0,-1],[0,1],[-1,0],[1,0]];
        while(q.length){
            let[cx,cy]=q.shift();
            if(cx===tx&&cy===ty){let path=[],c=`${tx},${ty}`;while(c!==`${sx},${sy}`){let[x,y]=c.split(',').map(Number);path.unshift({x,y});c=par[c];}return path;}
            for(let[dx,dy]of dirs){
                let nx=cx+dx,ny=cy+dy,k=`${nx},${ny}`;
                if(nx>=0&&nx<this.currentMap.width&&ny>=0&&ny<this.currentMap.height&&!vis.has(k)){
                    if(this.isWalkable(nx,ny)||(nx===tx&&ny===ty)){vis.add(k);par[k]=`${cx},${cy}`;q.push([nx,ny]);}
                }
            }
        }
        return null;
    }

    isWalkable(x,y){
        if(y<0||y>=this.currentMap.height||x<0||x>=this.currentMap.width)return false;
        const tile=this.currentMap.tiles[y][x];
        if(['0','1','5','6','8'].includes(tile))return false;
        if(this.currentMap.npcs){
            for(let n of this.currentMap.npcs){
                if(n.x===x&&n.y===y&&n.visible){
                    if(n.sprite==='witherGrunt'&&!gameState.flags.witherDefeated)return false;
                    if(n.defeatFlag&&gameState.flags[n.defeatFlag])return true;
                    return false;
                }
            }
        }
        return true;
    }

    isUIActive(){
        return document.getElementById('menu-screen').classList.contains('active')||
               document.getElementById('bag-screen').classList.contains('active')||
               document.getElementById('pokemon-screen').classList.contains('active')||
               document.getElementById('quest-screen').classList.contains('active');
    }

    loadMap(name){gameState.currentMap=name;this.currentMap=MAPS[name];this.updateCamera();}

    updateCamera(){
        if(!this.currentMap)return;
        let pX=gameState.player.x, pY=gameState.player.y;
        if(gameState.player.moving){
            pX+=(gameState.player.tx-gameState.player.x)*gameState.player.moveProgress;
            pY+=(gameState.player.ty-gameState.player.y)*gameState.player.moveProgress;
        }
        const targetX=pX*this.tileSize-this.canvas.width/2+this.tileSize/2;
        const targetY=pY*this.tileSize-this.canvas.height/2+this.tileSize/2;
        const mapW=this.currentMap.width*this.tileSize, mapH=this.currentMap.height*this.tileSize;
        if(mapW<=this.canvas.width)this.camera.x=(mapW-this.canvas.width)/2;
        else this.camera.x=Math.max(0,Math.min(targetX,mapW-this.canvas.width));
        if(mapH<=this.canvas.height)this.camera.y=(mapH-this.canvas.height)/2;
        else this.camera.y=Math.max(0,Math.min(targetY,mapH-this.canvas.height));
    }

    startGameLoop(){
        let last=0;
        const loop=ts=>{
            const dt=ts-last;last=ts;
            this.update(dt||16);
            this.render();
            requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
    }

    update(dt){
        const p=gameState.player;
        if(p.moving){
            p.moveProgress+=dt*this.moveSpeed;
            if(p.moveProgress>=1){
                p.x=p.tx;p.y=p.ty;p.moveProgress=0;p.moving=false;
                this.checkTileEvents();
            }
        }
        if(this.currentMap.npcs){
            this.currentMap.npcs.forEach(npc => {
                if(npc.moving){
                    npc.moveProgress += dt*this.moveSpeed;
                    if(npc.moveProgress >= 1){
                        npc.x = npc.tx; npc.y = npc.ty; npc.moveProgress = 0; npc.moving = false;
                        if(npc.path && npc.path.length > 0){
                            const next = npc.path.shift();
                            npc.dir = this.getDir(npc.x, npc.y, next.x, next.y);
                            npc.tx = next.x; npc.ty = next.y; npc.moving = true; npc.moveProgress = 0;
                        } else if(npc.onPathComplete){
                            const cb = npc.onPathComplete;
                            npc.onPathComplete = null;
                            cb();
                        }
                    }
                }
            });
        }
        if(!p.moving && !gameState.transitioning && !gameState.currentDialog && gameState.dialogQueue.length===0 && !gameState.scriptRunning){
            if(p.path && p.path.length > 0){
                const next = p.path.shift();
                p.dir = this.getDir(p.x, p.y, next.x, next.y);
                p.tx = next.x; p.ty = next.y; p.moving = true; p.moveProgress = 0;
            } else if(p.interactTarget){
                p.dir = p.interactTarget.dir;
                this.handleNPC(p.interactTarget.npc);
                p.interactTarget = null;
            }
        }
        if(!p.moving && !gameState.transitioning && gameState.scriptRunning){
            if(p.path && p.path.length > 0){
                const next = p.path.shift();
                p.dir = this.getDir(p.x, p.y, next.x, next.y);
                p.tx = next.x; p.ty = next.y; p.moving = true; p.moveProgress = 0;
            } else if(p.onPathComplete){
                const cb = p.onPathComplete;
                p.onPathComplete = null;
                cb();
            }
        }
        this.updateCamera();
    }

    getDir(x1,y1,x2,y2){
        if(y2<y1)return'up';if(y2>y1)return'down';if(x2<x1)return'left';if(x2>x1)return'right';return'down';
    }

    checkTileEvents(){
        const p=gameState.player;
        const tile=this.currentMap.tiles[p.y][p.x];
        if(tile==='7'||tile==='9'){
            const warp=this.currentMap.warps.find(w=>w.x===p.x&&w.y===p.y);
            if(warp){
                gameState.transitioning=true;
                this.canvas.style.opacity=0;
                setTimeout(()=>{
                    this.loadMap(warp.target);
                    gameState.player.x=warp.tx;gameState.player.y=warp.ty;
                    gameState.player.path=[];gameState.player.interactTarget=null;
                    this.updateCamera();
                    this.canvas.style.opacity=1;
                    setTimeout(()=>{gameState.transitioning=false;},150);
                },150);
                return;
            }
        }
        if(this.currentMap.items){
            const item=this.currentMap.items.find(it=>it.x===p.x&&it.y===p.y&&!it.pickedUp);
            if(item){
                item.pickedUp=true;
                this.addItem(item.id,1,'key');
                if(item.id==='luckyLure'){gameState.flags.foundLure=true;gameState.quests.findLure.done=true;}
                this.queueDialog(`You found ${item.id}!`);
                this.processDialogQueue();
            }
        }
        if(tile==='3'&&this.currentMap.encounters&&!gameState.scriptRunning){
            for(let enc of this.currentMap.encounters){
                if(p.y>=enc.yRange[0]&&p.y<=enc.yRange[1]){
                    if(Math.random()<enc.rate){
                        const species=enc.pokemon[Math.floor(Math.random()*enc.pokemon.length)];
                        const lvl=Math.floor(Math.random()*(enc.level[1]-enc.level[0]+1))+enc.level[0];
                        this.startBattle(species,lvl,'wild');
                    }
                    break;
                }
            }
        }
    }

    handleNPC(npc){
        if(npc.sprite==='hazel'){
            if(!gameState.flags.starterChosen){
                this.script.run([
                    { type:'dialog', text:"HAZEL: Ah, you're here! I've been studying three rare Pokémon species native to the Verdant region." },
                    { type:'dialog', text:"HAZEL: They're ready for trainers. Choose your partner!", options:[
                        {text:"Florafa (Grass)",callback:function(){ this.chooseStarter('florafa'); }},
                        {text:"Pyrolyn (Fire)",callback:function(){ this.chooseStarter('pyrolyn'); }},
                        {text:"Aquapup (Water)",callback:function(){ this.chooseStarter('aquapup'); }}
                    ]}
                ]);
            } else {
                this.queueDialog("HAZEL: Train hard! The Verdant region needs strong trainers.");
                this.processDialogQueue();
            }
        } else if(npc.sprite==='mom'){
            if(!gameState.flags.rivalBattleDone){
                this.queueDialog("MOM: Did you get your Pokémon yet? Go see Prof. Hazel!");
                this.processDialogQueue();
            } else if(!gameState.flags.gotPokeBalls){
                this.script.run([
                    { type:'dialog', text:"MOM: Oh, honey! I saw your battle from the window. I'm so proud of you!" },
                    { type:'dialog', text:"MOM: Before you go on your journey... I bought these for you." },
                    { type:'giveItem', id:'pokeBall', count:5, pocket:'balls' },
                    { type:'dialog', text:"You received 5 Poké Balls!" },
                    { type:'dialog', text:"MOM: Now you can catch wild Pokémon! Head north through Mossy Path to Brookhaven Town." },
                    { type:'dialog', text:"MOM: Be careful out there, sweetie. I love you!" },
                    { type:'setFlag', flag:'gotPokeBalls', value:true },
                    { type:'completeQuest', quest:'firstSteps' }
                ]);
            } else {
                this.queueDialog("MOM: Remember to rest if your Pokémon get hurt!");
                this.processDialogQueue();
            }
        } else if(npc.sprite==='fisherman'){
            if(!gameState.flags.learnedCatch){
                this.script.run([
                    { type:'dialog', text:"FISHERMAN: Ah, a new trainer! Welcome to Brookhaven!" },
                    { type:'dialog', text:"FISHERMAN: Let me show you how to catch Pokémon. Watch closely..." },
                    { type:'dialog', text:"FISHERMAN: ...There! I caught a Sparrowl. See? Just weaken the Pokémon first, then throw a Ball!" },
                    { type:'giveItem', id:'pokeBall', count:5, pocket:'balls' },
                    { type:'dialog', text:"You received 5 Poké Balls!" },
                    { type:'dialog', text:"FISHERMAN: Say, I lost my lucky lure somewhere in Whisper Woods. Find it and I'll reward you handsomely!" },
                    { type:'setFlag', flag:'learnedCatch', value:true },
                    { type:'completeQuest', quest:'learnCatch' }
                ]);
            } else if(gameState.flags.foundLure && !gameState.flags.returnedLure){
                this.script.run([
                    { type:'dialog', text:"FISHERMAN: My lucky lure! You found it!" },
                    { type:'dialog', text:"FISHERMAN: Thank you so much. Here, take these Super Potions as a reward." },
                    { type:'giveItem', id:'superPotion', count:2, pocket:'items' },
                    { type:'dialog', text:"You received 2 Super Potions!" },
                    { type:'setFlag', flag:'returnedLure', value:true }
                ]);
            } else {
                this.queueDialog("FISHERMAN: The woods are dangerous. Team Wither has been spotted up ahead. Stay alert!");
                this.processDialogQueue();
            }
        } else if(npc.sprite==='witherGrunt'){
            if(!gameState.flags.witherDefeated){
                this.script.run([
                    { type:'dialog', text:"WITHER GRUNT: Halt! This forest belongs to Team Wither!" },
                    { type:'dialog', text:"WITHER GRUNT: No one passes without a battle! Go, Mouselet!" },
                    { type:'startBattle', species:'mouselet', level:8, type:'trainer', trainer:'witherGrunt' },
                    { type:'dialog', text:"WITHER GRUNT: Argh! You'll pay for this! Team Wither will not be stopped!" },
                    { type:'moveNPC', id:'witherGrunt', x:14, y:15 },
                    { type:'despawnNPC', id:'witherGrunt' },
                    { type:'setFlag', flag:'witherDefeated', value:true },
                    { type:'completeQuest', quest:'beatWither' },
                    { type:'dialog', text:"The path through Whisper Woods is now clear!" }
                ]);
            } else {
                this.queueDialog("The path is clear.");
                this.processDialogQueue();
            }
        } else if(npc.sprite==='guide'){
            this.queueDialog("GUIDE: Leader EMBER uses Fire-types! Water and Rock are super effective. Good luck, trainer!");
            this.processDialogQueue();
        } else if(npc.sprite==='ember'){
            if(!gameState.flags.emberDefeated){
                this.script.run([
                    { type:'moveNPC', id:'ember', x:7, y:5 },
                    { type:'dialog', text:"EMBER: So, you've made it to Cindermere Gym." },
                    { type:'dialog', text:"EMBER: I am Ember, the Gym Leader. My Pokémon burn with an unquenchable passion!" },
                    { type:'dialog', text:"EMBER: Show me your spirit! Battle me!" },
                    { type:'startBattle', species:'flambear', level:12, type:'trainer', trainer:'ember' },
                    { type:'dialog', text:"EMBER: Incredible! Your bond with your Pokémon is strong." },
                    { type:'dialog', text:"EMBER: You've earned the Ember Badge! Take it with pride." },
                    { type:'spawnNPC', npc:{x:7,y:8,sprite:'hazel',color:'#C0A0D0',dir:'up'} },
                    { type:'moveNPC', id:'hazel', x:7, y:6 },
                    { type:'dialog', text:"HAZEL: I saw the whole battle! You were magnificent!" },
                    { type:'dialog', text:"HAZEL: The Verdant region is vast. More gyms, more challenges, and more adventures await." },
                    { type:'dialog', text:"HAZEL: This is just the beginning of your story. Go forth, young trainer!" },
                    { type:'moveNPC', id:'hazel', x:7, y:8 },
                    { type:'despawnNPC', id:'hazel' },
                    { type:'setFlag', flag:'emberDefeated', value:true },
                    { type:'completeQuest', quest:'beatEmber' },
                    { type:'healParty' }
                ]);
            } else {
                this.queueDialog("EMBER: You've earned the Ember Badge. The Verdant region is vast — keep exploring!");
                this.processDialogQueue();
            }
        }
    }

    chooseStarter(species){
        const starter = this.createPokemon(species,5);
        gameState.party = [starter];
        gameState.flags.starterChosen = true;
        gameState.quests.visitHazel.done = true;
        gameState.quests.rivalBattle.desc = "Battle Finn";
        
        const rival = species==='florafa'?'pyrolyn':species==='pyrolyn'?'aquapup':'florafa';
        
        // Push to script queue instead of run to prevent interrupting the current script
        this.script.queue.push(
            { type:'dialog', text:`You chose ${POKEMON_DATA[species].name}!` },
            { type:'spawnNPC', npc:{x:7,y:8,sprite:'finn',color:'#4080C0',dir:'up'} },
            { type:'moveNPC', id:'finn', x:7, y:6 },
            { type:'dialog', text:"FINN: Hey, wait up! Sorry I'm late, Professor!" },
            { type:'dialog', text:"FINN: Oh, you already got one? Then I'll take this one!" },
            { type:'dialog', text:`FINN: Go, ${POKEMON_DATA[rival].name}! Let's battle!` },
            { type:'startBattle', species:rival, level:5, type:'rival', trainer:'finn' },
            { type:'dialog', text:"FINN: Wow, you're strong! I need to train harder." },
            { type:'dialog', text:"FINN: See you around, rival!" },
            { type:'moveNPC', id:'finn', x:7, y:8 },
            { type:'despawnNPC', id:'finn' },
            { type:'dialog', text:"HAZEL: That was impressive! Here, take these as well." },
            { type:'giveItem', id:'potion', count:3, pocket:'items' },
            { type:'dialog', text:"You received 3 Potions!" },
            { type:'dialog', text:"HAZEL: Now go home and tell your mother. She'll want to hear about this!" },
            { type:'completeQuest', quest:'rivalBattle' },
            { type:'setFlag', flag:'rivalBattleDone', value:true }
        );
    }

    createPokemon(species,level){
        const d=POKEMON_DATA[species];
        const stats=this.calculateStats(d.baseStats,level);
        let moves = [];
        if(d.learnset){
            for(let lvl=1; lvl<=level; lvl++){
                if(d.learnset[lvl]){
                    let mv = d.learnset[lvl];
                    if(!moves.some(m => m.name === MOVE_DATA[mv].name)){
                        if(moves.length < 4) moves.push({...MOVE_DATA[mv]});
                        else moves[3] = {...MOVE_DATA[mv]};
                    }
                }
            }
        }
        if(moves.length === 0) moves.push({...MOVE_DATA["tackle"]});
        return{species,name:d.name,level,stats,currentHp:stats.hp,types:d.types,color:d.color,moves,exp:0,expToNext:Math.floor(Math.pow(level,3))};
    }

    calculateStats(base,level){
        const c=s=>Math.floor(((2*base[s])*level)/100)+5;
        return{hp:Math.floor(((2*base.hp)*level)/100)+level+10,atk:c('atk'),def:c('def'),spAtk:c('spAtk'),spDef:c('spDef'),spd:c('spd')};
    }

    startBattle(species,level,type,trainerName){
        gameState.inBattle=true;gameState.battleLock=false;
        const enemy=this.createPokemon(species,level);
        gameState.battleData={type,trainer:trainerName||null,player:gameState.party[0],enemy};
        document.getElementById('enemy-name').textContent=enemy.name;
        document.getElementById('enemy-lvl').textContent=`Lv.${enemy.level}`;
        document.getElementById('player-name').textContent=gameState.party[0].name;
        document.getElementById('player-lvl').textContent=`Lv.${gameState.party[0].level}`;
        document.getElementById('enemy-sprite').style.background=enemy.color;
        document.getElementById('player-sprite').style.background=gameState.party[0].color;
        document.getElementById('battle-screen').classList.add('active');
        this.resetBattleMenu();
        this.updateBattleUI();
        this.logBattle(`A ${type==='wild'?'wild ':''}${enemy.name} appeared!`);
    }

    resetBattleMenu(){
        const m=document.getElementById('battle-menu');
        m.innerHTML=`<div class="battle-option" data-act="fight">FIGHT</div><div class="battle-option" data-act="bag">BAG</div><div class="battle-option" data-act="run">RUN</div>`;
        m.querySelectorAll('.battle-option').forEach(b=>b.addEventListener('click',()=>{
            const a=b.dataset.act;
            if(a==='fight')this.showFightMenu();
            else if(a==='bag')this.openBagInBattle();
            else if(a==='run')this.battleAction('run');
        }));
    }

    showFightMenu(){
        const m=document.getElementById('battle-menu');m.innerHTML='';
        gameState.battleData.player.moves.forEach((mv,i)=>{
            const b=document.createElement('div');b.className='battle-option';b.textContent=mv.name;
            b.addEventListener('click',()=>this.executeTurn(i));m.appendChild(b);
        });
        const back=document.createElement('div');back.className='battle-option';back.textContent='BACK';
        back.addEventListener('click',()=>this.resetBattleMenu());m.appendChild(back);
    }

    openBagInBattle(){this.renderBag('items');document.getElementById('bag-screen').classList.add('active');}

    executeTurn(mi){
        if(gameState.battleLock)return;gameState.battleLock=true;
        const p=gameState.battleData.player,e=gameState.battleData.enemy;
        const pm=p.moves[mi];
        const em=this.chooseEnemyMove(e,p);
        const first=p.stats.spd>=e.stats.spd;
        const sequence = () => {
            if(first){
                this.executeMove(p,e,pm);
                if(e.currentHp>0){
                    setTimeout(()=>{this.executeMove(e,p,em);if(p.currentHp<=0)this.endBattle("lose");else{gameState.battleLock=false;this.resetBattleMenu();}},1500);
                } else this.endBattle("win");
            } else {
                this.executeMove(e,p,em);
                if(p.currentHp>0){
                    setTimeout(()=>{this.executeMove(p,e,pm);if(e.currentHp<=0)this.endBattle("win");else{gameState.battleLock=false;this.resetBattleMenu();}},1500);
                } else this.endBattle("lose");
            }
        };
        sequence();
    }

    chooseEnemyMove(attacker, defender) {
        if (Math.random() < 0.2) return attacker.moves[Math.floor(Math.random() * attacker.moves.length)];
        let bestMove = null, bestScore = -1;
        for (let move of attacker.moves) {
            let score = 0;
            if (move.power > 0) {
                let typeMult = 1;
                defender.types.forEach(t => { if (TYPE_CHART[move.type] && TYPE_CHART[move.type][t]) typeMult *= TYPE_CHART[move.type][t]; });
                const stab = attacker.types.includes(move.type) ? 1.5 : 1;
                score = move.power * typeMult * stab;
                if (typeMult === 0) score = -1;
            } else { score = 1; }
            if (score > bestScore) { bestScore = score; bestMove = move; }
        }
        if (!bestMove || bestScore <= 0) return attacker.moves[Math.floor(Math.random() * attacker.moves.length)];
        return bestMove;
    }

    executeMove(att,def,move){
        this.logBattle(`${att.name} used ${move.name}!`);
        if(move.power>0){
            const aS=att.stats.atk,dS=def.stats.def;
            let tm=1;
            def.types.forEach(t=>{if(TYPE_CHART[move.type]&&TYPE_CHART[move.type][t])tm*=TYPE_CHART[move.type][t];});
            const stab=att.types.includes(move.type)?1.5:1;
            const dmg=Math.max(1,Math.floor((((2*att.level/5+2)*move.power*(aS/dS))/50+2)*tm*stab));
            def.currentHp=Math.max(0,def.currentHp-dmg);
            if(tm>1)this.logBattle("It's super effective!");
            else if(tm<1&&tm>0)this.logBattle("It's not very effective...");
            else if(tm===0)this.logBattle("It doesn't affect the foe...");
        }
        this.updateBattleUI();
    }

    endBattle(result){
        const msg = result==="win" ? "You won!" : result==="lose" ? "You lost..." : result==="catch" ? "Gotcha!" : "Got away!";
        this.logBattle(msg);
        setTimeout(()=>{
            gameState.inBattle=false;gameState.battleLock=false;
            document.getElementById('battle-screen').classList.remove('active');
            document.getElementById('bag-screen').classList.remove('active');
            if(result==="win"){ gameState.party[0].currentHp = gameState.party[0].stats.hp; }
            else if(result==="lose"){
                this.loadMap('overworld');gameState.player.x=15;gameState.player.y=85;
                gameState.party[0].currentHp=gameState.party[0].stats.hp;
                this.updateCamera();
                this.queueDialog("You scurried back home...");
                this.processDialogQueue();
            }
            if(gameState.onBattleEnd){ const cb = gameState.onBattleEnd; gameState.onBattleEnd = null; cb(); }
        },2000);
    }

    battleAction(a){
        if(a==='run'){
            if(gameState.battleData.type==='wild')this.endBattle("run");
            else this.logBattle("Can't run from trainer battles!");
        }
    }

    toggleMenu(){if(gameState.inBattle||this.isUIActive()||gameState.transitioning||gameState.scriptRunning)return;document.getElementById('menu-screen').classList.toggle('active');}

    renderBag(pocket){
        const list=document.getElementById('bag-items-list');list.innerHTML='';
        const items=gameState.bag[pocket]||[];
        if(!items.length){list.innerHTML='<div style="text-align:center;padding:20px;color:#888;">Empty.</div>';return;}
        items.forEach(item=>{
            const d=document.createElement('div');d.className='bag-item';
            d.innerHTML=`<span>${item.id}</span><span>x${item.count}</span>`;
            d.addEventListener('click',()=>this.useItem(item.id,pocket));
            list.appendChild(d);
        });
    }

    useItem(id,pocket){
        if(id==='potion'){
            if(!gameState.party.length)return;
            const p=gameState.party[0];
            if(p.currentHp<p.stats.hp){
                p.currentHp=Math.min(p.stats.hp,p.currentHp+20);
                this.queueDialog(`${p.name} recovered 20 HP!`);this.removeItem(id,1,pocket);
                if(gameState.inBattle){
                    document.getElementById('bag-screen').classList.remove('active');
                    const em=this.chooseEnemyMove(gameState.battleData.enemy, gameState.battleData.player);
                    this.executeMove(gameState.battleData.enemy,gameState.battleData.player,em);
                    if(gameState.battleData.player.currentHp<=0)this.endBattle("lose");
                    else{gameState.battleLock=false;this.resetBattleMenu();}
                } else {this.renderBag(pocket);}
                this.processDialogQueue();
            } else {this.queueDialog("HP is already full!");this.processDialogQueue();}
        } else if(id==='pokeBall'){
            if(gameState.inBattle&&gameState.battleData.type==='wild'){
                this.attemptCatch();this.removeItem(id,1,pocket);
                document.getElementById('bag-screen').classList.remove('active');
            } else {this.queueDialog("Can't use that here!");this.processDialogQueue();}
        } else {this.queueDialog("Can't use that here!");this.processDialogQueue();}
    }

    attemptCatch(){
        const e=gameState.battleData.enemy;
        this.logBattle("You threw a Poké Ball!");
        setTimeout(()=>{
            if(Math.random()<0.7){
                this.logBattle(`Gotcha! ${e.name} was caught!`);
                gameState.party.push(e);
                setTimeout(()=>this.endBattle("catch"),1500);
            } else {
                this.logBattle("Oh no! It broke free!");
                setTimeout(()=>{
                    const em=this.chooseEnemyMove(gameState.battleData.enemy, gameState.battleData.player);
                    this.executeMove(gameState.battleData.enemy,gameState.battleData.player,em);
                    if(gameState.battleData.player.currentHp<=0)this.endBattle("lose");
                    else{gameState.battleLock=false;this.resetBattleMenu();}
                },1500);
            }
        },1500);
    }

    addItem(id,count,pocket){let it=gameState.bag[pocket].find(i=>i.id===id);if(it)it.count+=count;else gameState.bag[pocket].push({id,count});}
    removeItem(id,count,pocket){let it=gameState.bag[pocket].find(i=>i.id===id);if(it){it.count-=count;if(it.count<=0)gameState.bag[pocket]=gameState.bag[pocket].filter(i=>i.id!==id);}}

    renderPokemon(){
        const list=document.getElementById('pokemon-list');list.innerHTML='';
        if(!gameState.party.length){list.innerHTML='<div style="text-align:center;padding:20px;color:#888;">No Pokémon.</div>';return;}
        gameState.party.forEach(p=>{
            const d=document.createElement('div');d.className='pokemon-card';
            d.innerHTML=`<div class="pokemon-sprite-small" style="background:${p.color}"></div><div class="pokemon-info"><h3>${p.name} Lv.${p.level}</h3><div class="pokemon-stats"><span>HP: ${p.currentHp}/${p.stats.hp}</span><span>ATK: ${p.stats.atk}</span><span>DEF: ${p.stats.def}</span><span>SPD: ${p.stats.spd}</span><span>EXP: ${p.exp}/${p.expToNext}</span></div></div>`;
            list.appendChild(d);
        });
    }

    renderQuests(){
        const list=document.getElementById('quest-list');list.innerHTML='';
        for(let q in gameState.quests){
            const quest=gameState.quests[q];
            const d=document.createElement('div');d.className='quest-entry';
            const status=quest.done?'<span class="q-status done">COMPLETE</span>':'<span class="q-status active">ACTIVE</span>';
            d.innerHTML=`<div class="q-name">${quest.name}</div><div class="q-desc">${quest.desc}</div>${status}`;
            list.appendChild(d);
        }
    }

    showDialog(text, options=null){
        const box=document.getElementById('dialog-box');
        const txt=document.getElementById('dialog-text');
        const opt=document.getElementById('dialog-options');
        const arrow=document.querySelector('.dialog-arrow');
        if(text === null && options){ txt.textContent = ""; } else { txt.textContent=text; }
        opt.innerHTML='';
        if(options){
            opt.style.display='grid';arrow.style.display='none';
            options.forEach(o=>{
                const b=document.createElement('div');b.className='dialog-option';b.textContent=o.text;
                b.onclick=()=>{
                    box.classList.remove('active');
                    gameState.currentDialog=null;
                    if(o.callback) o.callback.call(this);
                    this.processDialogQueue();
                };
                opt.appendChild(b);
            });
        } else {
            opt.style.display='none';arrow.style.display='block';
        }
        box.classList.add('active');
    }
    
    showSign(text){const s=document.getElementById('location-sign');s.textContent=text;s.classList.add('active');setTimeout(()=>s.classList.remove('active'),2000);}
    logBattle(msg){document.getElementById('battle-log').textContent=msg;}
    updateBattleUI(){
        const p=gameState.battleData.player,e=gameState.battleData.enemy;
        document.getElementById('player-hp').style.width=`${(p.currentHp/p.stats.hp)*100}%`;
        document.getElementById('enemy-hp').style.width=`${(e.currentHp/e.stats.hp)*100}%`;
        document.getElementById('player-exp').style.width=`${(p.exp/p.expToNext)*100}%`;
    }

    render(){
        this.ctx.fillStyle='#000';
        this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
        if(!this.currentMap)return;
        const sc=Math.floor(this.camera.x/this.tileSize);
        const ec=Math.ceil((this.camera.x+this.canvas.width)/this.tileSize);
        const sr=Math.floor(this.camera.y/this.tileSize);
        const er=Math.ceil((this.camera.y+this.canvas.height)/this.tileSize);
        for(let r=sr;r<=er;r++)for(let c=sc;c<=ec;c++){
            if(r>=0&&c>=0&&r<this.currentMap.height&&c<this.currentMap.width){
                const tile=this.currentMap.tiles[r][c];
                const x=Math.floor(c*this.tileSize-this.camera.x);
                const y=Math.floor(r*this.tileSize-this.camera.y);
                this.drawTile(tile,x,y);
            }
        }
        if(this.currentMap.items){
            this.currentMap.items.forEach(it=>{
                if(!it.pickedUp){
                    const x=Math.floor(it.x*this.tileSize-this.camera.x);
                    const y=Math.floor(it.y*this.tileSize-this.camera.y);
                    this.ctx.fillStyle='#F0D060';
                    this.ctx.beginPath();this.ctx.arc(x+16,y+16,6,0,Math.PI*2);this.ctx.fill();
                }
            });
        }
        this.renderNPCs();this.renderPlayer();
    }

    drawTile(tile,x,y){
        const s=this.tileSize;let c='#FFF';
        if(tile==='0')c='#A0D8F0';else if(tile==='1')c='#90C890';else if(tile==='2')c='#D4F0C0';
        else if(tile==='3')c='#A0D89C';else if(tile==='4')c='#F0E0B0';else if(tile==='5')c='#E0C8A0';
        else if(tile==='6')c='#D0A0A0';else if(tile==='7')c='#C4A484';else if(tile==='8')c='#B0B0B0';else if(tile==='9')c='#F0D060';
        this.ctx.fillStyle=c;this.ctx.fillRect(x,y,s,s);
        if(tile==='2'){this.ctx.fillStyle='#B0E090';this.ctx.beginPath();this.ctx.arc(x+8,y+24,3,0,Math.PI*2);this.ctx.fill();this.ctx.beginPath();this.ctx.arc(x+24,y+16,3,0,Math.PI*2);this.ctx.fill();}
        else if(tile==='3'){this.ctx.fillStyle='#80C078';this.ctx.beginPath();this.ctx.arc(x+8,y+28,4,Math.PI,0);this.ctx.fill();this.ctx.beginPath();this.ctx.arc(x+24,y+28,4,Math.PI,0);this.ctx.fill();}
        else if(tile==='1'){this.ctx.fillStyle='#708060';this.ctx.fillRect(x+14,y+20,4,12);this.ctx.fillStyle='#80B080';this.ctx.beginPath();this.ctx.arc(x+16,y+12,12,0,Math.PI*2);this.ctx.fill();}
        else if(tile==='4'){this.ctx.fillStyle='#E0D0A0';this.ctx.beginPath();this.ctx.arc(x+16,y+16,2,0,Math.PI*2);this.ctx.fill();}
        else if(tile==='6'){this.ctx.fillStyle='#C09090';this.ctx.fillRect(x,y+s-8,s,8);}
        else if(tile==='8'){this.ctx.fillStyle='#909090';this.ctx.beginPath();this.ctx.arc(x+16,y+16,10,0,Math.PI*2);this.ctx.fill();}
    }

    renderPlayer(){
        const p=gameState.player;
        let x=p.x*this.tileSize-this.camera.x, y=p.y*this.tileSize-this.camera.y;
        if(p.moving){
            x+=(p.tx-p.x)*p.moveProgress*this.tileSize;
            y+=(p.ty-p.y)*p.moveProgress*this.tileSize;
        }
        this.ctx.fillStyle='#6080D0';this.ctx.beginPath();this.ctx.arc(x+16,y+22,10,0,Math.PI*2);this.ctx.fill();
        this.ctx.fillStyle='#F8C090';this.ctx.beginPath();this.ctx.arc(x+16,y+10,7,0,Math.PI*2);this.ctx.fill();
        this.ctx.fillStyle='#5A9E5A';this.ctx.beginPath();this.ctx.arc(x+16,y+6,7,Math.PI,0);this.ctx.fill();
        this.ctx.fillStyle='#000';
        if(p.dir==='down'){this.ctx.fillRect(x+12,y+10,2,2);this.ctx.fillRect(x+18,y+10,2,2);}
        else if(p.dir==='left'){this.ctx.fillRect(x+10,y+10,2,2);}
        else if(p.dir==='right'){this.ctx.fillRect(x+20,y+10,2,2);}
    }

    renderNPCs(){
        if(!this.currentMap.npcs)return;
        this.currentMap.npcs.forEach(npc=>{
            if(!npc.visible)return;
            let x=npc.x*this.tileSize-this.camera.x, y=npc.y*this.tileSize-this.camera.y;
            if(npc.moving){
                x+=(npc.tx-npc.x)*npc.moveProgress*this.tileSize;
                y+=(npc.ty-npc.y)*npc.moveProgress*this.tileSize;
            }
            if(x>-32&&x<this.canvas.width&&y>-32&&y<this.canvas.height){
                this.ctx.fillStyle=npc.color||'#FFF';
                this.ctx.beginPath();this.ctx.arc(x+16,y+22,10,0,Math.PI*2);this.ctx.fill();
                this.ctx.fillStyle='#F8C090';
                this.ctx.beginPath();this.ctx.arc(x+16,y+10,7,0,Math.PI*2);this.ctx.fill();
                this.ctx.fillStyle='#000';
                if(npc.dir==='down'){this.ctx.fillRect(x+12,y+10,2,2);this.ctx.fillRect(x+18,y+10,2,2);}
                else if(npc.dir==='left'){this.ctx.fillRect(x+10,y+10,2,2);}
                else if(npc.dir==='right'){this.ctx.fillRect(x+20,y+10,2,2);}
            }
        });
    }
}
window.addEventListener('load',()=>{new GameEngine();});
</script>
</body>
